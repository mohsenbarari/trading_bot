  MKT-10: {state: PROPOSED, section: 3, depends_on: [MKT-8, MKT-9], production: false}
  MKT-11: {state: PROPOSED, section: 3, depends_on: [MKT-7, MKT-9, MKT-10, P2-08], production: false}
  MKT-12: {state: PROPOSED, section: 3, depends_on: [MKT-6, MKT-7, MKT-9], production: false}
  MKT-13: {state: PROPOSED, section: 3, depends_on: [MKT-2, MKT-3, MKT-4, MKT-5, MKT-6, MKT-7, MKT-8, MKT-9, MKT-10, MKT-11, MKT-12, P2-10, DPL-9], production: false}

