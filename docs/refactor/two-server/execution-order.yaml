  P2-06: {state: PROPOSED, section: 2, depends_on: [P2-03, P2-04, P2-05, DPL-5, DPL-6], production: false}
  P2-07: {state: PROPOSED, section: 2, depends_on: [P2-04, P2-06], dns_change: true}
  P2-08: {state: PROPOSED, section: 2, depends_on: [P2-04, P2-06, P2-07], production: false}
  P2-09: {state: PROPOSED, section: 2, depends_on: [P2-05, P2-08], production: false}
  P2-10: {state: PROPOSED, section: 2, depends_on: [P2-01, P2-02, P2-03, P2-04, P2-05, P2-06, P2-07, P2-08, P2-09, MKT-10], production: false}
  P2-11: {state: PROPOSED, section: 2, depends_on: [P1-07, P2-10, MKT-13, DPL-9, DPL-10], production: true}
  P2-12: {state: PROPOSED, section: 2, depends_on: [P2-11, MKT-11, DPL-9, DOC-4, DOC-7], production: true, dns_change: true, writer_change: true}

  MKT-0: {state: PROPOSED, section: 3, depends_on: [P1-00, DOC-3, DOC-5], production: false}
  MKT-1: {state: PROPOSED, section: 3, depends_on: [MKT-0, P2-00], production: false}
  MKT-2: {state: PROPOSED, section: 3, depends_on: [MKT-1], production: false}
  MKT-3: {state: PROPOSED, section: 3, depends_on: [MKT-1, MKT-2], production: false}
