schema_version: "1.1"
plan_id: two-site-refactor-v1
human_source: docs/refactor/two-server/MASTER_PLAN.md
governance_source: docs/refactor/two-server/EXECUTION_GOVERNANCE.md
stage_state_source: docs/refactor/two-server/execution-order.yaml#stages
stage_history_source: docs/refactor/two-server/CHANGE_LEDGER.md
plan_branch: plan/two-server-refactor-v1
design_status: APPROVED
execution_status: AUTHORIZED_CODEX_GATED

authorization:
  delegated_by: project_owner
  delegated_at: "2026-09-03"
  coordinator: CURSOR_COORDINATOR
  worker: CURSOR_WORKER
  final_reviewer: CODEX_FINAL_REVIEWER
  user_stage_approval_required: false
  user_stage_acceptance_required: false
  standard_non_external_stage_start: STANDING_AUTHORIZATION
  stage_completion_requires: CODEX_FINAL_REVIEW_RECEIPT
  external_action_requires: CODEX_SCOPED_PRE_ACTION_RECEIPT
  human_writer_dashboard_action_required: true

rules:
  one_stage_per_worker_run: true
  require_clean_main_baseline: true
  require_clean_integration_baseline: true
  require_codex_final_acceptance: true
  no_worker_self_approval: true
  no_coordinator_self_approval: true
  no_implicit_external_action: true
  no_implicit_dns_or_writer_change: true
  no_implicit_secret_access: true
  no_implicit_destructive_action: true
  no_fixture_only_high_critical_evidence: true
  route_open_decision_to_codex_final_reviewer: true
  stop_on_high_or_critical_gap: true

parallel_execution:
  integration_branch: refactor/two-site-architecture
  default_writer_workers: 1
  max_writer_workers: 2
  second_writer_requires: CODEX_PAIRING_APPROVED
  read_only_second_worker_without_pairing: true
  integrate_serially: true
  candidate_integration_requires: COORDINATOR_ASSIGNMENT_AND_CLEAN_HEAD
  stage_completion_requires: CODEX_REVIEW_OF_EXACT_INTEGRATION_COMMIT
  main_promotion_requires: CODEX_BRANCH_BARRIER_RECEIPT
  full_matrix_serial_on_integrated_head: true
  worker_branch_pattern: refactor/stage/<STAGE_ID>-<slug>
  canonical_integration_worktrees: 1
  max_ephemeral_stage_worktrees: 2
  worktree_registry: .local/two-site-refactor/worktrees.yaml
  default_assignment_expiry_days: 7
  remove_stage_worktree_within_hours_after_close: 24
  pairing_requirements:
    - dependencies_complete
    - exact_base_sha
    - disjoint_allowed_paths
    - disjoint_resource_locks
    - independent_rollback
    - post_merge_integration_tests

exclusive_locks:
  - integration-branch
  - change-ledger
  - database-migrations
  - domain-event-contracts
  - runtime-compose-and-config
  - ansible-and-release-control
  - writer-dns-state-machine
  - shared-test-fixtures
  - production-environment
  - iran-object-storage-mutation

atomic_groups:
  - id: finland_initial_cutover
    stages: [P1-07, DPL-10]

waves:
  - id: W0
    purpose: Baseline, ownership, contracts and deploy audit without behavior change.
    stages: [P1-00, P2-00, MKT-0, DPL-1, DOC-1, DOC-2, DOC-3, DOC-5]
  - id: W1
    purpose: Repository, configuration, artifact, CI and agent-execution foundations.
    stages: [P1-01, P1-02, DPL-2, DPL-3, DPL-6, DPL-7, DPL-8, DOC-6, DOC-8, DOC-10]
  - id: W2
    purpose: Build and rehearse behavior-equivalent Finland consolidation in isolation.
    stages: [P1-03, P1-04, P1-05, MKT-1, MKT-2, MKT-3, MKT-4, MKT-5, MKT-6, DPL-4, DPL-5]
  - id: W3
    purpose: Implement two-site sync, human Writer control, continuity models and dashboards.
    stages: [P2-01, P2-02, P2-03, P2-04, P2-05, P2-06, P2-07, P2-08, P2-09, MKT-7, MKT-8, MKT-9, MKT-10, MKT-11, MKT-12, DOC-4, DOC-7]
  - id: W4
    purpose: Full isolated acceptance, fault injection, rollback and restore evidence.
    stages: [P1-06, P2-10, MKT-13, DPL-9]
  - id: W5
    purpose: One-time Finland production cutover under separate authorization.
    stages: [P1-07, DPL-10]
  - id: W6
    purpose: Admit Iran as synchronized production standby without changing Writer.
    stages: [P2-11]
  - id: W7
    purpose: Authorized real FI-to-IR-to-FI drill and operational acceptance.
    stages: [P2-12]
  - id: W8
    purpose: Retire legacy topology and close documentation only after evidence gates.
    stages: [P1-08, DOC-9]

stages:
  P1-00: {state: IN_PROGRESS, section: 1, depends_on: [], production: false}
  P1-01: {state: PROPOSED, section: 1, depends_on: [P1-00], production: false}
  P1-02: {state: PROPOSED, section: 1, depends_on: [P1-00, DPL-1, DOC-3], production: false}
  P1-03: {state: PROPOSED, section: 1, depends_on: [P1-02, DPL-2, DPL-6], production: false}
  P1-04: {state: PROPOSED, section: 1, depends_on: [P1-03, P2-00, MKT-1], production: false}
  P1-05: {state: PROPOSED, section: 1, depends_on: [P1-04, P2-05, DPL-4], production: false}
  P1-06: {state: PROPOSED, section: 1, depends_on: [P1-05, P2-10, MKT-13, DPL-9], production: false}
  P1-07: {state: PROPOSED, section: 1, depends_on: [P1-06], production: true}
  P1-08: {state: PROPOSED, section: 1, depends_on: [P1-07, P2-11, P2-12, DOC-9], destructive: true}

  P2-00: {state: PROPOSED, section: 2, depends_on: [P1-00, DOC-3], production: false}
  P2-01: {state: PROPOSED, section: 2, depends_on: [P2-00], production: false}
  P2-02: {state: PROPOSED, section: 2, depends_on: [P2-01, DPL-2, DPL-8], production: false}
  P2-03: {state: PROPOSED, section: 2, depends_on: [P2-01, P2-02], production: false}
  P2-04: {state: PROPOSED, section: 2, depends_on: [P2-03, DPL-5], writer_change: true}
