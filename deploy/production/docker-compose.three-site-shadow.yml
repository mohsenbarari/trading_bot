      SMSIR_API_KEY: ""
      SMSIR_LINE_NUMBER: ""
      SMSIR_OTP_TEMPLATE_ID: ""
      SMSIR_OTP_TEMPLATE_PARAMETER: ""
      SMSIR_INVITATION_TEMPLATE_ID: ""
      SMSIR_INVITATION_TEMPLATE_PARAMETER: ""
      SMSIR_ACCOUNTANT_INVITATION_TEMPLATE_ID: ""
      SMSIR_CUSTOMER_INVITATION_TEMPLATE_ID: ""
