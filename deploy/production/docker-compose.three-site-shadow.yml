      - bot_fi_uploads:/app/uploads:ro
    depends_on:
      bot_fi_db: {condition: service_healthy}
      bot_fi_redis: {condition: service_healthy}
      bot_fi_dr_tls: {condition: service_healthy}
      bot_fi_dr_delivery: {condition: service_started}
      bot_fi_dr_projection: {condition: service_started}
    networks: [bot_fi]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  bot_fi_api:
