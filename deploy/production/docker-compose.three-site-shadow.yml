      POSTGRES_USER: webapp_ir_blob
      POSTGRES_PASSWORD: ${WEBAPP_IR_BLOB_DB_PASSWORD:?required}
      DR_SYNC_PEER_URLS_JSON: ${WEBAPP_IR_DR_PEERS_JSON:?required}
      DR_SYNC_PAIRWISE_KEYS_JSON: ${WEBAPP_IR_DR_PAIRWISE_KEYS_JSON:?required}
      DR_BLOB_OBJECT_ENDPOINT: ${DR_BLOB_OBJECT_ENDPOINT:?required}
      DR_BLOB_OBJECT_REGION: ${DR_BLOB_OBJECT_REGION:?required}
      DR_BLOB_OBJECT_BUCKET: ${DR_BLOB_OBJECT_BUCKET:?required}
      DR_BLOB_OBJECT_PREFIX: ${DR_BLOB_OBJECT_PREFIX:?required}
      DR_BLOB_REQUIRE_VERSIONING: "true"
      DR_BLOB_S3_CREDENTIALS_FILE: /run/production-secrets/dr-blob-s3.json
      DR_BLOB_ENCRYPTION_KEYRING_FILE: /run/production-secrets/dr-blob-keyring.json
    volumes:
      - ${PRODUCTION_SHADOW_SECRET_ROOT:?operation-bound secret root is required}/tls/ca.crt:/run/production-dr-ca/ca.crt:ro
      - webapp_ir_uploads:/app/uploads
      - ${PRODUCTION_SHADOW_SECRET_ROOT:?operation-bound secret root is required}/webapp-ir/dr-blob-s3.json:/run/production-secrets/dr-blob-s3.json:ro
      - ${PRODUCTION_SHADOW_SECRET_ROOT:?operation-bound secret root is required}/webapp-ir/dr-blob-keyring.json:/run/production-secrets/dr-blob-keyring.json:ro
    depends_on: {webapp_ir_dr_receiver: {condition: service_healthy}}
    extra_hosts:
      - "webapp-fi-dr.production.internal:${WEBAPP_IR_PEER_WEBAPP_FI_IP:?required}"
    networks: [webapp_ir, webapp_ir_blob_egress]

  webapp_ir_writer_control:
    profiles: [webapp-ir-private, webapp-ir-acceptance, webapp-ir-activation, webapp-ir-effects]
    <<: *app
    command: [python, -m, scripts.run_writer_control_agent]
    environment:
      <<: *webapp_ir_control_env
      TRADING_BOT_SERVICE: writer_control_agent
    volumes:
      - ${PRODUCTION_SHADOW_SECRET_ROOT:?operation-bound secret root is required}/tls/ca.crt:/run/production-dr-ca/ca.crt:ro
      - ${PRODUCTION_SHADOW_SECRET_ROOT:?operation-bound secret root is required}/witness/ca.crt:/run/production-witness-ca/ca.crt:ro
    depends_on: {webapp_ir_db: {condition: service_healthy}}
    networks: [webapp_ir, webapp_ir_witness_egress]

  webapp_ir_dr_tls:
    profiles: [webapp-ir-private, webapp-ir-acceptance, webapp-ir-activation, webapp-ir-effects]
    <<: *nginx
    volumes:
      - ${PRODUCTION_SHADOW_RELEASE_ROOT:?exact immutable release root is required}/deploy/production/three-site-shadow/webapp-ir-dr.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PRODUCTION_SHADOW_SECRET_ROOT:?operation-bound secret root is required}/webapp-ir/tls/server.crt:/run/tls/server.crt:ro
      - ${PRODUCTION_SHADOW_SECRET_ROOT:?operation-bound secret root is required}/webapp-ir/tls/server.key:/run/tls/server.key:ro
    ports:
      - "${WEBAPP_IR_SHADOW_DR_BIND_ADDRESS:?required}:${WEBAPP_IR_SHADOW_DR_PORT:?required}:443"
    depends_on: {webapp_ir_dr_receiver: {condition: service_healthy}}
    networks: [webapp_ir]
    healthcheck:
      test: [CMD, wget, -q, --spider, --no-check-certificate, https://127.0.0.1/health/live]
      interval: 5s
      timeout: 4s
      retries: 20

  webapp_ir_api_acceptance:
    profiles: [webapp-ir-acceptance]
    <<: *app
    restart: "no"
    command: [uvicorn, main:app, --host, 0.0.0.0, --port, "8000", --workers, "1"]
    env_file:
      - path: ${PRODUCTION_SHADOW_SECRET_ROOT:?operation-bound secret root is required}/webapp-ir/runtime.env.api
        required: true
    environment:
      <<: *webapp_ir_app_env
      TRADING_BOT_SERVICE: api
      BACKGROUND_JOBS_ENABLED: "false"
      TELEGRAM_DELIVERY_PRODUCER_MODE: ${TELEGRAM_DELIVERY_PRODUCER_MODE:?required}
      TELEGRAM_DELIVERY_EXPECTED_EXECUTION_OWNER: ${TELEGRAM_DELIVERY_EXPECTED_EXECUTION_OWNER:?required}
      TELEGRAM_WEBAPP_VALIDATION_KEY: ${TELEGRAM_WEBAPP_VALIDATION_KEY:?required}
      ORIGIN_READINESS_API_KEY: ${ORIGIN_READINESS_API_KEY:?required}
      ORIGIN_EXPECTED_MIGRATION_REVISION: ${ORIGIN_EXPECTED_MIGRATION_REVISION:?required}
      ORIGIN_READINESS_REQUIRE_RECOVERY_MANIFEST: "true"
      DR_ISOLATED_CRITICAL_WRITE_POLICY: freeze
      JWT_SECRET_KEY: ${WEBAPP_JWT_SECRET_KEY:?required}
      WEB_PUSH_ENABLED: "false"
      WEB_PUSH_VAPID_PUBLIC_KEY: ""
      WEB_PUSH_VAPID_PRIVATE_KEY: ""
      WEB_PUSH_VAPID_SUBJECT: ""
      SMSIR_API_KEY: ""
      SMSIR_LINE_NUMBER: ""
      SMSIR_OTP_TEMPLATE_ID: ""
      SMSIR_OTP_TEMPLATE_PARAMETER: ""
      SMSIR_INVITATION_TEMPLATE_ID: ""
      SMSIR_INVITATION_TEMPLATE_PARAMETER: ""
      SMSIR_ACCOUNTANT_INVITATION_TEMPLATE_ID: ""
      SMSIR_CUSTOMER_INVITATION_TEMPLATE_ID: ""
      BOT_TOKEN: ""
      TELEGRAM_DELIVERY_QUEUE_CHANNEL_EDITOR_BOT_TOKEN: ""
    volumes:
      - ${PRODUCTION_SHADOW_SECRET_ROOT:?operation-bound secret root is required}/tls/ca.crt:/run/production-dr-ca/ca.crt:ro
      - webapp_ir_uploads:/app/uploads:ro
    depends_on:
      webapp_ir_db: {condition: service_healthy}
      webapp_ir_redis: {condition: service_healthy}
      webapp_ir_dr_tls: {condition: service_healthy}
      webapp_ir_dr_delivery: {condition: service_started}
      webapp_ir_dr_projection: {condition: service_started}
      webapp_ir_blobs: {condition: service_started}
      webapp_ir_writer_control: {condition: service_started}
    networks: [webapp_ir]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  webapp_ir_api:
    profiles: [webapp-ir-activation, webapp-ir-effects]
    <<: *app
    command: [uvicorn, main:app, --host, 0.0.0.0, --port, "8000", --workers, "${WEBAPP_IR_API_WORKERS:?required}"]
    env_file:
      - path: ${PRODUCTION_SHADOW_SECRET_ROOT:?operation-bound secret root is required}/webapp-ir/runtime.env.api
        required: true
    environment:
      <<: *webapp_ir_app_env
      TRADING_BOT_SERVICE: api
      BACKGROUND_JOBS_ENABLED: ${WEBAPP_IR_BACKGROUND_JOBS_ENABLED:?required}
      TELEGRAM_DELIVERY_PRODUCER_MODE: ${TELEGRAM_DELIVERY_PRODUCER_MODE:?required}
      TELEGRAM_DELIVERY_EXPECTED_EXECUTION_OWNER: ${TELEGRAM_DELIVERY_EXPECTED_EXECUTION_OWNER:?required}
      TELEGRAM_WEBAPP_VALIDATION_KEY: ${TELEGRAM_WEBAPP_VALIDATION_KEY:?required}
      ORIGIN_READINESS_API_KEY: ${ORIGIN_READINESS_API_KEY:?required}
      ORIGIN_EXPECTED_MIGRATION_REVISION: ${ORIGIN_EXPECTED_MIGRATION_REVISION:?required}
      ORIGIN_READINESS_REQUIRE_RECOVERY_MANIFEST: "true"
      DR_ISOLATED_CRITICAL_WRITE_POLICY: freeze
      JWT_SECRET_KEY: ${WEBAPP_JWT_SECRET_KEY:?required}
      WEB_PUSH_ENABLED: "true"
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:?required}
      WEB_PUSH_VAPID_PRIVATE_KEY: ""
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:?required}
      SMSIR_API_KEY: ${SMSIR_API_KEY:?required}
      SMSIR_LINE_NUMBER: ${SMSIR_LINE_NUMBER:?required}
      SMSIR_OTP_TEMPLATE_ID: ${SMSIR_OTP_TEMPLATE_ID:?required}
      SMSIR_OTP_TEMPLATE_PARAMETER: ${SMSIR_OTP_TEMPLATE_PARAMETER:?required}
      SMSIR_INVITATION_TEMPLATE_ID: ${SMSIR_INVITATION_TEMPLATE_ID:?required}
      SMSIR_INVITATION_TEMPLATE_PARAMETER: ${SMSIR_INVITATION_TEMPLATE_PARAMETER:?required}
      SMSIR_ACCOUNTANT_INVITATION_TEMPLATE_ID: ${SMSIR_ACCOUNTANT_INVITATION_TEMPLATE_ID:?required}
      SMSIR_CUSTOMER_INVITATION_TEMPLATE_ID: ${SMSIR_CUSTOMER_INVITATION_TEMPLATE_ID:?required}
      BOT_TOKEN: ""
      TELEGRAM_DELIVERY_QUEUE_CHANNEL_EDITOR_BOT_TOKEN: ""
    volumes:
      - ${PRODUCTION_SHADOW_SECRET_ROOT:?operation-bound secret root is required}/tls/ca.crt:/run/production-dr-ca/ca.crt:ro
      - webapp_ir_uploads:/app/uploads
      - webapp_ir_audit:/app/audit_trail
    ports:
      - "127.0.0.1:${WEBAPP_IR_SHADOW_API_PORT:?required}:8000"
    depends_on:
      webapp_ir_db: {condition: service_healthy}
      webapp_ir_redis: {condition: service_healthy}
      webapp_ir_dr_tls: {condition: service_healthy}
      webapp_ir_dr_delivery: {condition: service_started}
      webapp_ir_dr_projection: {condition: service_started}
      webapp_ir_blobs: {condition: service_started}
      webapp_ir_writer_control: {condition: service_started}
    networks: [webapp_ir, webapp_ir_api_egress]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  webapp_ir_effects:
    profiles: [webapp-ir-effects]
    <<: *app
    command: [python, -m, scripts.run_dr_effect_worker]
    environment:
      <<: *webapp_ir_app_env
      TRADING_BOT_SERVICE: dr_effect_worker
      BACKGROUND_JOBS_ENABLED: "false"
      DR_EFFECT_WORKER_ENABLED: "true"
      DR_PROJECTION_DATABASE_URL: postgresql+asyncpg://webapp_ir_effect:${WEBAPP_IR_EFFECT_DB_PASSWORD:?required}@webapp_ir_db/${WEBAPP_IR_POSTGRES_DB:?required}
      SMSIR_API_KEY: ${SMSIR_API_KEY:?required}
      SMSIR_LINE_NUMBER: ${SMSIR_LINE_NUMBER:?required}
      SMSIR_OTP_TEMPLATE_ID: ${SMSIR_OTP_TEMPLATE_ID:?required}
      SMSIR_OTP_TEMPLATE_PARAMETER: ${SMSIR_OTP_TEMPLATE_PARAMETER:?required}
      SMSIR_INVITATION_TEMPLATE_ID: ${SMSIR_INVITATION_TEMPLATE_ID:?required}
      SMSIR_INVITATION_TEMPLATE_PARAMETER: ${SMSIR_INVITATION_TEMPLATE_PARAMETER:?required}
      SMSIR_ACCOUNTANT_INVITATION_TEMPLATE_ID: ${SMSIR_ACCOUNTANT_INVITATION_TEMPLATE_ID:?required}
      SMSIR_CUSTOMER_INVITATION_TEMPLATE_ID: ${SMSIR_CUSTOMER_INVITATION_TEMPLATE_ID:?required}
      WEB_PUSH_ENABLED: "true"
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:?required}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:?required}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:?required}
      WEB_PUSH_TTL_SECONDS: ${WEB_PUSH_TTL_SECONDS:-3600}
      WEB_PUSH_TIMEOUT_SECONDS: ${WEB_PUSH_TIMEOUT_SECONDS:-5.0}
    volumes:
      - ${PRODUCTION_SHADOW_SECRET_ROOT:?operation-bound secret root is required}/tls/ca.crt:/run/production-dr-ca/ca.crt:ro
    depends_on:
      webapp_ir_db: {condition: service_healthy}
      webapp_ir_redis: {condition: service_healthy}
      webapp_ir_api: {condition: service_healthy}
    networks: [webapp_ir, webapp_ir_effect_egress]

  webapp_ir_sync_observer:
    profiles: [webapp-ir-observe]
    <<: *app
    restart: "no"
    command: [python, -c, "raise SystemExit('invoke with docker compose run')"]
    environment:
      <<: *webapp_ir_owner_env
      DATABASE_URL: postgresql+asyncpg://webapp_ir_observer:${WEBAPP_IR_OBSERVER_DB_PASSWORD:?required}@webapp_ir_db/${WEBAPP_IR_POSTGRES_DB:?required}
      SYNC_DATABASE_URL: postgresql://webapp_ir_observer:${WEBAPP_IR_OBSERVER_DB_PASSWORD:?required}@webapp_ir_db/${WEBAPP_IR_POSTGRES_DB:?required}
      POSTGRES_USER: webapp_ir_observer
      POSTGRES_PASSWORD: ${WEBAPP_IR_OBSERVER_DB_PASSWORD:?required}
    volumes:
      - ${PRODUCTION_SHADOW_SECRET_ROOT:?operation-bound secret root is required}/tls/ca.crt:/run/production-dr-ca/ca.crt:ro
      - webapp_ir_uploads:/app/uploads:ro
    depends_on: {webapp_ir_db: {condition: service_healthy}}
    networks: [webapp_ir]

  webapp_ir_convergence_exporter:
    profiles: [webapp-ir-observe]
    <<: *app
    restart: "no"
    command: [python, -c, "raise SystemExit('invoke with docker compose run')"]
    environment:
      <<: *webapp_ir_owner_env
      DATABASE_URL: postgresql+asyncpg://webapp_ir_observer:${WEBAPP_IR_OBSERVER_DB_PASSWORD:?required}@webapp_ir_db/${WEBAPP_IR_POSTGRES_DB:?required}
      SYNC_DATABASE_URL: postgresql://webapp_ir_observer:${WEBAPP_IR_OBSERVER_DB_PASSWORD:?required}@webapp_ir_db/${WEBAPP_IR_POSTGRES_DB:?required}
      POSTGRES_USER: webapp_ir_observer
      POSTGRES_PASSWORD: ${WEBAPP_IR_OBSERVER_DB_PASSWORD:?required}
    volumes:
      - ${PRODUCTION_SHADOW_SECRET_ROOT:?operation-bound secret root is required}/tls/ca.crt:/run/production-dr-ca/ca.crt:ro
      - webapp_ir_uploads:/app/uploads:ro
    depends_on: {webapp_ir_db: {condition: service_healthy}}
    networks: [webapp_ir, webapp_ir_observe_egress]

