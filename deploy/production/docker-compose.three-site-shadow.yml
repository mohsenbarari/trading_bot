services:
  bot_fi_db:
    profiles: [bot-fi-data-ready, bot-fi-restore, bot-fi-prepare, bot-fi-private, bot-fi-acceptance, bot-fi-public, bot-fi-worker, bot-fi-observe]
    <<: *postgres
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_USER: ${BOT_FI_POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${BOT_FI_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${BOT_FI_POSTGRES_DB:?required}
    volumes: [bot_fi_postgres:/var/lib/postgresql/data]
    networks: [bot_fi]

  bot_fi_redis:
    profiles: [bot-fi-data-ready, bot-fi-private, bot-fi-acceptance, bot-fi-public, bot-fi-worker]
    <<: *redis
    volumes: [bot_fi_redis:/data]
    networks: [bot_fi]

  bot_fi_restore_tool:
    profiles: [bot-fi-restore]
    <<: *postgres
    restart: "no"
    command: [sh, -ec, "echo 'invoke with docker compose run and an explicit restore command' >&2; exit 64"]
    healthcheck: {disable: true}
    environment:
      PGHOST: bot_fi_db
      PGUSER: ${BOT_FI_POSTGRES_USER:?required}
      PGPASSWORD: ${BOT_FI_POSTGRES_PASSWORD:?required}
      PGDATABASE: ${BOT_FI_POSTGRES_DB:?required}
    volumes:
      - ${PRODUCTION_SHADOW_DATA_ROOT:?operation-bound data root is required}/restore-input/bot-fi:/run/restore-input:ro
      - bot_fi_uploads:/run/restore-target/uploads
      - bot_fi_audit:/run/restore-target/audit
    depends_on: {bot_fi_db: {condition: service_healthy}}
    networks: [bot_fi]

  bot_fi_migration:
    profiles: [bot-fi-prepare]
    <<: *app
    restart: "no"
    command: [python, manage.py]
    environment: *bot_fi_owner_env
    volumes:
      - ${PRODUCTION_SHADOW_SECRET_ROOT:?operation-bound secret root is required}/tls/ca.crt:/run/production-dr-ca/ca.crt:ro
    depends_on: {bot_fi_db: {condition: service_healthy}}
    networks: [bot_fi]

  bot_fi_db_roles:
    profiles: [bot-fi-prepare]
    <<: *app
    restart: "no"
    command: [python, scripts/provision_bot_database_roles.py, --role-prefix, bot_fi]
    environment:
      <<: *bot_fi_owner_env
      BOT_APP_DB_PASSWORD: ${BOT_FI_APP_DB_PASSWORD:?required}
      BOT_RECEIVER_DB_PASSWORD: ${BOT_FI_RECEIVER_DB_PASSWORD:?required}
      BOT_DELIVERY_DB_PASSWORD: ${BOT_FI_DELIVERY_DB_PASSWORD:?required}
      BOT_PROJECTION_DB_PASSWORD: ${BOT_FI_PROJECTION_DB_PASSWORD:?required}
      BOT_OBSERVER_DB_PASSWORD: ${BOT_FI_OBSERVER_DB_PASSWORD:?required}
    volumes:
      - ${PRODUCTION_SHADOW_SECRET_ROOT:?operation-bound secret root is required}/tls/ca.crt:/run/production-dr-ca/ca.crt:ro
    depends_on: {bot_fi_migration: {condition: service_completed_successfully}}
    networks: [bot_fi]

  bot_fi_dr_receiver:
    profiles: [bot-fi-private, bot-fi-acceptance, bot-fi-public, bot-fi-worker]
    <<: *app
    command: [uvicorn, dr_receiver_app:app, --host, 0.0.0.0, --port, "8000", --workers, "1"]
    environment:
      <<: *bot_fi_projection_env
      TRADING_BOT_SERVICE: dr_receiver
      DATABASE_URL: postgresql+asyncpg://bot_fi_receiver:${BOT_FI_RECEIVER_DB_PASSWORD:?required}@bot_fi_db/${BOT_FI_POSTGRES_DB:?required}
      SYNC_DATABASE_URL: postgresql://bot_fi_receiver:${BOT_FI_RECEIVER_DB_PASSWORD:?required}@bot_fi_db/${BOT_FI_POSTGRES_DB:?required}
      DR_PROJECTION_DATABASE_URL: postgresql+asyncpg://bot_fi_receiver:${BOT_FI_RECEIVER_DB_PASSWORD:?required}@bot_fi_db/${BOT_FI_POSTGRES_DB:?required}
      POSTGRES_USER: bot_fi_receiver
      POSTGRES_PASSWORD: ${BOT_FI_RECEIVER_DB_PASSWORD:?required}
      DR_SYNC_PAIRWISE_KEYS_JSON: ${BOT_FI_DR_PAIRWISE_KEYS_JSON:?required}
      ORIGIN_EXPECTED_MIGRATION_REVISION: ${ORIGIN_EXPECTED_MIGRATION_REVISION:?required}
    volumes:
      - ${PRODUCTION_SHADOW_SECRET_ROOT:?operation-bound secret root is required}/tls/ca.crt:/run/production-dr-ca/ca.crt:ro
    depends_on: {bot_fi_db: {condition: service_healthy}}
    networks: [bot_fi]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  bot_fi_dr_delivery:
    profiles: [bot-fi-private, bot-fi-acceptance, bot-fi-public, bot-fi-worker]
    <<: *app
    command: [python, -m, core.dr_delivery_worker]
    environment:
      <<: *bot_fi_projection_env
      TRADING_BOT_SERVICE: dr_delivery_worker
      DATABASE_URL: postgresql+asyncpg://bot_fi_delivery:${BOT_FI_DELIVERY_DB_PASSWORD:?required}@bot_fi_db/${BOT_FI_POSTGRES_DB:?required}
      SYNC_DATABASE_URL: postgresql://bot_fi_delivery:${BOT_FI_DELIVERY_DB_PASSWORD:?required}@bot_fi_db/${BOT_FI_POSTGRES_DB:?required}
