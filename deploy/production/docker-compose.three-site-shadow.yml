      TRADING_BOT_SERVICE: api
      BACKGROUND_JOBS_ENABLED: ${WEBAPP_FI_BACKGROUND_JOBS_ENABLED:?required}
      TELEGRAM_DELIVERY_PRODUCER_MODE: ${TELEGRAM_DELIVERY_PRODUCER_MODE:?required}
      TELEGRAM_DELIVERY_EXPECTED_EXECUTION_OWNER: ${TELEGRAM_DELIVERY_EXPECTED_EXECUTION_OWNER:?required}
      TELEGRAM_WEBAPP_VALIDATION_KEY: ${TELEGRAM_WEBAPP_VALIDATION_KEY:?required}
      ORIGIN_READINESS_API_KEY: ${ORIGIN_READINESS_API_KEY:?required}
      ORIGIN_EXPECTED_MIGRATION_REVISION: ${ORIGIN_EXPECTED_MIGRATION_REVISION:?required}
      ORIGIN_READINESS_REQUIRE_RECOVERY_MANIFEST: "true"
      DR_ISOLATED_CRITICAL_WRITE_POLICY: freeze
      JWT_SECRET_KEY: ${WEBAPP_JWT_SECRET_KEY:?required}
      WEB_PUSH_ENABLED: "true"
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:?required}
      WEB_PUSH_VAPID_PRIVATE_KEY: ""
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:?required}
      SMSIR_API_KEY: ${SMSIR_API_KEY:?required}
      SMSIR_LINE_NUMBER: ${SMSIR_LINE_NUMBER:?required}
      SMSIR_OTP_TEMPLATE_ID: ${SMSIR_OTP_TEMPLATE_ID:?required}
      SMSIR_OTP_TEMPLATE_PARAMETER: ${SMSIR_OTP_TEMPLATE_PARAMETER:?required}
      SMSIR_INVITATION_TEMPLATE_ID: ${SMSIR_INVITATION_TEMPLATE_ID:?required}
      SMSIR_INVITATION_TEMPLATE_PARAMETER: ${SMSIR_INVITATION_TEMPLATE_PARAMETER:?required}
      SMSIR_ACCOUNTANT_INVITATION_TEMPLATE_ID: ${SMSIR_ACCOUNTANT_INVITATION_TEMPLATE_ID:?required}
      SMSIR_CUSTOMER_INVITATION_TEMPLATE_ID: ${SMSIR_CUSTOMER_INVITATION_TEMPLATE_ID:?required}
      BOT_TOKEN: ""
      TELEGRAM_DELIVERY_QUEUE_CHANNEL_EDITOR_BOT_TOKEN: ""
    volumes:
      - ${PRODUCTION_SHADOW_SECRET_ROOT:?operation-bound secret root is required}/tls/ca.crt:/run/production-dr-ca/ca.crt:ro
      - webapp_fi_uploads:/app/uploads
      - webapp_fi_audit:/app/audit_trail
    ports:
      - "127.0.0.1:${WEBAPP_FI_SHADOW_API_PORT:?required}:8000"
    depends_on:
      webapp_fi_db: {condition: service_healthy}
      webapp_fi_redis: {condition: service_healthy}
      webapp_fi_dr_tls: {condition: service_healthy}
      webapp_fi_dr_delivery: {condition: service_started}
      webapp_fi_dr_projection: {condition: service_started}
      webapp_fi_blobs: {condition: service_started}
      webapp_fi_writer_control: {condition: service_started}
    networks: [webapp_fi, webapp_fi_api_egress]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
