    <<: *app
    restart: "no"
    command:
      - python
      - scripts/manage_webapp_writer.py
      - fence
      - --expected-epoch
      - "1"
      - --expected-active-site
      - webapp_fi
      - --operator
      - production-shadow:${PRODUCTION_SHADOW_OPERATION_ID:?operation UUID is required}
      - --reason
      - initialize WebApp-IR as an operation-bound locally fenced standby
      - --apply
      - --confirm
      - writer:fence:webapp_ir:1:1
    environment:
      <<: *webapp_ir_owner_env
      TRADING_BOT_SERVICE: writer_control_cli
      DATABASE_URL: postgresql+asyncpg://webapp_ir_control:${WEBAPP_IR_CONTROL_DB_PASSWORD:?required}@webapp_ir_db/${WEBAPP_IR_POSTGRES_DB:?required}
      SYNC_DATABASE_URL: postgresql://webapp_ir_control:${WEBAPP_IR_CONTROL_DB_PASSWORD:?required}@webapp_ir_db/${WEBAPP_IR_POSTGRES_DB:?required}
      DR_CONTROL_DATABASE_URL: postgresql+asyncpg://webapp_ir_control:${WEBAPP_IR_CONTROL_DB_PASSWORD:?required}@webapp_ir_db/${WEBAPP_IR_POSTGRES_DB:?required}
      POSTGRES_USER: webapp_ir_control
      POSTGRES_PASSWORD: ${WEBAPP_IR_CONTROL_DB_PASSWORD:?required}
      WRITER_WITNESS_REQUIRED: "false"
      WRITER_WITNESS_AUTO_RENEW_ENABLED: "false"
    volumes:
      - ${PRODUCTION_SHADOW_SECRET_ROOT:?operation-bound secret root is required}/tls/ca.crt:/run/production-dr-ca/ca.crt:ro
    depends_on: {webapp_ir_db_fencing: {condition: service_completed_successfully}}
