    <<: *postgres
    restart: "no"
    command: [sh, -ec, "echo 'invoke with docker compose run and an explicit restore command' >&2; exit 64"]
    healthcheck: {disable: true}
    environment:
      PGHOST: webapp_ir_db
      PGUSER: ${WEBAPP_IR_POSTGRES_USER:?required}
      PGPASSWORD: ${WEBAPP_IR_POSTGRES_PASSWORD:?required}
      PGDATABASE: ${WEBAPP_IR_POSTGRES_DB:?required}
