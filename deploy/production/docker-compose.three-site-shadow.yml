      - --site
      - webapp_fi
      - --application-role
      - webapp_fi_app
      - --projection-role
      - webapp_fi_projection
      - --receiver-role
      - webapp_fi_receiver
      - --delivery-role
      - webapp_fi_delivery
      - --blob-role
      - webapp_fi_blob
      - --effect-role
      - webapp_fi_effect
      - --control-role
      - webapp_fi_control
      - --observer-role
      - webapp_fi_observer
      - --operator
