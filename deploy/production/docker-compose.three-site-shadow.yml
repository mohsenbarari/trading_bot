      - "127.0.0.1:${BOT_FI_SHADOW_API_PORT:?required}:8000"
    depends_on:
      bot_fi_db: {condition: service_healthy}
      bot_fi_redis: {condition: service_healthy}
      bot_fi_dr_tls: {condition: service_healthy}
      bot_fi_dr_delivery: {condition: service_started}
      bot_fi_dr_projection: {condition: service_started}
