      BACKGROUND_JOBS_ENABLED: "false"
      DR_EFFECT_WORKER_ENABLED: "true"
      DR_PROJECTION_DATABASE_URL: postgresql+asyncpg://webapp_fi_effect:${WEBAPP_FI_EFFECT_DB_PASSWORD:?required}@webapp_fi_db/${WEBAPP_FI_POSTGRES_DB:?required}
      SMSIR_API_KEY: ${SMSIR_API_KEY:?required}
      SMSIR_LINE_NUMBER: ${SMSIR_LINE_NUMBER:?required}
      SMSIR_OTP_TEMPLATE_ID: ${SMSIR_OTP_TEMPLATE_ID:?required}
      SMSIR_OTP_TEMPLATE_PARAMETER: ${SMSIR_OTP_TEMPLATE_PARAMETER:?required}
      SMSIR_INVITATION_TEMPLATE_ID: ${SMSIR_INVITATION_TEMPLATE_ID:?required}
      SMSIR_INVITATION_TEMPLATE_PARAMETER: ${SMSIR_INVITATION_TEMPLATE_PARAMETER:?required}
      SMSIR_ACCOUNTANT_INVITATION_TEMPLATE_ID: ${SMSIR_ACCOUNTANT_INVITATION_TEMPLATE_ID:?required}
      SMSIR_CUSTOMER_INVITATION_TEMPLATE_ID: ${SMSIR_CUSTOMER_INVITATION_TEMPLATE_ID:?required}
      WEB_PUSH_ENABLED: "true"
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:?required}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:?required}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:?required}
      WEB_PUSH_TTL_SECONDS: ${WEB_PUSH_TTL_SECONDS:-3600}
      WEB_PUSH_TIMEOUT_SECONDS: ${WEB_PUSH_TIMEOUT_SECONDS:-5.0}
    volumes:
      - ${PRODUCTION_SHADOW_SECRET_ROOT:?operation-bound secret root is required}/tls/ca.crt:/run/production-dr-ca/ca.crt:ro
