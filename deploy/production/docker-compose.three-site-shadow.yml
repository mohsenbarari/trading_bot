    networks: [webapp_ir]

  webapp_ir_db_fencing:
    profiles: [webapp-ir-prepare]
    <<: *app
    restart: "no"
    command:
      - python
      - scripts/activate_three_site_database_fencing.py
      - --site
      - webapp_ir
      - --application-role
      - webapp_ir_app
      - --projection-role
      - webapp_ir_projection
      - --receiver-role
      - webapp_ir_receiver
      - --delivery-role
      - webapp_ir_delivery
      - --blob-role
      - webapp_ir_blob
      - --effect-role
      - webapp_ir_effect
      - --control-role
      - webapp_ir_control
      - --observer-role
      - webapp_ir_observer
      - --operator
      - production-shadow-compose
      - --apply
      - --confirm
      - ENABLE-THREE-SITE-DATABASE-FENCING
    environment: *webapp_ir_owner_env
    volumes:
      - ${PRODUCTION_SHADOW_SECRET_ROOT:?operation-bound secret root is required}/tls/ca.crt:/run/production-dr-ca/ca.crt:ro
    depends_on: {webapp_ir_db_roles_post_migration: {condition: service_completed_successfully}}
