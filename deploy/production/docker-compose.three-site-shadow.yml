      THREE_SITE_EFFECT_DB_PASSWORD: ${WEBAPP_IR_EFFECT_DB_PASSWORD:?required}
      THREE_SITE_CONTROL_DB_PASSWORD: ${WEBAPP_IR_CONTROL_DB_PASSWORD:?required}
      THREE_SITE_OBSERVER_DB_PASSWORD: ${WEBAPP_IR_OBSERVER_DB_PASSWORD:?required}
    volumes:
