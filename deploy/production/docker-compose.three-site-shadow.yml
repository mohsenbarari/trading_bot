name: ${PRODUCTION_SHADOW_PROJECT:?operation-bound project is required}

# Side-by-side exact-release product topology for Bot-FI, WebApp-FI, and
# WebApp-IR. The canonical Witness remains external and independently attested.
# No profile is enabled by default. The data-ready profiles contain only
# PostgreSQL and Redis; every application-capable process requires an explicit
# prepare, private, activation, effects, restore, or observe profile.

x-production-shadow-operation:
  operation_id: ${PRODUCTION_SHADOW_OPERATION_ID:?operation UUID is required}
  project_root: ${PRODUCTION_SHADOW_PROJECT_ROOT:?operation-bound project root is required}
  release_root: ${PRODUCTION_SHADOW_RELEASE_ROOT:?exact immutable release root is required}
  data_root: ${PRODUCTION_SHADOW_DATA_ROOT:?operation-bound data root is required}
  secret_root: ${PRODUCTION_SHADOW_SECRET_ROOT:?operation-bound secret root is required}
  dr_ca_sha256: ${PRODUCTION_SHADOW_DR_CA_SHA256:?required}
  bot_fi_dr_port: ${BOT_FI_SHADOW_DR_PORT:?required}
  witness_url: ${PRODUCTION_SHADOW_WITNESS_URL:?required}
  witness_ip: ${PRODUCTION_SHADOW_WITNESS_IP:?required}
  witness_tls_san: ${PRODUCTION_SHADOW_WITNESS_TLS_SAN:?required}
  witness_ca_sha256: ${PRODUCTION_SHADOW_WITNESS_CA_SHA256:?required}
  witness_server_cert_sha256: ${PRODUCTION_SHADOW_WITNESS_SERVER_CERT_SHA256:?required}
  witness_release_sha: ${PRODUCTION_SHADOW_WITNESS_RELEASE_SHA:?required}
  witness_release_manifest_sha256: ${PRODUCTION_SHADOW_WITNESS_RELEASE_MANIFEST_SHA256:?required}
  witness_health_attestation_sha256: ${PRODUCTION_SHADOW_WITNESS_HEALTH_ATTESTATION_SHA256:?required}
  witness_health_attested_at_epoch: ${PRODUCTION_SHADOW_WITNESS_HEALTH_ATTESTED_AT_EPOCH:?required}
  webapp_provider_config_sha256: ${WEBAPP_PROVIDER_CONFIG_SHA256:?required}
  blob_policy_attestation_sha256: ${DR_BLOB_POLICY_ATTESTATION_SHA256:?required}
  blob_policy_attested_at_epoch: ${DR_BLOB_POLICY_ATTESTED_AT_EPOCH:?required}
  blob_compatibility_attestation_sha256: ${DR_BLOB_COMPATIBILITY_ATTESTATION_SHA256:?required}
  blob_compatibility_attested_at_epoch: ${DR_BLOB_COMPATIBILITY_ATTESTED_AT_EPOCH:?required}
  dr_tls_attestation_sha256: ${PRODUCTION_SHADOW_DR_TLS_ATTESTATION_SHA256:?required}
  dr_tls_attested_at_epoch: ${PRODUCTION_SHADOW_DR_TLS_ATTESTED_AT_EPOCH:?required}

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-app: &app
  image: ${PRODUCTION_SHADOW_APP_IMAGE_ID:?immutable local app image ID is required}
  pull_policy: never
  restart: unless-stopped
  cgroup_parent: ${PRODUCTION_SHADOW_CGROUP_PARENT:?operation-bound cgroup is required}
  cpus: ${PRODUCTION_SHADOW_APP_CPU_LIMIT:-1.0}
  mem_limit: ${PRODUCTION_SHADOW_APP_MEMORY_LIMIT:-768m}
  pids_limit: ${PRODUCTION_SHADOW_APP_PIDS_LIMIT:-256}
  labels:
    trading-bot.production.operation-id: ${PRODUCTION_SHADOW_OPERATION_ID:?operation UUID is required}
  logging: *logging

x-postgres: &postgres
  image: ${PRODUCTION_SHADOW_POSTGRES_IMAGE_ID:?immutable local PostgreSQL image ID is required}
  pull_policy: never
  restart: unless-stopped
  cgroup_parent: ${PRODUCTION_SHADOW_CGROUP_PARENT:?operation-bound cgroup is required}
  cpus: ${PRODUCTION_SHADOW_POSTGRES_CPU_LIMIT:-2.0}
  mem_limit: ${PRODUCTION_SHADOW_POSTGRES_MEMORY_LIMIT:-2g}
  pids_limit: ${PRODUCTION_SHADOW_POSTGRES_PIDS_LIMIT:-512}
  labels:
    trading-bot.production.operation-id: ${PRODUCTION_SHADOW_OPERATION_ID:?operation UUID is required}
  command: [postgres, -c, timezone=UTC, -c, log_timezone=UTC]
  logging: *logging
  healthcheck:
    test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 30

x-redis: &redis
  image: ${PRODUCTION_SHADOW_REDIS_IMAGE_ID:?immutable local Redis image ID is required}
  pull_policy: never
  restart: unless-stopped
  cgroup_parent: ${PRODUCTION_SHADOW_CGROUP_PARENT:?operation-bound cgroup is required}
  cpus: ${PRODUCTION_SHADOW_REDIS_CPU_LIMIT:-0.5}
  mem_limit: ${PRODUCTION_SHADOW_REDIS_MEMORY_LIMIT:-512m}
  pids_limit: ${PRODUCTION_SHADOW_REDIS_PIDS_LIMIT:-128}
  labels:
    trading-bot.production.operation-id: ${PRODUCTION_SHADOW_OPERATION_ID:?operation UUID is required}
  command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory-policy, noeviction]
  logging: *logging
  healthcheck:
    test: [CMD, redis-cli, ping]
    interval: 5s
    timeout: 3s
    retries: 30

x-nginx: &nginx
  image: ${PRODUCTION_SHADOW_NGINX_IMAGE_ID:?immutable local Nginx image ID is required}
  pull_policy: never
  restart: unless-stopped
  cgroup_parent: ${PRODUCTION_SHADOW_CGROUP_PARENT:?operation-bound cgroup is required}
  cpus: ${PRODUCTION_SHADOW_NGINX_CPU_LIMIT:-0.25}
  mem_limit: ${PRODUCTION_SHADOW_NGINX_MEMORY_LIMIT:-128m}
  pids_limit: ${PRODUCTION_SHADOW_NGINX_PIDS_LIMIT:-64}
  labels:
    trading-bot.production.operation-id: ${PRODUCTION_SHADOW_OPERATION_ID:?operation UUID is required}
  logging: *logging

x-three-site: &three_site
  TZ: UTC
  ENVIRONMENT: production
  TRUSTED_PROXY_CIDRS: ${PRODUCTION_SHADOW_TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128,172.16.0.0/12}
  TOPOLOGY_SCHEMA_VERSION: three-site-dr-v1
  THREE_SITE_DR_ENABLED: "true"
  DR_EVENT_PROTOCOL_ENABLED: "true"
  DR_EVENT_PROTOCOL_STRICT: "true"
  DR_SYNC_VERIFY_TLS: "true"
  DR_SYNC_CA_BUNDLE: /run/production-dr-ca/ca.crt
  RELEASE_SHA: ${PRODUCTION_SHADOW_RELEASE_SHA:?exact release SHA is required}
  BACKGROUND_JOBS_ENABLED: "false"

