    profiles: [bot-fi-private, bot-fi-acceptance, bot-fi-public, bot-fi-worker]
    <<: *nginx
    volumes:
      - ${PRODUCTION_SHADOW_RELEASE_ROOT:?exact immutable release root is required}/deploy/production/three-site-shadow/bot-fi-dr.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PRODUCTION_SHADOW_SECRET_ROOT:?operation-bound secret root is required}/bot-fi/tls/server.crt:/run/tls/server.crt:ro
      - ${PRODUCTION_SHADOW_SECRET_ROOT:?operation-bound secret root is required}/bot-fi/tls/server.key:/run/tls/server.key:ro
    ports:
      - "${BOT_FI_SHADOW_DR_BIND_ADDRESS:?required}:${BOT_FI_SHADOW_DR_PORT:?required}:443"
    depends_on: {bot_fi_dr_receiver: {condition: service_healthy}}
    networks: [bot_fi]
    healthcheck:
      test: [CMD, wget, -q, --spider, --no-check-certificate, https://127.0.0.1/health/live]
      interval: 5s
      timeout: 4s
      retries: 20

  bot_fi_api_acceptance:
