  webapp_fi_db:
    profiles: [webapp-fi-data-ready, webapp-fi-restore, webapp-fi-prepare, webapp-fi-private, webapp-fi-acceptance, webapp-fi-activation, webapp-fi-effects, webapp-fi-observe]
