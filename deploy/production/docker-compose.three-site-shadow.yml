      webapp_fi_redis: {condition: service_healthy}
      webapp_fi_api: {condition: service_healthy}
    networks: [webapp_fi, webapp_fi_effect_egress]

  webapp_fi_sync_observer:
    profiles: [webapp-fi-observe]
    <<: *app
    restart: "no"
    command: [python, -c, "raise SystemExit('invoke with docker compose run')"]
    environment:
      <<: *webapp_fi_owner_env
      DATABASE_URL: postgresql+asyncpg://webapp_fi_observer:${WEBAPP_FI_OBSERVER_DB_PASSWORD:?required}@webapp_fi_db/${WEBAPP_FI_POSTGRES_DB:?required}
      SYNC_DATABASE_URL: postgresql://webapp_fi_observer:${WEBAPP_FI_OBSERVER_DB_PASSWORD:?required}@webapp_fi_db/${WEBAPP_FI_POSTGRES_DB:?required}
