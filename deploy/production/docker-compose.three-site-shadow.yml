    extra_hosts:
      - "webapp-fi-dr.production.internal:${BOT_FI_PEER_WEBAPP_FI_IP:?required}"
    networks: [bot_fi, bot_fi_dr_egress]

  bot_fi_dr_projection:
    profiles: [bot-fi-private, bot-fi-acceptance, bot-fi-public, bot-fi-worker]
    <<: *app
    command: [python, -m, core.dr_projection_worker]
