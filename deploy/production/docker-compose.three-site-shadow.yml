      DR_PROJECTION_DATABASE_URL: postgresql+asyncpg://webapp_ir_delivery:${WEBAPP_IR_DELIVERY_DB_PASSWORD:?required}@webapp_ir_db/${WEBAPP_IR_POSTGRES_DB:?required}
