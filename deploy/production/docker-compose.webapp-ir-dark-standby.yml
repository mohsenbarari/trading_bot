# Standalone DB-only manifest for one data-ready WebApp-IR restore operation.
#
# Do NOT combine this file with another Compose file. Application-capable
# services are absent, the exact database image must already be loaded, and the
# database has neither a host port nor a container network while the site is
# dark.
name: trading_bot_dark_ir_${DARK_STANDBY_OPERATION_ID:?canonical operation id required}

services:
  db:
    image: ${DARK_STANDBY_DB_IMAGE_ID:?immutable target-local database image ID required}
    pull_policy: never
    restart: unless-stopped
    network_mode: none
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-150}
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"

volumes:
  postgres_data:
    name: trading_bot_dark_ir_${DARK_STANDBY_OPERATION_ID:?canonical operation id required}_postgres_data
