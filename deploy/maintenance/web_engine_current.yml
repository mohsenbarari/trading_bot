---
# Public source/control staging and prepare are separate, fresh-only steps.
# Default check never creates a service, fence, backup, or runtime resource.
- name: Check or start one fresh Web engine window
  hosts: web_engine
  gather_facts: false
  any_errors_fatal: true
  vars:
    engine08_action: check
    engine08_root: /root/.local/security-web-engine-20261024-task08
    engine08_controller: /root/.local/security-web-engine-20261024-task08/source/deploy/maintenance/web_engine_current_controller.py
  tasks:
    - name: Require the exact pinned Web inventory and closed source operation
      ansible.builtin.assert:
        that:
          - groups['all'] == ['web_engine']
          - ansible_host == '65.109.220.59' and ansible_port | int == 37067 and ansible_user == 'root'
          - ansible_ssh_common_args == '-o BatchMode=yes -o StrictHostKeyChecking=yes -o ForwardAgent=no -o UpdateHostKeys=no -o ConnectTimeout=10 -o ControlMaster=no -S none'
          - engine08_action in ['check', 'start']
          - engine08_root == '/root/.local/security-web-engine-20261024-task08'
          - engine08_controller == engine08_root + '/source/deploy/maintenance/web_engine_current_controller.py'
          - engine08_manifest_sha256 is match('^[a-f0-9]{64}$')
          - engine08_nonce is match('^[a-f0-9]{32}$')

    - name: Bind the reviewed public controller and fresh manifest before executing it
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - -B
          - -c
          - |
            import hashlib,json,os,pathlib,stat,sys
            root=pathlib.Path('/root/.local/security-web-engine-20261024-task08')
            def public(path,maximum):
                assert path.resolve(strict=True)==path
                for p in path.parents:
                    s=p.lstat();assert stat.S_ISDIR(s.st_mode) and s.st_uid==0 and not s.st_mode&0o022
                fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
                try:
                    s=os.fstat(fd);assert stat.S_ISREG(s.st_mode) and s.st_uid==0 and s.st_nlink==1 and stat.S_IMODE(s.st_mode)==0o600 and 0<s.st_size<=maximum
                    raw=os.pread(fd,maximum+1,0)
                    def identity(v):return (v.st_dev,v.st_ino,v.st_mode,v.st_uid,v.st_gid,v.st_nlink,v.st_size,v.st_mtime_ns,v.st_ctime_ns)
                    assert len(raw)==s.st_size and identity(s)==identity(os.fstat(fd))==identity(path.lstat())
                    return raw
                finally:os.close(fd)
            controller=public(root/'source/deploy/maintenance/web_engine_current_controller.py',131072)
            assert hashlib.sha256(controller).hexdigest()=='752aae16b2fd913af98dd67be41371a41dd53235ff15a3ed03723dc4ade2917b'
            raw=public(root/'plan.json',2*1024**2);assert hashlib.sha256(raw).hexdigest()==sys.argv[1]
            plan=json.loads(raw);assert plan['schema']=='web_engine_current_plan/1' and plan['operation_id']=='security-web-engine-20261024-08' and plan['nonce']==sys.argv[2]
            print('{"public_source_binding_verified":true}')
          - '{{ engine08_manifest_sha256 }}'
          - '{{ engine08_nonce }}'
      changed_when: false
      check_mode: false

    - name: Perform the complete read-only current-profile and storage preflight
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, -B, '{{ engine08_controller }}', check, --manifest-sha256, '{{ engine08_manifest_sha256 }}']
      timeout: 600
      changed_when: false
      check_mode: false

    - name: Finish the default read-only action
      ansible.builtin.meta: end_play
      when: engine08_action == 'check' or ansible_check_mode

    - name: Refuse an existing supervisor service or descendant cgroup
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - -B
          - -c
          - |
            import pathlib,subprocess,sys
            unit='security-web-engine-08-'+sys.argv[1]+'.service'
            r=subprocess.run(['/usr/bin/systemctl','show',unit,'-p','LoadState','--value'],check=True,capture_output=True,timeout=10)
            assert r.stdout==b'not-found\n' and not pathlib.Path('/sys/fs/cgroup/system.slice',unit).exists()
          - '{{ engine08_nonce }}'
      changed_when: false

    - name: Start one durable finite supervisor with no automatic restart
      ansible.builtin.command:
        argv:
          - /usr/bin/systemd-run
          - --no-ask-password
          - --expand-environment=no
          - --unit=security-web-engine-08-{{ engine08_nonce }}.service
          - --description=current-engine-supervisor:security-web-engine-20261024-08:{{ engine08_nonce }}:{{ engine08_manifest_sha256 }}
          - --property=Type=exec
          - --property=Restart=no
          - --property=RuntimeMaxSec=5520
          - --property=TimeoutStopSec=10
          - --property=KillMode=control-group
          - --property=UMask=0077
          - --property=LimitFSIZE=infinity
          - --property=StandardOutput=journal
          - --property=StandardError=journal
          - /usr/bin/env
          - -i
          - PATH=/usr/sbin:/usr/bin:/sbin:/bin
          - LC_ALL=C.UTF-8
          - DOCKER_HOST=unix:///var/run/docker.sock
          - /usr/bin/python3
          - -I
          - -B
          - '{{ engine08_controller }}'
          - run
          - --manifest-sha256
          - '{{ engine08_manifest_sha256 }}'
          - --apply
      timeout: 20
      # A failed/unknown launch is not retried or adopted. Inspect its exact
      # service, new journal and owned fences before any separate recovery.
