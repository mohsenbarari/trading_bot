[defaults]
host_key_checking = True
retry_files_enabled = False
interpreter_python = /usr/bin/python3
timeout = 15
[ssh_connection]
usetty = False
transfer_method = piped
ssh_args = -F /dev/null -o ControlMaster=no -S none -o BatchMode=yes -o ForwardAgent=no -o StrictHostKeyChecking=yes -o UpdateHostKeys=no
