---
- name: Continue HOT3 in fresh attempt02 with the original finite deadline
  hosts: web_engine
  gather_facts: false
  any_errors_fatal: true
  vars:
    hot3_source: "{{ lookup('ansible.builtin.file', playbook_dir + '/web_market_hot3.py', rstrip=false) }}"
    hot3_argv:
      - /usr/bin/env
      - -i
      - PATH=/usr/sbin:/usr/bin:/sbin:/bin
      - LC_ALL=C.UTF-8
      - /usr/bin/python3
      - -I
      - -B
      - -c
      - '{{ hot3_source }}'
      - run
      - --deadline-utc
      - '{{ hot3_deadline_utc }}'
      - --nonce
      - '{{ hot3_nonce }}'
      - --transport-sha256
      - '{{ hot3_transport_sha256 }}'
      - --own-source
      - '{{ hot3_source }}'
      - --own-sha256
      - d2cbb79e9bd3bddee493fc5a6f139a7fbddfef3538b4f8f2b2b33db4b9137806
      - --web-engine-preflight
      - "{{ lookup('ansible.builtin.file', playbook_dir + '/web_engine_preflight.py', rstrip=false) }}"
      - --web-market-managed-config
      - "{{ lookup('ansible.builtin.file', playbook_dir + '/web_market_managed_config.py', rstrip=false) }}"
      - --backup-market-pipeline-archive
      - "{{ lookup('ansible.builtin.file', playbook_dir + '/../../scripts/backup_market_pipeline_archive.py', rstrip=false) }}"
      - --prepare-market-pipeline-primary-release
      - "{{ lookup('ansible.builtin.file', playbook_dir + '/../../scripts/prepare_market_pipeline_primary_release.py', rstrip=false) }}"
      - --prepare-market-pipeline-release
      - "{{ lookup('ansible.builtin.file', playbook_dir + '/../../scripts/prepare_market_pipeline_release.py', rstrip=false) }}"
      - --crypt-market-pipeline-backup
      - "{{ lookup('ansible.builtin.file', playbook_dir + '/../../scripts/crypt_market_pipeline_backup.py', rstrip=false) }}"
      - --web-market-hot3-offhost
      - "{{ lookup('ansible.builtin.file', playbook_dir + '/web_market_hot3_offhost.py', rstrip=false) }}"
  tasks:
    - name: Require the exact Web inventory and fresh finite operation inputs
      ansible.builtin.assert:
        that:
          - groups['all'] == ['web_engine']
          - ansible_host == '65.109.220.59' and ansible_port | int == 37067 and ansible_user == 'root'
          - ansible_ssh_common_args == '-o BatchMode=yes -o StrictHostKeyChecking=yes -o ForwardAgent=no -o UpdateHostKeys=no -o ConnectTimeout=10 -o ControlMaster=no -S none'
          - hot3_deadline_utc == '2026-10-24T20:08:55.730262Z'
          - hot3_nonce is defined and hot3_nonce is match('^[a-f0-9]{32}$')
          - hot3_transport_sha256 == '539910168632df009a175f373693bb441d499292fd24413bdca9328141f394e0'
          - hot3_source | hash('sha256') == 'd2cbb79e9bd3bddee493fc5a6f139a7fbddfef3538b4f8f2b2b33db4b9137806'
    - name: Run the reviewed finite producer under retained marker and independent watchdog scopes
      # The producer stages only public source before taking M. Its watchdog
      # survives this client and owns only nonce-labelled restores/backends.
      ansible.builtin.command:
        argv: '{{ hot3_argv }}'
      timeout: 7350
      check_mode: false
      register: hot3_result
      changed_when: (hot3_result.stdout | from_json).hot_backup_verified | default(false)
    - name: Report only the bounded backup verification verdict
      ansible.builtin.debug:
        msg: '{{ hot3_result.stdout | from_json }}'
