---
- name: Close only the aborted original C07 ownership transaction
  hosts: web_engine
  gather_facts: false
  any_errors_fatal: true
  vars:
    closure_action: check
    closure_confirmation: ''
    closure_argv:
      - /usr/bin/python3
      - -I
      - -B
      - -c
      - "{{ lookup('ansible.builtin.file', playbook_dir + '/web_c07_terminal_closure.py', rstrip=false) }}"
      - "{{ lookup('ansible.builtin.file', playbook_dir + '/web_capture2_observability.py', rstrip=false) }}"
      - "{{ lookup('ansible.builtin.file', playbook_dir + '/web_qa_parking.py', rstrip=false) }}"
      - "{{ lookup('ansible.builtin.file', playbook_dir + '/web_qa_retirement.py', rstrip=false) }}"
      - "{{ lookup('ansible.builtin.file', playbook_dir + '/web_market_hot_preflight.py', rstrip=false) }}"
      - "{{ lookup('ansible.builtin.file', playbook_dir + '/web_capture2_compose_parity.py', rstrip=false) }}"
  tasks:
    - name: Require the exact Web lane and reviewed finite closure source
      ansible.builtin.assert:
        that:
          - groups['all'] == ['web_engine']
          - ansible_host == '65.109.220.59' and ansible_port | int == 37067 and ansible_user == 'root'
          - ansible_ssh_common_args == '-o BatchMode=yes -o StrictHostKeyChecking=yes -o ForwardAgent=no -o UpdateHostKeys=no -o ConnectTimeout=10 -o ControlMaster=no -S none'
          - closure_action in ['check', 'close']
          - closure_action == 'check' or closure_confirmation == 'CLOSE-ONLY-ABORTED-C07-OWNED-FENCES-20261024-01'
          - closure_argv[4] | hash('sha256') == '2e07111721f9e40cdef592f55d885f0590bd17dce3add5be5ed1b6fe22d09ef4'
    - name: Independently verify current restored intent and immutable old evidence
      ansible.builtin.command:
        argv: "{{ ['/usr/bin/env', '-i', 'PATH=/usr/sbin:/usr/bin:/sbin:/bin', 'LC_ALL=C.UTF-8', 'DOCKER_HOST=unix:///var/run/docker.sock'] + closure_argv + ['check'] }}"
      changed_when: false
      check_mode: false
      timeout: 600
    - name: Default and check mode end without releasing any fence
      ansible.builtin.meta: end_play
      when: closure_action == 'check' or ansible_check_mode
    - name: Refuse an existing new closure owner or log
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - -B
          - -c
          - |
            import os,subprocess
            assert not os.path.lexists('/root/.local/security-web-c07-terminal-closure-20261024-01.log')
            p=subprocess.run(['/usr/bin/systemctl','show','security-web-c07-terminal-closure-20261024-01.service','-p','LoadState','--value'],capture_output=True,check=True,timeout=10)
            assert p.stdout==b'not-found\n'
      changed_when: false
      timeout: 20
    - name: Launch the finite closure that removes only the two exact owned dead fences
      ansible.builtin.command:
        argv: "{{ ['/usr/bin/systemd-run', '--no-ask-password', '--expand-environment=no', '--unit=security-web-c07-terminal-closure-20261024-01.service', '--property=Type=exec', '--property=Restart=no', '--property=RuntimeMaxSec=630', '--property=TimeoutStopSec=10', '--property=KillMode=control-group', '--property=UMask=0077', '--property=LimitCORE=0', '--property=StandardOutput=append:/root/.local/security-web-c07-terminal-closure-20261024-01.log', '--property=StandardError=append:/root/.local/security-web-c07-terminal-closure-20261024-01.log', '/usr/bin/env', '-i', 'PATH=/usr/sbin:/usr/bin:/sbin:/bin', 'LC_ALL=C.UTF-8', 'DOCKER_HOST=unix:///var/run/docker.sock'] + closure_argv + ['close', '--confirmation', closure_confirmation] }}"
      timeout: 30
