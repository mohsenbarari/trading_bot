---
- name: Prepare the bounded cash-revision export correction on Web
  hosts: price_fix_web
  gather_facts: false
  vars:
    processor_fix_root: /srv/trading-bot/incident-recovery/20261105-cash-revisions-priority
    processor_base_id: sha256:af8ebc630a7b3bebaf2ce7df96866eee4300d47bd8b036dfe6002f2b45cec7ec
  tasks:
    - name: Require the verified host and reviewed source commit
      ansible.builtin.assert:
        that:
          - ansible_host == '65.109.220.59'
          - processor_source_commit is match('^[a-f0-9]{40}$')

    - name: Create the isolated two-file public build context
      ansible.builtin.file:
        path: '{{ processor_fix_root }}/image-context'
        state: directory
        mode: '0700'

    - name: Copy only the reviewed public build files
      ansible.builtin.copy:
        src: '{{ item.src }}'
        dest: '{{ processor_fix_root }}/image-context/{{ item.dest }}'
        mode: '0600'
      loop:
        - {src: '{{ playbook_dir }}/market_processor_revision_priority_hotfix.Dockerfile', dest: Dockerfile}
        - {src: '{{ playbook_dir }}/../../core/market_intelligence/market_fact_projection.py', dest: market_fact_projection.py}

    - name: Bind the local base tag to the exact secured running processor image
      ansible.builtin.command:
        argv: [docker, image, tag, '{{ processor_base_id }}', 'local/cash-revision-priority-base:af8ebc63']
      changed_when: false

    - name: Build only the corrected source layer without network
      ansible.builtin.command:
        argv:
          - docker
          - build
          - --network=none
          - --pull=false
          - --build-arg
          - PROCESSOR_BASE=local/cash-revision-priority-base:af8ebc63
          - --build-arg
          - 'SOURCE_COMMIT={{ processor_source_commit }}'
          - --iidfile
          - '{{ processor_fix_root }}/candidate-image.id'
          - --tag
          - 'local/cash-revision-priority:{{ processor_source_commit }}'
          - '{{ processor_fix_root }}/image-context'

    - name: Stage the reviewed normal activation and public-reference primitives
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/normal_activation/{{ item }}'
        dest: '{{ processor_fix_root }}/{{ item }}'
        mode: '0600'
      loop: [activate_services.py, datastore_primitives.py, update_market_publicrefs.py]

    - name: Stage the unchanged normal watchdog helper
      ansible.builtin.copy:
        src: /srv/trading-bot/production-data/security-normal-service-activation-20261102-04/hold_receiver_watchdog.py
        dest: '{{ processor_fix_root }}/hold_receiver_watchdog.py'
        mode: '0600'
