---
- name: Finish only the exact failed owned Web recovery intent
  hosts: web_engine
  gather_facts: false
  any_errors_fatal: true
  vars:
    owned_web_intent_action: check
    owned_web_intent_confirmation: ''
  tasks:
    - name: Require the original pinned SSH lane and exact explicit action
      ansible.builtin.assert:
        that:
          - groups['all'] == ['web_engine']
          - ansible_host == '65.109.220.59' and ansible_port | int == 37067 and ansible_user == 'root'
          - ansible_ssh_common_args == '-o BatchMode=yes -o StrictHostKeyChecking=yes -o ForwardAgent=no -o UpdateHostKeys=no -o ConnectTimeout=10 -o ControlMaster=no -S none'
          - owned_web_intent_action in ['check', 'restore_intent']
          - owned_web_intent_action == 'check' or owned_web_intent_confirmation == 'FINISH-OWNED-WEB-ENGINE-07-INTENT'
    - name: Prove all original ownership and DB API conditions without mutation
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - -B
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/web_engine_owned_intent.py') }}"
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/web_engine_owned_restore.py', rstrip=false) }}"
          - check
      changed_when: false
      check_mode: false
      timeout: 240
    - name: Read-only and check mode end without creating any file or owner
      ansible.builtin.meta: end_play
      when: owned_web_intent_action == 'check' or ansible_check_mode
    - name: Refuse any previous owned intent launch or log
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - -B
          - -c
          - |
            import os,subprocess
            assert not os.path.lexists('/root/.local/security-web-engine-20261024-task07/owned_intent.log')
            result=subprocess.run(['/usr/bin/systemctl','show','security-web-engine-07-owned-intent-304b2ec68d304738a43794f5a666b6c8.service','-p','LoadState','--value'],capture_output=True,check=True,timeout=10)
            assert result.stdout==b'not-found\n'
      changed_when: false
      timeout: 20
    - name: Launch exactly one durable original-deadline owned intent continuation
      ansible.builtin.command:
        argv:
          - /usr/bin/systemd-run
          - --no-ask-password
          - --expand-environment=no
          - --unit=security-web-engine-07-owned-intent-304b2ec68d304738a43794f5a666b6c8.service
          - --property=Type=exec
          - --property=Restart=no
          - --property=RuntimeMaxSec=950
          - --property=TimeoutStopSec=10
          - --property=KillMode=control-group
          - --property=UMask=0077
          - --property=LimitFSIZE=infinity
          - --property=StandardOutput=append:/root/.local/security-web-engine-20261024-task07/owned_intent.log
          - --property=StandardError=append:/root/.local/security-web-engine-20261024-task07/owned_intent.log
          - /usr/bin/env
          - -i
          - PATH=/usr/sbin:/usr/bin:/sbin:/bin
          - LC_ALL=C.UTF-8
          - DOCKER_HOST=unix:///var/run/docker.sock
          - /usr/bin/python3
          - -I
          - -B
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/web_engine_owned_intent.py') }}"
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/web_engine_owned_restore.py', rstrip=false) }}"
          - restore_intent
          - --confirmation
          - FINISH-OWNED-WEB-ENGINE-07-INTENT
      timeout: 30
