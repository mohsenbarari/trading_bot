---
- name: Park only ten obsolete QA containers while production incidents remain open
  hosts: web_engine
  gather_facts: false
  any_errors_fatal: true
  vars:
    qa_parking_action: check
    qa_parking_confirmation: ''
  tasks:
    - name: Require the exact Web lane and new explicit parking scope
      ansible.builtin.assert:
        that:
          - groups['all'] == ['web_engine']
          - ansible_host == '65.109.220.59' and ansible_port | int == 37067 and ansible_user == 'root'
          - ansible_ssh_common_args == '-o BatchMode=yes -o StrictHostKeyChecking=yes -o ForwardAgent=no -o UpdateHostKeys=no -o ConnectTimeout=10 -o ControlMaster=no -S none'
          - qa_parking_action in ['check', 'park']
          - qa_parking_action == 'check' or qa_parking_confirmation == 'PARK-EXACT-TEN-OBSOLETE-QA-KEEP-INCIDENT-OPEN-20261024'
    - name: Check exact QA identity and retained production configuration without mutation
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - -B
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/web_qa_parking.py') }}"
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/web_qa_retirement.py', rstrip=false) }}"
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/web_market_hot_preflight.py', rstrip=false) }}"
          - check
      changed_when: false
      check_mode: false
      timeout: 180
    - name: Default and check mode end without parking anything
      ansible.builtin.meta: end_play
      when: qa_parking_action == 'check' or ansible_check_mode
    - name: Refuse any previous new parking unit or log
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - -B
          - -c
          - |
            import os,subprocess
            assert not os.path.lexists('/root/.local/security-web-qa-parking-20261024-01.log')
            value=subprocess.run(['/usr/bin/systemctl','show','security-web-qa-parking-20261024-01.service','-p','LoadState','--value'],capture_output=True,check=True,timeout=10)
            assert value.stdout==b'not-found\n'
      changed_when: false
      timeout: 20
    - name: Launch one bounded parking owner without releasing old fences
      ansible.builtin.command:
        argv:
          - /usr/bin/systemd-run
          - --no-ask-password
          - --expand-environment=no
          - --unit=security-web-qa-parking-20261024-01.service
          - --property=Type=exec
          - --property=Restart=no
          - --property=RuntimeMaxSec=650
          - --property=TimeoutStopSec=10
          - --property=KillMode=control-group
          - --property=UMask=0077
          - --property=LimitCORE=0
          - --property=LimitFSIZE=infinity
          - --property=StandardOutput=append:/root/.local/security-web-qa-parking-20261024-01.log
          - --property=StandardError=append:/root/.local/security-web-qa-parking-20261024-01.log
          - /usr/bin/env
          - -i
          - PATH=/usr/sbin:/usr/bin:/sbin:/bin
          - LC_ALL=C.UTF-8
          - DOCKER_HOST=unix:///var/run/docker.sock
          - /usr/bin/python3
          - -I
          - -B
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/web_qa_parking.py') }}"
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/web_qa_retirement.py', rstrip=false) }}"
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/web_market_hot_preflight.py', rstrip=false) }}"
          - park
          - --confirmation
          - PARK-EXACT-TEN-OBSOLETE-QA-KEEP-INCIDENT-OPEN-20261024
      timeout: 30
