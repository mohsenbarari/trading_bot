---
- name: Resume only Golden after the historical partial Native Brotli refresh
  hosts: boot_mount_bot
  gather_facts: false
  any_errors_fatal: true
  vars:
    brotli_resume_action: check
    brotli_resume_window_start: ''
    brotli_resume_window_end: ''
  tasks:
    - name: Require exact Native lane and an independently bounded continuation
      ansible.builtin.assert:
        that:
          - groups['all'] | length == 1
          - ansible_connection == 'local' and ansible_host == '65.109.216.187' and ansible_user == 'root'
          - brotli_resume_action in ['check', 'refresh']
    - name: Verify or refresh only the remaining Golden consumer
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - -B
          - '{{ playbook_dir }}/brotli_native_golden_resume.py'
          - '{{ playbook_dir }}/brotli_native_refresh.py'
          - '{{ playbook_dir }}/brotli_native_install.py'
          - '{{ "check" if ansible_check_mode else brotli_resume_action }}'
          - --window-start
          - '{{ brotli_resume_window_start }}'
          - --window-end
          - '{{ brotli_resume_window_end }}'
      check_mode: false
      changed_when: not ansible_check_mode and brotli_resume_action == 'refresh'
      timeout: 720
