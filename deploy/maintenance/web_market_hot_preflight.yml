---
- name: Stage and explicitly test the real Market hot backup before more downtime
  hosts: web_engine
  gather_facts: false
  any_errors_fatal: true
  vars:
    market_hot_action: stage
    market_hot_confirmation: ''
  tasks:
    - name: Require the original strict Web SSH lane and exact scope
      ansible.builtin.assert:
        that:
          - groups['all'] == ['web_engine']
          - ansible_host == '65.109.220.59' and ansible_port | int == 37067 and ansible_user == 'root'
          - ansible_ssh_common_args == '-o BatchMode=yes -o StrictHostKeyChecking=yes -o ForwardAgent=no -o UpdateHostKeys=no -o ConnectTimeout=10 -o ControlMaster=no -S none'
          - market_hot_action in ['stage', 'hot']
          - market_hot_action == 'stage' or market_hot_confirmation == 'RUN-REAL-MARKET-HOT-PREFLIGHT-20261024-01'
    - name: Check mode performs no staging or hot operation
      ansible.builtin.meta: end_play
      when: ansible_check_mode
    - name: Stage only two exact public published scripts under retained original flocks
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - -B
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/web_market_hot_preflight.py') }}"
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/../../scripts/backup_market_pipeline_archive.py', rstrip=false) }}"
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/../../scripts/prepare_market_pipeline_release.py', rstrip=false) }}"
          - stage
      changed_when: false
      timeout: 180
    - name: Default stops after public staging and ownership checks
      ansible.builtin.meta: end_play
      when: market_hot_action == 'stage'
    - name: Refuse an existing hot diagnostic unit or log without adopting it
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - -B
          - -c
          - |
            import os,subprocess
            assert not os.path.lexists('/root/.local/security-market-hot-preflight-20261024-01.log')
            result=subprocess.run(['/usr/bin/systemctl','show','security-market-hot-preflight-20261024-01.service','-p','LoadState','--value'],capture_output=True,check=True,timeout=10)
            assert result.stdout==b'not-found\n'
      changed_when: false
      timeout: 20
    - name: Launch the real bounded HOT backup and isolated restore verification once
      ansible.builtin.command:
        argv:
          - /usr/bin/systemd-run
          - --no-ask-password
          - --expand-environment=no
          - --unit=security-market-hot-preflight-20261024-01.service
          - --property=Type=exec
          - --property=Restart=no
          - --property=RuntimeMaxSec=1850
          - --property=TimeoutStopSec=10
          - --property=KillMode=control-group
          - --property=UMask=0077
          - --property=LimitFSIZE=infinity
          - --property=StandardOutput=append:/root/.local/security-market-hot-preflight-20261024-01.log
          - --property=StandardError=append:/root/.local/security-market-hot-preflight-20261024-01.log
          - /usr/bin/env
          - -i
          - PATH=/usr/sbin:/usr/bin:/sbin:/bin
          - LC_ALL=C.UTF-8
          - DOCKER_HOST=unix:///var/run/docker.sock
          - /usr/bin/python3
          - -I
          - -B
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/web_market_hot_preflight.py') }}"
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/../../scripts/backup_market_pipeline_archive.py', rstrip=false) }}"
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/../../scripts/prepare_market_pipeline_release.py', rstrip=false) }}"
          - hot
          - --confirmation
          - RUN-REAL-MARKET-HOT-PREFLIGHT-20261024-01
      timeout: 30
