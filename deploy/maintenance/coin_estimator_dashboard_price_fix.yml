---
- name: Activate the source-attributed estimator dashboard on Native
  hosts: boot_mount_bot
  gather_facts: false
  tasks:
    - name: Require the verified Native inventory
      ansible.builtin.assert:
        that:
          - ansible_host == '65.109.216.187'

    - name: Verify the dashboard owns no Telegram session before restarting
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import pathlib,subprocess;
            pid=int(subprocess.check_output(['systemctl','show','coin-rate-estimator-dashboard.service','--property=MainPID','--value']));
            args=pathlib.Path('/proc/'+str(pid)+'/cmdline').read_bytes().split(b'\0');
            assert b'--no-telegram' in args;
            print('dashboard_telegram_disabled=true')
      changed_when: false

    - name: Restart only the estimator dashboard
      ansible.builtin.systemd_service:
        name: coin-rate-estimator-dashboard.service
        state: restarted
      no_log: true
