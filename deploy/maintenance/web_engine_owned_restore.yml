---
# Only the exact still-fenced failed07 task; no install/retry/data rollback.
- name: Check or durably restore the exact owned failed Web task
  hosts: web_engine
  gather_facts: false
  any_errors_fatal: true
  vars:
    owned_web_restore_action: check
    owned_web_restore_confirmation: ''
  tasks:
    - name: Require the exact original Web SSH lane and explicit owned action
      ansible.builtin.assert:
        that:
          - groups['all'] == ['web_engine']
          - ansible_host == '65.109.220.59' and ansible_port | int == 37067 and ansible_user == 'root'
          - ansible_ssh_common_args == '-o BatchMode=yes -o StrictHostKeyChecking=yes -o ForwardAgent=no -o UpdateHostKeys=no -o ConnectTimeout=10 -o ControlMaster=no -S none'
          - owned_web_restore_action in ['check', 'restore']
          - owned_web_restore_action == 'check' or owned_web_restore_confirmation == 'RESTORE-OWNED-WEB-ENGINE-07'
    - name: Run the complete read-only owned recovery proof without creating or adopting anything
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, -B, -c, "{{ lookup('ansible.builtin.file', playbook_dir + '/web_engine_owned_restore.py') }}", check]
      changed_when: false
      check_mode: false
      timeout: 240
    - name: Default or check mode never starts a recovery owner
      ansible.builtin.meta: end_play
      when: owned_web_restore_action == 'check' or ansible_check_mode
    - name: Refuse every previous durable restore launch or output file
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - -B
          - -c
          - |
            import os,subprocess
            assert not os.path.lexists('/root/.local/security-web-engine-20261024-task07/owned_restore.log')
            result=subprocess.run(['/usr/bin/systemctl','show','security-web-engine-07-owned-restore-304b2ec68d304738a43794f5a666b6c8.service','-p','LoadState','--value'],capture_output=True,check=True,timeout=10)
            assert result.stdout==b'not-found\n'
      changed_when: false
      timeout: 20
    - name: Launch one durable same-operation restore without retry or secret transfer
      ansible.builtin.command:
        argv:
          - /usr/bin/systemd-run
          - --no-ask-password
          - --expand-environment=no
          - --unit=security-web-engine-07-owned-restore-304b2ec68d304738a43794f5a666b6c8.service
          - --property=Type=exec
          - --property=Restart=no
          - --property=RuntimeMaxSec=950
          - --property=TimeoutStopSec=10
          - --property=KillMode=control-group
          - --property=UMask=0077
          - --property=LimitFSIZE=infinity
          - --property=StandardOutput=append:/root/.local/security-web-engine-20261024-task07/owned_restore.log
          - --property=StandardError=append:/root/.local/security-web-engine-20261024-task07/owned_restore.log
          - /usr/bin/env
          - -i
          - PATH=/usr/sbin:/usr/bin:/sbin:/bin
          - LC_ALL=C.UTF-8
          - DOCKER_HOST=unix:///var/run/docker.sock
          - /usr/bin/python3
          - -I
          - -B
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/web_engine_owned_restore.py') }}"
          - restore
          - --confirmation
          - RESTORE-OWNED-WEB-ENGINE-07
      timeout: 30
