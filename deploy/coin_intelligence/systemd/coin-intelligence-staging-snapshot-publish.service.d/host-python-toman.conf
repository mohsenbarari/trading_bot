[Service]
# The preview image can lag the live toman-canonical publisher. Run the
# publisher from the canonical main worktree until that image is refreshed.
WorkingDirectory=/root/trading-bot/trading_bot
Environment=PYTHONDONTWRITEBYTECODE=1
UMask=0022
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=strict
ProtectHome=read-only
ReadOnlyPaths=/root/trading-bot/trading_bot
ReadWritePaths=/srv/trading-bot/production-data/coin-intelligence/private-gold-live
ExecStart=
ExecStart=/usr/bin/python3 /root/trading-bot/trading_bot/scripts/publish_coin_intelligence_snapshot.py publish --runtime-root /srv/trading-bot/production-data/coin-intelligence/private-gold-live --market-store market/market.sqlite3 --snapshot staging/coin-rates.json --publish-staging-no-data-snapshot --environment staging --confirm publish-staging-no-data-snapshot
# Normal night/weekend abstention publishes PUBLISHED_NO_DATA and exits zero.
# Any non-zero exit, including strict publisher exit 3, must fail the unit.
