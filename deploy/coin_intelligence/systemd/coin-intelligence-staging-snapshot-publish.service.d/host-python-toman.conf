[Service]
# The preview image can lag the live toman-canonical publisher. Run the
# publisher from the canonical main worktree until that image is refreshed.
WorkingDirectory=/root/trading-bot/trading_bot
ExecStart=
ExecStart=/usr/bin/python3 /root/trading-bot/trading_bot/scripts/publish_coin_intelligence_snapshot.py publish --runtime-root /srv/trading-bot/production-data/coin-intelligence/private-gold-live --market-store market/market.sqlite3 --snapshot staging/coin-rates.json
# Exit 3 = NOT_RATE_READY (correct night/weekend abstention). Treat as success.
SuccessExitStatus=3
