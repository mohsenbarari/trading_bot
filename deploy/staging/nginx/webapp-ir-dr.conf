server {
    listen 443 ssl;
    server_name webapp_ir_dr_tls;
    ssl_certificate /run/tls/server.crt;
    ssl_certificate_key /run/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 3s;
    set $webapp_ir_receiver_upstream webapp_ir_dr_receiver:8000;
    location / { proxy_pass http://$webapp_ir_receiver_upstream; proxy_set_header Host $host; }
}
