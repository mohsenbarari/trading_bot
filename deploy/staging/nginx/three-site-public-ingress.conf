# Host-level public ingress for the disposable WebApp-FI staging origin only.
# The API container deliberately remains loopback-bound on 127.0.0.1:8212.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name staging.gold-trade.ir;

    access_log off;
    return 301 https://staging.gold-trade.ir$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name staging.gold-trade.ir;

    ssl_certificate /etc/trading-bot-three-site/public-ingress/staging.gold-trade.ir.crt;
    ssl_certificate_key /etc/trading-bot-three-site/public-ingress/staging.gold-trade.ir.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    client_max_body_size 50m;
    server_tokens off;

    # This server is the default listener only to ensure unrelated Host headers
    # never fall through to Debian's package-default virtual host.
    if ($host != staging.gold-trade.ir) {
        return 444;
    }

    auth_basic "Trading Bot Staging";
    auth_basic_user_file /etc/trading-bot-three-site/public-ingress/staging.htpasswd;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /metrics {
        auth_basic off;
        return 404;
    }

    location /api/realtime/ws {
        proxy_pass http://127.0.0.1:8212;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8212;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
