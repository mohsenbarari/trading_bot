server {
    listen 443 ssl;
    server_name bot_fi_dr_tls;
    ssl_certificate /run/tls/server.crt;
    ssl_certificate_key /run/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    # Docker assigns a fresh container IP after a targeted worker restart.
    # Resolve service names per request so a healthy TLS proxy never retains a
    # dead upstream address during the journal recovery window.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 3s;
    set $bot_fi_journal_upstream bot_fi_durability_journal:8000;
    set $bot_fi_receiver_upstream bot_fi_dr_receiver:8000;
    location /api/dr-journal/ { proxy_pass http://$bot_fi_journal_upstream; proxy_set_header Host $host; }
    location / { proxy_pass http://$bot_fi_receiver_upstream; proxy_set_header Host $host; }
}
