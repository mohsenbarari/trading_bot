server {
    listen 443 ssl;
    server_name witness_dr_tls;
    ssl_certificate /run/tls/server.crt;
    ssl_certificate_key /run/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 3s;
    set $witness_api_upstream witness_api:8000;
    location / { proxy_pass http://$witness_api_upstream; proxy_set_header Host $host; }
}
