# Isolated temporary WebApp-IR deployment for an Iran connectivity emergency.
#
# This is deliberately not an overlay for docker-compose.iran.yml or any
# three-site manifest. It contains no bot, sync, writer, or DR service. Run it
# only with the root-owned runtime env rendered by
# scripts/render_emergency_ir_standalone_env.py.
name: trading-bot-emergency-ir

x-default-logging: &default_logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

x-runtime-env: &runtime_env
  env_file:
    - "${EMERGENCY_RUNTIME_ENV_FILE:?root-owned Emergency runtime env is required}"

x-api-environment: &api_environment
  TZ: UTC
  TRADING_BOT_SERVICE: emergency_ir_api
  EMERGENCY_IR_STANDALONE: "true"
  BACKGROUND_JOBS_ENABLED: "false"
  WEB_PUSH_ENABLED: "false"
  TELEGRAM_DIRECT_REGISTRATION_ENABLED: "false"
  TELEGRAM_REGISTRATION_RECONCILIATION_ENABLED: "false"
  TELEGRAM_LOGIN_OTP_ENABLED: "false"
  OTP_SMS_AUTO_FALLBACK_ENABLED: "false"
  INVITATION_SMS_STANDARD_ENABLED: "false"
  INVITATION_SMS_CUSTOMER_TIER1_ENABLED: "false"
  INVITATION_SMS_ACCOUNTANT_ENABLED: "false"
  INVITATION_SMS_CUSTOMER_TIER2_ENABLED: "false"
  INVITATION_CONTRACT_V2_ENABLED: "false"
  REGISTRATION_SYNC_V2_ENABLED: "false"
  REGISTRATION_SYNC_ACCEPT_UNVERSIONED: "false"
  AUDIT_TRAIL_PATH: /app/audit_trail/audit.jsonl

services:
  db:
    image: "${EMERGENCY_POSTGRES_IMAGE:?exact emergency PostgreSQL image is required}"
    restart: unless-stopped
    logging: *default_logging
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_USER: "${POSTGRES_USER:?required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required}"
      POSTGRES_DB: "${POSTGRES_DB:?required}"
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-80}
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
    volumes:
      - emergency_ir_postgres_data:/var/lib/postgresql/data
    networks:
      - emergency_ir_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 1g
    cpus: "1.0"
    security_opt: ["no-new-privileges:true"]

  redis:
    image: "${EMERGENCY_REDIS_IMAGE:?exact emergency Redis image is required}"
    restart: unless-stopped
    logging: *default_logging
    command:
      - redis-server
      - --appendonly
      - ${REDIS_APPENDONLY:-yes}
      - --appendfsync
      - ${REDIS_APPENDFSYNC:-everysec}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-192mb}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-noeviction}
    volumes:
      - emergency_ir_redis_data:/data
    networks:
      - emergency_ir_internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    mem_limit: 256m
    cpus: "0.25"
    security_opt: ["no-new-privileges:true"]

  migration:
    image: "${EMERGENCY_APP_IMAGE:?attested emergency application image is required}"
    restart: "no"
    logging: *default_logging
    <<: *runtime_env
    command: ["sh", "-ec", "python manage.py && python scripts/align_trade_number_sequence.py"]
    environment:
      <<: *api_environment
      TRADING_BOT_SERVICE: emergency_ir_migration
    depends_on:
      db:
        condition: service_healthy
    networks:
      - emergency_ir_internal
    mem_limit: 512m
    cpus: "0.50"
    security_opt: ["no-new-privileges:true"]

  api:
    image: "${EMERGENCY_APP_IMAGE:?attested emergency application image is required}"
    restart: unless-stopped
    logging: *default_logging
    <<: *runtime_env
    command:
      - sh
      - -ec
      - >-
        exec uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1
        --proxy-headers --forwarded-allow-ips 127.0.0.1,172.29.250.1
    environment: *api_environment
    ports:
      - "127.0.0.1:${EMERGENCY_APP_PORT:-18000}:8000"
    volumes:
      - type: bind
        source: "${EMERGENCY_TRADING_SETTINGS_FILE:?attested trading settings file is required}"
        target: /app/trading_settings.json
        read_only: true
        bind:
          create_host_path: false
      - emergency_ir_uploads_data:/app/uploads
      - emergency_ir_audit_data:/app/audit_trail
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - emergency_ir_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys, urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/config', timeout=5).read(); sys.exit(0)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 512m
    cpus: "1.0"
    security_opt: ["no-new-privileges:true"]

networks:
  emergency_ir_internal:
    name: trading-bot-emergency-ir-net
    internal: true
    ipam:
      config:
        - subnet: 172.29.250.0/28

volumes:
  emergency_ir_postgres_data:
    name: trading-bot-emergency-ir-postgres
  emergency_ir_redis_data:
    name: trading-bot-emergency-ir-redis
  emergency_ir_uploads_data:
    name: trading-bot-emergency-ir-uploads
  emergency_ir_audit_data:
    name: trading-bot-emergency-ir-audit
