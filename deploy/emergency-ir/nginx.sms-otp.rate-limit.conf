# Install this file under Nginx's http{} context only for the explicit
# Emergency SMS-OTP profile.  $binary_remote_addr is the TCP peer address; no
# forwarded client header is trusted for this public rate limit.
limit_req_zone $binary_remote_addr zone=emergency_sms_otp_per_ip:10m rate=10r/m;
limit_req_status 429;
limit_req_log_level warn;
