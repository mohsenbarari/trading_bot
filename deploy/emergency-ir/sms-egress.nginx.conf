# Fixed-upstream SMS relay.  This file is mounted only into the separate
# Emergency SMS relay image; it is never installed on the public host Nginx.
#
# API may connect only over the internal sms-relay bridge.  The relay has no
# generic forward-proxy capability: one POST path has one literal HTTPS
# upstream.  TLS verification is intentionally performed by the relay.

server {
    listen 172.29.251.3:8080 default_server;
    server_name _;

    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;
    client_max_body_size 8k;
    client_body_buffer_size 8k;
    allow 172.29.251.2;
    deny all;

    location = /healthz {
        access_log off;
        return 204;
    }

    location = /v1/send/verify {
        limit_except POST { deny all; }

        proxy_pass https://api.sms.ir/v1/send/verify;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host api.sms.ir;
        proxy_set_header Accept "application/json";
        proxy_set_header Content-Type "application/json";
        proxy_set_header X-API-KEY $http_x_api_key;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";

        proxy_ssl_server_name on;
        proxy_ssl_name api.sms.ir;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location / { return 404; }
}
