x-default-logging: &default_logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:
  app:
    image: trading_bot_base
    logging: *default_logging
    container_name: trading_bot_app
    restart: always
    command: sh -c "exec uvicorn main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2}"
    environment:
      TZ: UTC
      TRADING_BOT_SERVICE: api
      TRADING_BOT_METRICS_BACKEND: ${TRADING_BOT_METRICS_BACKEND:-memory}
      AUDIT_TRAIL_PATH: ${AUDIT_TRAIL_PATH:-/app/audit_trail/audit.jsonl}
      API_WORKERS: ${API_WORKERS:-2}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-15}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-3600}

    volumes:
      - ${CERTS_HOST_PATH:-/root/cert/ip}:/app/certs  # Mount Host Certs
      - ./api:/app/api
      - ./bot:/app/bot
      - ./core:/app/core
      - ./src:/app/src
      - ./models:/app/models
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
      - ./main.py:/app/main.py
      - ./schemas.py:/app/schemas.py
      - ./mini_app_dist:/app/mini_app_dist
      - ./trading_settings.json:/app/trading_settings.json
      - uploads_data:/app/uploads
      - audit_data:/app/audit_trail
    ports:
      - "127.0.0.1:8000:8000"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file:
      - path: .env.api
        required: false
    extra_hosts:
      - "${IRAN_PUBLIC_DOMAIN:-coin.gold-trade.ir}:${IRAN_PUBLIC_IP:-65.109.220.59}"
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - trading_net

  bot:
    image: trading_bot_base
    logging: *default_logging
    container_name: trading_bot_bot
    restart: always
    command: python run_bot.py
    environment:
      TZ: UTC
      TRADING_BOT_SERVICE: bot
      TRADING_BOT_METRICS_BACKEND: ${TRADING_BOT_METRICS_BACKEND:-memory}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-15}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-3600}
    volumes:
      - .:/app
    env_file:
      - path: .env.bot
        required: false
    extra_hosts:
      - "${IRAN_PUBLIC_DOMAIN:-coin.gold-trade.ir}:${IRAN_PUBLIC_IP:-65.109.220.59}"
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - trading_net

  sync_worker:
    image: trading_bot_base
    logging: *default_logging
    container_name: trading_bot_sync_worker
    restart: always
    command: python -m core.sync_worker
    environment:
      TZ: UTC
      TRADING_BOT_SERVICE: sync_worker
      TRADING_BOT_METRICS_BACKEND: ${TRADING_BOT_METRICS_BACKEND:-memory}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-15}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-3600}
    volumes:
      - ./api:/app/api
      - ./bot:/app/bot
      - ./core:/app/core
      - ./src:/app/src
      - ./models:/app/models
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
      - ./main.py:/app/main.py
      - ./schemas.py:/app/schemas.py
      - ./trading_settings.json:/app/trading_settings.json
    env_file:
      - path: .env.sync
        required: false
    extra_hosts:
      - "${IRAN_PUBLIC_DOMAIN:-coin.gold-trade.ir}:${IRAN_PUBLIC_IP:-65.109.220.59}"
    depends_on:
      redis:
        condition: service_started
    networks:
      - trading_net

  coin_intelligence_shadow_worker:
    image: trading_bot_base
    profiles: ["coin-intelligence-shadow"]
    logging: *default_logging
    container_name: trading_bot_coin_intelligence_shadow_worker
    restart: unless-stopped
    command:
      - python
      - scripts/run_coin_intelligence_shadow_worker.py
      - --acknowledge-shadow-only
    environment:
      TZ: UTC
      TRADING_BOT_SERVICE: coin_intelligence_shadow_worker
      TRADING_BOT_METRICS_BACKEND: ${TRADING_BOT_METRICS_BACKEND:-memory}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-2}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-3600}
    volumes:
      - .:/app
    env_file:
      - path: .env.coin-intelligence-shadow
        required: false
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - trading_net

  coin_intelligence_gemma_server:
    image: trading_bot_coin_intelligence_gemma
    build:
      context: .
      dockerfile: Dockerfile.coin-intelligence-gemma
    profiles: ["coin-intelligence-shadow"]
    logging: *default_logging
    container_name: trading_bot_coin_intelligence_gemma_server
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        mkdir -p /tmp/coin-intelligence-llama-runtime
        && cp
        /models/llama.cpp-b10107/llama-b10107/llama-server
        /models/llama.cpp-b10107/llama-b10107/lib*.so*
        /tmp/coin-intelligence-llama-runtime/
        && chmod 0555
        /tmp/coin-intelligence-llama-runtime/llama-server
        && exec /tmp/coin-intelligence-llama-runtime/llama-server
        --model
        /models/gemma-4-E4B-it-q4_0/gemma-4-E4B_q4_0-it.gguf
        --host 0.0.0.0
        --port 18123
        --ctx-size 2048
        --threads 4
        --threads-batch 4
        --parallel 1
        --log-verbosity 1
        --jinja
        --no-webui
    environment:
      TZ: UTC
      LD_LIBRARY_PATH: /tmp/coin-intelligence-llama-runtime
    volumes:
      - ${COIN_INTELLIGENCE_MODEL_HOST_PATH:-/srv/trading-bot-three-site-staging-data/ai-models}:/models:ro
    expose:
      - "18123"
    mem_limit: 10g
    cpus: 4.0
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:18123/health', timeout=2).read(4096)
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 30s
    networks:
      - trading_net

  migration:
    image: trading_bot_base
    logging: *default_logging
    container_name: trading_bot_migration

    command:
      - sh
      - -c
      - python manage.py && python scripts/align_trade_number_sequence.py
    environment:
      TZ: UTC
      DB_POOL_SIZE: ${DB_POOL_SIZE:-15}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-3600}
    env_file:
      - path: .env.migration
        required: false
    depends_on:
      db:
        condition: service_healthy
    networks:
      - trading_net

  db:
    image: postgres:15-alpine
    logging: *default_logging
    container_name: trading_bot_db
    restart: always
    command: postgres -c max_connections=500 -c timezone=UTC -c log_timezone=UTC
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - trading_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    logging: *default_logging
    container_name: trading_bot_redis
    command:
      - redis-server
      - --appendonly
      - ${REDIS_APPENDONLY:-yes}
      - --appendfsync
      - ${REDIS_APPENDFSYNC:-everysec}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-0}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-noeviction}
    environment:
      TZ: UTC
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - trading_net

  tileserver:
    image: maptiler/tileserver-gl:latest
    logging: *default_logging
    container_name: trading_bot_tileserver
    restart: always
    environment:
      TZ: UTC
    volumes:
      - ./map_data:/data
    ports:
      - "8088:8080"
    networks:
      - trading_net

networks:
  trading_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  audit_data:
