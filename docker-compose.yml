# Retired legacy root Compose — local development only.
#
# The three-site target runtime is the isolated Writer-Witness Compose under
# deploy/production.  This historical root surface must never become a
# production writer again.  Every real service below is hidden behind the
# explicit `legacy-local-development` profile and additionally checks the
# non-production acknowledgement before its process can start.  The one
# default service intentionally fails closed, so a bare `docker compose up`
# cannot start a database, migration, app, bot, or sync worker.
x-default-logging: &default_logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:
  # This guard remains outside the local-development profile.  It performs no
  # network, database, volume, or application operation; a bare Compose
  # invocation reaches only this failing retirement boundary.
  legacy_root_runtime_guard:
    image: trading_bot_base
    pull_policy: never
    restart: "no"
    command: sh -ec 'if [ "$${ENVIRONMENT:-}" != "development" ] || [ "$${TRADING_BOT_LEGACY_LOCAL_DEVELOPMENT_ACK:-}" != "I_UNDERSTAND_THIS_IS_LOCAL_DEVELOPMENT_ONLY" ]; then echo "ERROR docker-compose.yml is retired for three-site production; use the isolated Writer-Witness runtime, or explicitly opt into local development." >&2; exit 2; fi; echo "legacy root Compose local-development guard accepted"'
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-}
      TRADING_BOT_LEGACY_LOCAL_DEVELOPMENT_ACK: ${TRADING_BOT_LEGACY_LOCAL_DEVELOPMENT_ACK:-}
    logging: *default_logging

  app:
    image: trading_bot_base
    logging: *default_logging
    container_name: trading_bot_app
    restart: always
    profiles: ["legacy-local-development"]
    command: sh -ec 'if [ "$${ENVIRONMENT:-}" != "development" ] || [ "$${TRADING_BOT_LEGACY_LOCAL_DEVELOPMENT_ACK:-}" != "I_UNDERSTAND_THIS_IS_LOCAL_DEVELOPMENT_ONLY" ]; then echo "ERROR legacy root app is local-development only; use the isolated Writer-Witness runtime for production." >&2; exit 2; fi; exec uvicorn main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2}'
    environment:
      TZ: UTC
      ENVIRONMENT: ${ENVIRONMENT:-}
      TRADING_BOT_LEGACY_LOCAL_DEVELOPMENT_ACK: ${TRADING_BOT_LEGACY_LOCAL_DEVELOPMENT_ACK:-}
      TRADING_BOT_SERVICE: api
      TRADING_BOT_METRICS_BACKEND: ${TRADING_BOT_METRICS_BACKEND:-memory}
      # The root Compose surface may be used for a host-local recovery.  It
      # must never revive the superseded peer HTTP replication path.
      SINGLE_WRITER_RUNTIME_ENABLED: "true"
      TRADING_BOT_DISABLE_DIRECT_SYNC_PUSH: "1"
      AUDIT_TRAIL_PATH: ${AUDIT_TRAIL_PATH:-/app/audit_trail/audit.jsonl}
      API_WORKERS: ${API_WORKERS:-2}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-15}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-3600}

    volumes:
      - ${CERTS_HOST_PATH:-/root/cert/ip}:/app/certs  # Mount Host Certs
      - ./api:/app/api
      - ./bot:/app/bot
      - ./core:/app/core
      - ./src:/app/src
      - ./models:/app/models
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
      - ./main.py:/app/main.py
      - ./schemas.py:/app/schemas.py
      - ./mini_app_dist:/app/mini_app_dist
      - ./trading_settings.json:/app/trading_settings.json
      - uploads_data:/app/uploads
      - audit_data:/app/audit_trail
    ports:
      - "127.0.0.1:8000:8000"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file:
      - .env
    depends_on:
      legacy_root_runtime_guard:
        condition: service_completed_successfully
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - trading_net

  bot:
    image: trading_bot_base
    logging: *default_logging
    container_name: trading_bot_bot
    restart: always
    profiles: ["legacy-local-development"]
    command: sh -ec 'if [ "$${ENVIRONMENT:-}" != "development" ] || [ "$${TRADING_BOT_LEGACY_LOCAL_DEVELOPMENT_ACK:-}" != "I_UNDERSTAND_THIS_IS_LOCAL_DEVELOPMENT_ONLY" ]; then echo "ERROR legacy root bot is local-development only; use the isolated Writer-Witness runtime for production." >&2; exit 2; fi; exec python run_bot.py'
    environment:
      TZ: UTC
      ENVIRONMENT: ${ENVIRONMENT:-}
      TRADING_BOT_LEGACY_LOCAL_DEVELOPMENT_ACK: ${TRADING_BOT_LEGACY_LOCAL_DEVELOPMENT_ACK:-}
      TRADING_BOT_SERVICE: bot
      TRADING_BOT_METRICS_BACKEND: ${TRADING_BOT_METRICS_BACKEND:-memory}
      SINGLE_WRITER_RUNTIME_ENABLED: "true"
      TRADING_BOT_DISABLE_DIRECT_SYNC_PUSH: "1"
      DB_POOL_SIZE: ${DB_POOL_SIZE:-15}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-3600}
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      legacy_root_runtime_guard:
        condition: service_completed_successfully
      migration:
        condition: service_completed_successfully
    networks:
      - trading_net

  sync_worker:
    image: trading_bot_base
    logging: *default_logging
    container_name: trading_bot_sync_worker
    restart: always
    profiles: ["legacy-local-development"]
    command: sh -ec 'if [ "$${ENVIRONMENT:-}" != "development" ] || [ "$${TRADING_BOT_LEGACY_LOCAL_DEVELOPMENT_ACK:-}" != "I_UNDERSTAND_THIS_IS_LOCAL_DEVELOPMENT_ONLY" ]; then echo "ERROR legacy root sync worker is local-development only; no three-site sync worker is permitted here." >&2; exit 2; fi; exec python -m core.sync_worker'
    environment:
      TZ: UTC
      ENVIRONMENT: ${ENVIRONMENT:-}
      TRADING_BOT_LEGACY_LOCAL_DEVELOPMENT_ACK: ${TRADING_BOT_LEGACY_LOCAL_DEVELOPMENT_ACK:-}
      TRADING_BOT_SERVICE: sync_worker
      TRADING_BOT_METRICS_BACKEND: ${TRADING_BOT_METRICS_BACKEND:-memory}
      # core.sync_worker exits before Redis/HTTP initialization under this
      # flag; this protects an accidental manual ``docker compose up`` too.
      SINGLE_WRITER_RUNTIME_ENABLED: "true"
      TRADING_BOT_DISABLE_DIRECT_SYNC_PUSH: "1"
      DB_POOL_SIZE: ${DB_POOL_SIZE:-15}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-3600}
    volumes:
      - ./api:/app/api
      - ./bot:/app/bot
      - ./core:/app/core
      - ./src:/app/src
      - ./models:/app/models
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
      - ./main.py:/app/main.py
      - ./schemas.py:/app/schemas.py
      - ./trading_settings.json:/app/trading_settings.json
    env_file:
      - .env
    depends_on:
      legacy_root_runtime_guard:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - trading_net

  migration:
    image: trading_bot_base
    logging: *default_logging
    container_name: trading_bot_migration
    profiles: ["legacy-local-development"]
    command: sh -ec 'if [ "$${ENVIRONMENT:-}" != "development" ] || [ "$${TRADING_BOT_LEGACY_LOCAL_DEVELOPMENT_ACK:-}" != "I_UNDERSTAND_THIS_IS_LOCAL_DEVELOPMENT_ONLY" ]; then echo "ERROR legacy root migration is local-development only; schema work belongs to the reviewed three-site control plane." >&2; exit 2; fi; exec sh -ec "python manage.py && python scripts/align_trade_number_sequence.py"'
    environment:
      TZ: UTC
      ENVIRONMENT: ${ENVIRONMENT:-}
      TRADING_BOT_LEGACY_LOCAL_DEVELOPMENT_ACK: ${TRADING_BOT_LEGACY_LOCAL_DEVELOPMENT_ACK:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-15}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-3600}
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      legacy_root_runtime_guard:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - trading_net

  db:
    image: postgres:15-alpine
    logging: *default_logging
    container_name: trading_bot_db
    restart: always
    profiles: ["legacy-local-development"]
    command: postgres -c max_connections=500 -c timezone=UTC -c log_timezone=UTC
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - trading_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      legacy_root_runtime_guard:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    logging: *default_logging
    container_name: trading_bot_redis
    profiles: ["legacy-local-development"]
    command:
      - redis-server
      - --appendonly
      - ${REDIS_APPENDONLY:-yes}
      - --appendfsync
      - ${REDIS_APPENDFSYNC:-everysec}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-0}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-noeviction}
    environment:
      TZ: UTC
    volumes:
      - redis_data:/data
    restart: always
    depends_on:
      legacy_root_runtime_guard:
        condition: service_completed_successfully
    networks:
      - trading_net

  tileserver:
    image: maptiler/tileserver-gl:latest
    logging: *default_logging
    container_name: trading_bot_tileserver
    restart: always
    profiles: ["legacy-local-development"]
    environment:
      TZ: UTC
    volumes:
      - ./map_data:/data
    ports:
      - "8088:8080"
    depends_on:
      legacy_root_runtime_guard:
        condition: service_completed_successfully
    networks:
      - trading_net

networks:
  trading_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  audit_data:
