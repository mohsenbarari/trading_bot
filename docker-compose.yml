x-default-logging: &default_logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

# Telegram provider authority is a process role, not an env-file property.
# The foreign runtime env intentionally contains the bot credentials because
# all foreign services consume the same file; every non-bot service overrides
# those credentials to empty here.  The renderer derives the non-bot owner from
# the global rollout mode so a Legacy release cannot accidentally start a
# Queue-v1 producer before the guarded cutover switches the global profile.
x-telegram-producer-role: &telegram_producer_role
  TELEGRAM_DELIVERY_PRODUCER_MODE: ${TELEGRAM_DELIVERY_PRODUCER_MODE:-legacy}
  TELEGRAM_DELIVERY_EXPECTED_EXECUTION_OWNER: ${TELEGRAM_DELIVERY_EXPECTED_EXECUTION_OWNER:-legacy}
  TELEGRAM_DELIVERY_EXECUTION_OWNER: ${TELEGRAM_NON_BOT_DELIVERY_EXECUTION_OWNER:-legacy}
  TELEGRAM_DELIVERY_QUEUE_WORKER_ENABLED: "false"
  TELEGRAM_DELIVERY_QUEUE_CUTOVER_READY: "false"
  TELEGRAM_MULTI_PUBLISHER_ENABLED: ${TELEGRAM_MULTI_PUBLISHER_ENABLED:-false}
  TELEGRAM_B2B_DISPATCH_ENABLED: ${TELEGRAM_B2B_DISPATCH_ENABLED:-false}
  TELEGRAM_DELIVERY_QUEUE_CHANNEL_EDITOR_ENABLED: "false"
  TELEGRAM_PUBLISHER_1_ENABLED: "false"
  TELEGRAM_PUBLISHER_2_ENABLED: "false"
  TELEGRAM_PUBLISHER_3_ENABLED: "false"
  TELEGRAM_PUBLISHER_4_ENABLED: "false"
  TELEGRAM_PUBLISHER_5_ENABLED: "false"
  BOT_TOKEN: ${TELEGRAM_NON_BOT_BOT_TOKEN:-}
  TELEGRAM_PUBLISHER_1_BOT_TOKEN: ""
  TELEGRAM_PUBLISHER_2_BOT_TOKEN: ""
  TELEGRAM_PUBLISHER_3_BOT_TOKEN: ""
  TELEGRAM_PUBLISHER_4_BOT_TOKEN: ""
  TELEGRAM_PUBLISHER_5_BOT_TOKEN: ""
  TELEGRAM_DELIVERY_QUEUE_CHANNEL_EDITOR_BOT_TOKEN: ""
  TELEGRAM_MONITORING_BOT_TOKEN: ""

x-telegram-bot-role: &telegram_bot_role
  TELEGRAM_DELIVERY_PRODUCER_MODE: ${TELEGRAM_DELIVERY_PRODUCER_MODE:-legacy}
  TELEGRAM_DELIVERY_EXPECTED_EXECUTION_OWNER: ${TELEGRAM_DELIVERY_EXPECTED_EXECUTION_OWNER:-legacy}
  TELEGRAM_DELIVERY_EXECUTION_OWNER: ${TELEGRAM_DELIVERY_EXECUTION_OWNER:-legacy}
  TELEGRAM_DELIVERY_QUEUE_WORKER_ENABLED: ${TELEGRAM_DELIVERY_QUEUE_WORKER_ENABLED:-false}
  TELEGRAM_DELIVERY_QUEUE_CUTOVER_READY: ${TELEGRAM_DELIVERY_QUEUE_CUTOVER_READY:-false}
  TELEGRAM_MULTI_PUBLISHER_ENABLED: ${TELEGRAM_MULTI_PUBLISHER_ENABLED:-false}
  TELEGRAM_B2B_DISPATCH_ENABLED: ${TELEGRAM_B2B_DISPATCH_ENABLED:-false}
  TELEGRAM_BOT_RUNTIME_ROLE: ${TELEGRAM_BOT_RUNTIME_ROLE:-all}

services:
  app:
    image: trading_bot_base
    logging: *default_logging
    container_name: trading_bot_app
    restart: always
    command: sh -c "exec uvicorn main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2}"
    environment:
      <<: *telegram_producer_role
      TZ: UTC
      TRADING_BOT_SERVICE: api
      TRADING_BOT_METRICS_BACKEND: ${TRADING_BOT_METRICS_BACKEND:-memory}
      AUDIT_TRAIL_PATH: ${AUDIT_TRAIL_PATH:-/app/audit_trail/audit.jsonl}
      API_WORKERS: ${API_WORKERS:-2}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-15}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-3600}
      COIN_INTELLIGENCE_INFERENCE_PREVIEW_ENABLED: ${PRODUCTION_COIN_INFERENCE_PREVIEW_ENABLED:-false}
      COIN_INTELLIGENCE_INFERENCE_SELECTION_ENABLED: ${PRODUCTION_COIN_INFERENCE_SELECTION_ENABLED:-false}
      COIN_INTELLIGENCE_INFERENCE_AUTO_SELECTION_ENABLED: ${PRODUCTION_COIN_INFERENCE_AUTO_SELECTION_ENABLED:-false}
      COIN_INTELLIGENCE_INFERENCE_SNAPSHOT_PATH: /app/runtime/coin-inference/coin-rates.json
      OFFER_MODEL_PRICE_GUARD_ENABLED: ${PRODUCTION_OFFER_MODEL_PRICE_GUARD_ENABLED:-false}
      OFFER_MODEL_PRICE_GUARD_MAX_SNAPSHOT_AGE_SECONDS: ${PRODUCTION_COIN_INFERENCE_MAXIMUM_AGE_SECONDS:-120}

    volumes:
      - ${CERTS_HOST_PATH:-/root/cert/ip}:/app/certs  # Mount Host Certs
      - uploads_data:/app/uploads
      - audit_data:/app/audit_trail
      - type: bind
        source: ${PRODUCTION_COIN_INFERENCE_SNAPSHOT_HOST_DIR:-/srv/trading-bot/production-data/coin-intelligence/production-runtime}
        target: /app/runtime/coin-inference
        read_only: true
    ports:
      - "127.0.0.1:8000:8000"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file:
      - .env
    extra_hosts:
      - "${IRAN_PUBLIC_DOMAIN:-coin.gold-trade.ir}:${IRAN_PUBLIC_IP:-65.109.220.59}"
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - trading_net

  bot:
    image: trading_bot_base
    logging: *default_logging
    container_name: trading_bot_bot
    restart: always
    command: python run_bot.py
    environment:
      <<: *telegram_bot_role
      TZ: UTC
      TRADING_BOT_SERVICE: bot
      TRADING_BOT_METRICS_BACKEND: ${TRADING_BOT_METRICS_BACKEND:-memory}
      # Role `all` ceiling 25 covers the calculated 23. For role `primary` use 12+8.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-15}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-3600}
      COIN_INTELLIGENCE_INFERENCE_PREVIEW_ENABLED: ${PRODUCTION_COIN_INFERENCE_PREVIEW_ENABLED:-false}
      COIN_INTELLIGENCE_INFERENCE_SELECTION_ENABLED: ${PRODUCTION_COIN_INFERENCE_SELECTION_ENABLED:-false}
      COIN_INTELLIGENCE_INFERENCE_AUTO_SELECTION_ENABLED: ${PRODUCTION_COIN_INFERENCE_AUTO_SELECTION_ENABLED:-false}
      COIN_INTELLIGENCE_INFERENCE_SNAPSHOT_PATH: /app/runtime/coin-inference/coin-rates.json
      OFFER_MODEL_PRICE_GUARD_ENABLED: ${PRODUCTION_OFFER_MODEL_PRICE_GUARD_ENABLED:-false}
      OFFER_MODEL_PRICE_GUARD_MAX_SNAPSHOT_AGE_SECONDS: ${PRODUCTION_COIN_INFERENCE_MAXIMUM_AGE_SECONDS:-120}
    volumes:
      - uploads_data:/app/uploads
      - audit_data:/app/audit_trail
      - type: bind
        source: ${PRODUCTION_COIN_INFERENCE_SNAPSHOT_HOST_DIR:-/srv/trading-bot/production-data/coin-intelligence/production-runtime}
        target: /app/runtime/coin-inference
        read_only: true
    env_file:
      - .env
    extra_hosts:
      - "${IRAN_PUBLIC_DOMAIN:-coin.gold-trade.ir}:${IRAN_PUBLIC_IP:-65.109.220.59}"
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - trading_net

  bot_publishers:
    image: trading_bot_base
    logging: *default_logging
    container_name: trading_bot_bot_publishers
    restart: always
    profiles:
      - bot-publishers
    command: python run_bot.py
    environment:
      <<: *telegram_bot_role
      TZ: UTC
      TRADING_BOT_SERVICE: bot
      TELEGRAM_BOT_RUNTIME_ROLE: publishers
      TRADING_BOT_METRICS_BACKEND: ${TRADING_BOT_METRICS_BACKEND:-memory}
      # Role `publishers` ceiling 18 covers the calculated 11 slot/headroom budget.
      DB_POOL_SIZE: ${DB_PUBLISHERS_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_PUBLISHERS_MAX_OVERFLOW:-8}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-3600}
    volumes:
      - uploads_data:/app/uploads
      - audit_data:/app/audit_trail
    env_file:
      - .env
    extra_hosts:
      - "${IRAN_PUBLIC_DOMAIN:-coin.gold-trade.ir}:${IRAN_PUBLIC_IP:-65.109.220.59}"
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - trading_net

  sync_worker:
    image: trading_bot_base
    logging: *default_logging
    container_name: trading_bot_sync_worker
    restart: always
    command: python -m core.sync_worker
    environment:
      <<: *telegram_producer_role
      TZ: UTC
      TRADING_BOT_SERVICE: sync_worker
      TRADING_BOT_METRICS_BACKEND: ${TRADING_BOT_METRICS_BACKEND:-memory}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-15}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-3600}
    env_file:
      - .env
    extra_hosts:
      - "${IRAN_PUBLIC_DOMAIN:-coin.gold-trade.ir}:${IRAN_PUBLIC_IP:-65.109.220.59}"
    depends_on:
      redis:
        condition: service_started
    networks:
      - trading_net

  migration:
    image: trading_bot_base
    logging: *default_logging
    container_name: trading_bot_migration

    command:
      - sh
      - -c
      - python manage.py && python scripts/align_trade_number_sequence.py
    environment:
      <<: *telegram_producer_role
      TZ: UTC
      TRADING_BOT_SERVICE: migration
      DB_POOL_SIZE: ${DB_POOL_SIZE:-15}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-3600}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - trading_net

  db:
    image: postgres:15-alpine
    logging: *default_logging
    container_name: trading_bot_db
    restart: always
    command: postgres -c max_connections=500 -c timezone=UTC -c log_timezone=UTC
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - trading_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    logging: *default_logging
    container_name: trading_bot_redis
    command:
      - redis-server
      - --appendonly
      - ${REDIS_APPENDONLY:-yes}
      - --appendfsync
      - ${REDIS_APPENDFSYNC:-everysec}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-0}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-noeviction}
    environment:
      TZ: UTC
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - trading_net

  tileserver:
    image: maptiler/tileserver-gl:latest
    logging: *default_logging
    container_name: trading_bot_tileserver
    restart: always
    environment:
      TZ: UTC
    volumes:
      - ./map_data:/data
    ports:
      - "8088:8080"
    networks:
      - trading_net

networks:
  trading_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  audit_data:
