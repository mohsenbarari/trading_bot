name: Existing App OS package composition evidence only

on:
  workflow_dispatch:
    inputs:
      datastore_profile:
        description: Optional exact public Alpine datastore security profile
        type: choice
        default: none
        options:
          - none
          - postgres
          - redis

permissions:
  contents: read
  actions: read

concurrency:
  group: security-os-compose-19d
  cancel-in-progress: false

jobs:
  composition:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/security/remediation-20261023') && (inputs.datastore_profile == 'none' || inputs.datastore_profile == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Seal only the published composition and image admission helpers
        id: seal
        run: |
          python3 -I -B - <<'PY'
          from hashlib import sha256
          import json,os,pathlib,re,stat,subprocess,tempfile
          assert os.geteuid()==1001 and os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
          os.umask(0o077)
          parent=pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          assert parent.stat().st_uid==1001 and not parent.stat().st_mode&0o022
          root=pathlib.Path(tempfile.mkdtemp(prefix='security-os-compose-',dir=parent))
          (root/'source').mkdir(mode=0o700)
          commit=os.environ['GITHUB_SHA'];assert re.fullmatch('[a-f0-9]{40}',commit)
          records={}
          for name in ('compose_security_os_candidate.py','admit_security_component_image_reuse.py','verify_image_component_presence.py','verify_acl_consumer_presence.py'):
              path='scripts/'+name
              size=subprocess.run(['git','--no-optional-locks','cat-file','-s',commit+':'+path],check=True,capture_output=True,timeout=10).stdout
              assert re.fullmatch(rb'[1-9][0-9]{0,5}\n',size) and int(size)<=131072
              raw=subprocess.run(['git','--no-optional-locks','cat-file','blob',commit+':'+path],check=True,capture_output=True,timeout=10).stdout
              assert len(raw)==int(size)
              if name=='verify_image_component_presence.py':assert sha256(raw).hexdigest()=='36e92fdfd3105a9db6bc20fd75aade1238a5e0b053a581bfb24c7b5e1bf6a6d3'
              if name=='verify_acl_consumer_presence.py':assert sha256(raw).hexdigest()=='001e51d270c079153cc38db1be53c723fbbc8a8bb9e981e718e7b657127bc778'
              fd=os.open(root/'source'/name,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
              with os.fdopen(fd,'wb') as out:out.write(raw);out.flush();os.fsync(out.fileno())
              records[name]={'bytes':len(raw),'sha256':sha256(raw).hexdigest()}
          with (root/'source/identity.json').open('x') as out:json.dump({'recipe_commit':commit,'files':records},out,sort_keys=True)
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a') as out:out.write('root='+str(root)+'\n')
          PY

      - name: Admit fixed public artifacts and compose without rebuilding the App
        id: compose
        env:
          GH_TOKEN: ${{ github.token }}
          CAPSULE_ROOT: ${{ steps.seal.outputs.root }}
        run: python3 -I -B "$CAPSULE_ROOT/source/compose_security_os_candidate.py" compose --root "$CAPSULE_ROOT"

      - name: Preserve every raw vulnerability including unfixed findings
        id: vulnerabilities
        if: always() && steps.compose.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          TRIVY_IGNOREFILE: /dev/null
        with:
          version: v0.76.1
          image-ref: ${{ steps.compose.outputs.image_id }}
          scanners: vuln
          vuln-type: os,library
          format: json
          output: ${{ steps.seal.outputs.root }}/reports/vulnerabilities.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '0'
          trivy-config: ${{ steps.seal.outputs.root }}/empty-trivy.yaml
          timeout: 15m

      - name: Record the actual composed image SBOM
        id: sbom
        if: always() && steps.compose.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          TRIVY_IGNOREFILE: /dev/null
        with:
          version: v0.76.1
          image-ref: ${{ steps.compose.outputs.image_id }}
          format: cyclonedx
          output: ${{ steps.seal.outputs.root }}/reports/sbom.cdx.json
          trivy-config: ${{ steps.seal.outputs.root }}/empty-trivy.yaml
          timeout: 15m

      - name: Bind raw reports and export the same unaccepted immutable image
        id: export
        if: always() && steps.compose.outcome == 'success' && steps.vulnerabilities.outcome == 'success' && steps.sbom.outcome == 'success'
        env:
          CAPSULE_ROOT: ${{ steps.seal.outputs.root }}
        run: python3 -I -B "$CAPSULE_ROOT/source/compose_security_os_candidate.py" finalize --root "$CAPSULE_ROOT"

      - name: Release only the owned baseline alias after its last consumer
        id: cleanup
        if: always() && steps.seal.outcome == 'success'
        env:
          CAPSULE_ROOT: ${{ steps.seal.outputs.root }}
        run: python3 -I -B "$CAPSULE_ROOT/source/compose_security_os_candidate.py" cleanup --root "$CAPSULE_ROOT"

      - name: Retain only complete public image exports
        if: always() && steps.export.outcome == 'success' && steps.cleanup.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: security-os-composed-image-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ steps.seal.outputs.root }}/candidate-image.tar.gz
            ${{ steps.seal.outputs.root }}/image-export.json

      - name: Retain bounded public composition evidence including failed attempts
        if: always() && steps.seal.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: security-os-composition-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ steps.seal.outputs.root }}/source/identity.json
            ${{ steps.seal.outputs.root }}/reports/*.json
            ${{ steps.seal.outputs.root }}/reports/*.log

  datastore:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/security/remediation-20261023') && (inputs.datastore_profile == 'postgres' || inputs.datastore_profile == 'redis')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      DATASTORE_PROFILE: ${{ inputs.datastore_profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Seal the published datastore recipe and existing bounded I/O helper
        id: seal
        run: |
          python3 -I -B - <<'PY'
          from hashlib import sha256
          import json,os,pathlib,re,subprocess,tempfile
          assert os.geteuid()==1001 and os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
          assert os.environ['DATASTORE_PROFILE'] in {'postgres','redis'}
          os.umask(0o077)
          parent=pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          assert parent.stat().st_uid==1001 and not parent.stat().st_mode&0o022
          root=pathlib.Path(tempfile.mkdtemp(prefix='security-os-compose-',dir=parent))
          (root/'source').mkdir(mode=0o700)
          commit=os.environ['GITHUB_SHA'];assert re.fullmatch('[a-f0-9]{40}',commit)
          records={}
          for name in ('compose_alpine_datastore_security.py','compose_security_os_candidate.py'):
              path='scripts/'+name
              size=subprocess.run(['git','--no-optional-locks','cat-file','-s',commit+':'+path],check=True,capture_output=True,timeout=10).stdout
              assert re.fullmatch(rb'[1-9][0-9]{0,5}\n',size) and int(size)<=131072
              raw=subprocess.run(['git','--no-optional-locks','cat-file','blob',commit+':'+path],check=True,capture_output=True,timeout=10).stdout
              assert len(raw)==int(size)
              fd=os.open(root/'source'/name,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
              with os.fdopen(fd,'wb') as out:out.write(raw);out.flush();os.fsync(out.fileno())
              records[name]={'bytes':len(raw),'sha256':sha256(raw).hexdigest()}
          with (root/'source/identity.json').open('x') as out:json.dump({'recipe_commit':commit,'files':records},out,sort_keys=True)
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a') as out:out.write('root='+str(root)+'\n')
          PY

      - name: Build and test only the selected exact datastore profile
        id: compose
        env:
          CAPSULE_ROOT: ${{ steps.seal.outputs.root }}
        run: python3 -I -B "$CAPSULE_ROOT/source/compose_alpine_datastore_security.py" compose --root "$CAPSULE_ROOT" --profile "$DATASTORE_PROFILE"

      - name: Preserve all raw datastore vulnerability findings
        id: vulnerabilities
        if: always() && steps.compose.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          TRIVY_IGNOREFILE: /dev/null
        with:
          version: v0.76.1
          image-ref: ${{ steps.compose.outputs.image_id }}
          scanners: vuln
          vuln-type: os,library
          format: json
          output: ${{ steps.seal.outputs.root }}/reports/vulnerabilities.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '0'
          trivy-config: ${{ steps.seal.outputs.root }}/empty-trivy.yaml
          timeout: 15m

      - name: Preserve the same datastore image SBOM
        id: sbom
        if: always() && steps.compose.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          TRIVY_IGNOREFILE: /dev/null
        with:
          version: v0.76.1
          image-ref: ${{ steps.compose.outputs.image_id }}
          format: cyclonedx
          output: ${{ steps.seal.outputs.root }}/reports/sbom.cdx.json
          trivy-config: ${{ steps.seal.outputs.root }}/empty-trivy.yaml
          timeout: 15m

      - name: Bind raw reports and export the exact unaccepted datastore image
        id: export
        if: always() && steps.compose.outcome == 'success' && steps.vulnerabilities.outcome == 'success' && steps.sbom.outcome == 'success'
        env:
          CAPSULE_ROOT: ${{ steps.seal.outputs.root }}
        run: python3 -I -B "$CAPSULE_ROOT/source/compose_alpine_datastore_security.py" finalize --root "$CAPSULE_ROOT" --profile "$DATASTORE_PROFILE"

      - name: Retain only complete datastore image exports
        if: always() && steps.export.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: security-datastore-${{ inputs.datastore_profile }}-image-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ steps.seal.outputs.root }}/candidate-image.tar.gz
            ${{ steps.seal.outputs.root }}/image-export.json

      - name: Retain bounded public datastore evidence including failures
        if: always() && steps.seal.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: security-datastore-${{ inputs.datastore_profile }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ steps.seal.outputs.root }}/source/identity.json
            ${{ steps.seal.outputs.root }}/reports/*.json
            ${{ steps.seal.outputs.root }}/reports/*.log
