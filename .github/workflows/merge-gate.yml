name: Merge Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  repository-governance:
    name: repository-governance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run repository breadth gate
        run: make test-gate

      - name: Run diff gate for product changes
        if: github.event_name == 'pull_request'
        run: make test-diff-gate BASE=${{ github.event.pull_request.base.sha }}

  market-postgres-gate:
    name: market-postgres-gate
    runs-on: ubuntu-latest
    needs: repository-governance
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: market_ci
          POSTGRES_PASSWORD: market_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install -r requirements-test.txt

      - name: Run mandatory market PostgreSQL proofs
        env:
          MARKET_POSTGRES_GATE_ADMIN_URL: postgresql://market_ci:market_ci@127.0.0.1:5432/postgres
          MARKET_POSTGRES_GATE_REDIS_URL: redis://127.0.0.1:6379/14
          FRONTEND_URL: http://127.0.0.1:4173
          JWT_SECRET_KEY: ci_market_postgres_gate_secret
        run: python3 scripts/run_market_postgres_gate.py --expected-sha "$(git rev-parse HEAD)"

      - name: Run real multi-worker Redis proof
        shell: bash
        env:
          APP_ENV_FILE: config/unit-test.env.example
          ENVIRONMENT: test
          SERVER_MODE: foreign
          MARKET_STAGE14_TEST_REDIS_URL: redis://127.0.0.1:6379/14
          REDIS_URL: redis://127.0.0.1:6379/14
          POSTGRES_DB: postgres
          POSTGRES_USER: market_ci
          POSTGRES_PASSWORD: market_ci
          DATABASE_URL: postgresql+asyncpg://market_ci:market_ci@127.0.0.1:5432/postgres
          SYNC_DATABASE_URL: postgresql+psycopg2://market_ci:market_ci@127.0.0.1:5432/postgres
          FRONTEND_URL: http://127.0.0.1:4173
          JWT_SECRET_KEY: ci_market_postgres_gate_secret
        run: |
          set -o pipefail
          python3 -m unittest -v tests.test_realtime_multiworker_redis 2>&1 | tee tmp/market-realtime-redis-gate.log
          python3 scripts/assert_no_unittest_skips.py tmp/market-realtime-redis-gate.log

      - name: Upload market datastore proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-gate-market-postgres-${{ github.run_number }}
          path: |
            tmp/market-postgres-gate.log
            tmp/market-realtime-redis-gate.log
          if-no-files-found: error

  observability-gate:
    name: observability-gate
    runs-on: ubuntu-latest
    needs: repository-governance
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write CI environment file
        shell: bash
        run: |
          cat > .env <<'EOF'
          SERVER_MODE=foreign
          BOT_USERNAME=ci_test_bot
          POSTGRES_DB=trading_bot_db
          POSTGRES_USER=admin
          POSTGRES_PASSWORD=strongpassword
          DATABASE_URL=postgresql+asyncpg://admin:strongpassword@db:5432/trading_bot_db
          SYNC_DATABASE_URL=postgresql+psycopg2://admin:strongpassword@db:5432/trading_bot_db
          REDIS_URL=redis://redis:6379/0
          FRONTEND_URL=http://127.0.0.1:4173
          DEV_API_KEY=REDACTED_DEV_API_KEY
          JWT_SECRET_KEY=ci_jwt_secret_key_please_override_in_real_envs
          EOF

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install -r requirements-test.txt

      - name: Run Stage 9 infrastructure self-tests
        run: make stage9-infrastructure-gate

      - name: Run Stage 9 critical mutation gate
        run: make stage9-mutation-gate

      - name: Run Stage 9 isolated registration and market matrix
        run: make stage9-test-matrix

      - name: Upload Stage 9 infrastructure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage9-infrastructure-${{ github.run_number }}
          path: |
            tmp/stage9-mutation-evidence.json
            tmp/stage9-mutation-verification.json
            tmp/stage9-mutation.log
            tmp/stage9-traceability.json
            tmp/stage9-matrix/results.json
            tmp/stage9-matrix/registration/registration.log
            tmp/stage9-matrix/market/market.log
          if-no-files-found: warn

      - name: Run focused observability gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            make observability-gate ARGS="--base-ref ${{ github.event.pull_request.base.sha }} --head-ref ${{ github.sha }}"
          else
            make observability-gate
          fi
          python3 -m unittest -v tests.test_browser_ci_bootstrap_contract
          python3 -m unittest -v tests.test_browser_ci_fixture_contract tests.test_extract_browser_ci_backend_exceptions tests.test_browser_ci_https_contract
          python3 -m unittest -v \
            tests.test_prepare_market_security_payload.MarketSecurityPayloadTests.test_actual_workflow_opt_in_and_raw_scan_export_gate_contract \
            tests.test_security_consumer_payload.SecurityPayload.test_ci_is_explicit_public_payload_only_no_activation_or_scanner_waiver

  frontend-browser-matrix:
    permissions:
      contents: read
      actions: read
    name: frontend-browser-matrix (${{ matrix.browser }} shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs:
      - repository-governance
      - observability-gate
      - market-postgres-gate
    timeout-minutes: 75
    env:
      CERTS_HOST_PATH: /tmp/trading-bot-ci-certs
      PRODUCTION_COIN_INFERENCE_SNAPSHOT_HOST_DIR: /tmp/trading-bot-ci-coin-inference
      PRODUCTION_PRODUCT_ESTIMATOR_APP_SNAPSHOT_HOST_DIR: /tmp/trading-bot-ci-product-estimator

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
        shard:
          - 1
          - 2
          - 3
          - 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Write CI environment file
        shell: bash
        run: |
          cat > .env <<'EOF'
          ENVIRONMENT=staging
          SERVER_MODE=iran
          TELEGRAM_DELIVERY_PRODUCER_MODE=queue-v1
          TELEGRAM_DELIVERY_EXPECTED_EXECUTION_OWNER=queue-v1
          TELEGRAM_NON_BOT_DELIVERY_EXECUTION_OWNER=producer-only
          PUBLIC_WEBAPP_URL=https://browser-ci.iran.example
          IRAN_SERVER_DOMAIN=browser-ci.iran.example
          BOT_USERNAME=ci_test_bot
          POSTGRES_DB=trading_bot_db
          POSTGRES_USER=admin
          POSTGRES_PASSWORD=strongpassword
          DATABASE_URL=postgresql+asyncpg://admin:strongpassword@db:5432/trading_bot_db
          SYNC_DATABASE_URL=postgresql+psycopg2://admin:strongpassword@db:5432/trading_bot_db
          REDIS_URL=redis://redis:6379/0
          FRONTEND_URL=https://127.0.0.1:4173
          DEV_API_KEY=REDACTED_DEV_API_KEY
          JWT_SECRET_KEY=ci_jwt_secret_key_please_override_in_real_envs
          EOF
          cat > frontend/.env.local <<'EOF'
          VITE_API_BASE_URL=
          VITE_STAGING_DEV_LOGIN=true
          EOF

      - name: Prepare CI host paths
        run: |
          mkdir -p -- "$CERTS_HOST_PATH" \
            "$PRODUCTION_COIN_INFERENCE_SNAPSHOT_HOST_DIR" \
            "$PRODUCTION_PRODUCT_ESTIMATOR_APP_SNAPSHOT_HOST_DIR"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build production login browser fixture
        if: matrix.shard == 1
        working-directory: frontend
        env:
          FRONTEND_BUILD_OUT_DIR: dist/production-login
          VITE_STAGING_DEV_LOGIN: 'false'
        run: npm run build

      - name: Bootstrap backend stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ./scripts/bootstrap_ci_backend.sh

      - name: Verify browser CI backend surface
        shell: bash
        run: |
          docker compose exec -T app python - <<'PY'
          from core.config import settings
          from core.public_webapp_url import public_webapp_url_for_links

          environment = (settings.environment or "").strip().lower()
          server_mode = (settings.server_mode or "").strip().lower()
          if environment != "staging":
              raise SystemExit(f"unexpected environment={environment!r}")
          if server_mode != "iran":
              raise SystemExit(f"unexpected server_mode={server_mode!r}")
          if public_webapp_url_for_links() != "https://browser-ci.iran.example":
              raise SystemExit("unexpected browser CI public WebApp origin")

          from core.telegram_delivery_runtime_policy import (
              TelegramProviderAuthorityError, assert_queue_v1_non_bot_is_producer_only,
              assert_telegram_provider_execution_authority, configured_telegram_delivery_producer_mode,
              configured_telegram_delivery_runtime,
          )
          import asyncio
          import json
          from sqlalchemy import inspect
          from core.db import engine

          assert_queue_v1_non_bot_is_producer_only()
          runtime = configured_telegram_delivery_runtime()
          if (configured_telegram_delivery_producer_mode().value != "queue-v1"
                  or settings.trading_bot_service != "api"
                  or settings.telegram_delivery_expected_execution_owner != "queue-v1"
                  or runtime.mode.value != "producer-only"
                  or runtime.legacy_workers_enabled or runtime.queue_worker_enabled
                  or settings.telegram_delivery_queue_cutover_ready
                  or settings.telegram_provider_test_authority):
              raise SystemExit("unexpected browser CI Telegram producer authority")
          for name in ("bot_token", *(f"telegram_publisher_{i}_bot_token" for i in range(1, 6))):
              value = getattr(settings, name, None)
              if (value.get_secret_value() if hasattr(value, "get_secret_value") else value):
                  raise SystemExit("unexpected browser CI provider credential")
          try:
              assert_telegram_provider_execution_authority()
          except TelegramProviderAuthorityError:
              pass
          else:
              raise SystemExit("browser CI producer gained provider execution")
          async def check_outbox_schema():
              try:
                  async with engine.connect() as connection:
                      present = await connection.run_sync(lambda db: inspect(db).has_table("offer_publication_states"))
              finally:
                  await engine.dispose()
              if not present:
                  raise SystemExit("browser CI offer publication schema missing")
          asyncio.run(check_outbox_schema())
          print(json.dumps({"schema": "browser_ci_telegram_producer_surface/1", "producer_only": True,
                            "provider_execution_refused": True, "outbox_schema_present": True,
                            "security_accepted": False}, sort_keys=True))
          PY
          curl -fsS -o /dev/null -X POST http://127.0.0.1:8000/api/auth/dev-login \
            -H 'Content-Type: application/json'
          curl -fsS -o /dev/null -D /tmp/browser-ci-cors.headers \
            -X OPTIONS http://127.0.0.1:8000/api/auth/dev-login \
            -H 'Origin: https://127.0.0.1:4173' \
            -H 'Access-Control-Request-Method: POST'
          grep -qi '^access-control-allow-origin: https://127.0.0.1:4173' /tmp/browser-ci-cors.headers

      - name: Prepare CI HTTPS fixture
        timeout-minutes: 2
        run: |
          node --test scripts/probe_browser_ci_https.test.mjs
          node frontend/scripts/browser-ci-https.mjs prepare

      - name: Trust synthetic CI CA
        timeout-minutes: 2
        shell: bash
        run: |
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          browser_ci_ca_anchor="/usr/local/share/ca-certificates/browser-ci-matrix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.crt"
          [[ ! -e "$browser_ci_ca_anchor" && ! -L "$browser_ci_ca_anchor" ]]
          sudo install -m 0644 -- "$BROWSER_CI_TLS_CA" "$browser_ci_ca_anchor"
          browser_ci_ca_identity="$(stat -c '%d:%i:%f:%u:%g:%h:%s:%y:%z' -- "$browser_ci_ca_anchor")"
          printf 'BROWSER_CI_TLS_CA_ANCHOR=%s\nBROWSER_CI_TLS_CA_IDENTITY=%s\n' \
            "$browser_ci_ca_anchor" "$browser_ci_ca_identity" >> "$GITHUB_ENV"
          sudo update-ca-certificates >/dev/null 2>&1

      - name: Run Playwright browser gate
        working-directory: frontend
        env:
          CI: 'true'
          PLAYWRIGHT_HTML_OPEN: never
          # Explicitly authorize only this hosted runner's disposable stack.
          E2E_TARGET_ENV: local
          E2E_ALLOW_LOCAL_MUTATION: local-dev-only
          E2E_BACKEND_BASE_URL: http://127.0.0.1:8000
          E2E_APP_CONTAINER_NAME: trading_bot_app
          E2E_REDIS_CONTAINER_NAME: trading_bot_redis
        shell: bash
        run: |
          case "${{ matrix.browser }}" in
            chromium)
              npm run test:e2e -- --config=playwright.https-diagnostic.config.ts --shard=${{ matrix.shard }}/4
              ;;
            firefox)
              npm run test:e2e:firefox -- --config=playwright.https-diagnostic.config.ts --shard=${{ matrix.shard }}/4
              ;;
            webkit)
              npm run test:e2e:webkit -- --config=playwright.https-diagnostic.config.ts --shard=${{ matrix.shard }}/4
              ;;
            *)
              echo "Unsupported browser: ${{ matrix.browser }}" >&2
              exit 1
              ;;
          esac

      - name: Run production login browser gate
        if: matrix.shard == 1
        working-directory: frontend
        env:
          CI: 'true'
          PLAYWRIGHT_HTML_OPEN: never
        run: >-
          npx playwright test --config=playwright.https-production-login.config.ts
          --project=${{ matrix.browser }}

      - name: Collect closed browser CI backend exception metadata
        if: always() && (failure() || cancelled())
        timeout-minutes: 1
        shell: bash
        run: |
          set +e
          mkdir -p tmp
          timeout --signal=TERM --kill-after=2s 15s \
            docker compose logs --no-color --no-log-prefix --tail 2000 app 2>&1 |
            timeout --signal=TERM --kill-after=2s 20s \
              python3 -I -B scripts/extract_browser_ci_backend_exceptions.py \
              > tmp/browser-ci-backend-exceptions.json 2>/dev/null
          pipeline_status=("${PIPESTATUS[@]}")
          python3 -I -B - "${pipeline_status[0]}" "${pipeline_status[1]}" \
            > tmp/browser-ci-backend-exception-status.json <<'PY'
          import json, sys
          producer, projector = (int(value) for value in sys.argv[1:])
          if not all(0 <= value <= 255 for value in (producer, projector)):
              raise SystemExit(1)
          print(json.dumps({"schema": "browser_ci_backend_exception_collection/1",
                            "producer_exit_code": producer, "filter_exit_code": projector}, sort_keys=True))
          PY
          exit 0

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-gate-playwright-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/playwright-report-production-login
            frontend/test-results-production-login
            tmp/browser-ci-backend-exceptions.json
            tmp/browser-ci-backend-exception-status.json
          if-no-files-found: ignore

      - name: Tear down backend stack
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Remove only the owned synthetic CI CA anchor
        if: always() && env.BROWSER_CI_TLS_CA_ANCHOR != ''
        timeout-minutes: 2
        shell: bash
        run: |
          [[ "$BROWSER_CI_TLS_CA_ANCHOR" == "/usr/local/share/ca-certificates/browser-ci-matrix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.crt" ]]
          [[ "$(stat -c '%d:%i:%f:%u:%g:%h:%s:%y:%z' -- "$BROWSER_CI_TLS_CA_ANCHOR")" == "$BROWSER_CI_TLS_CA_IDENTITY" ]]
          sudo cmp -s -- "$BROWSER_CI_TLS_CA" "$BROWSER_CI_TLS_CA_ANCHOR"
          [[ "$(stat -c '%d:%i:%f:%u:%g:%h:%s:%y:%z' -- "$BROWSER_CI_TLS_CA_ANCHOR")" == "$BROWSER_CI_TLS_CA_IDENTITY" ]]
          sudo rm -- "$BROWSER_CI_TLS_CA_ANCHOR"
          sudo update-ca-certificates >/dev/null 2>&1
