name: Coverage Report

on:
  pull_request:
    branches:
      - main
      - candidate/production-three-site-shadow
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      git_ref:
        description: Optional git ref to run the coverage report for
        required: false
        type: string
      compare_ref:
        description: Required locally resolvable ancestor commit or ref for diff coverage
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: coverage-report-${{ github.event.pull_request.number || inputs.git_ref || github.sha }}
  cancel-in-progress: true

jobs:
  backend-coverage:
    name: backend-coverage (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 0
          - 1
          - 2
          - 3
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: trading_bot_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: strongpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d trading_bot_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Write CI environment file
        shell: bash
        run: |
          cat > .env <<'EOF'
          SERVER_MODE=foreign
          BOT_USERNAME=ci_test_bot
          POSTGRES_DB=trading_bot_db
          POSTGRES_USER=admin
          POSTGRES_PASSWORD=strongpassword
          DATABASE_URL=postgresql+asyncpg://admin:strongpassword@db:5432/trading_bot_db
          SYNC_DATABASE_URL=postgresql+psycopg2://admin:strongpassword@db:5432/trading_bot_db
          REDIS_URL=redis://redis:6379/0
          FRONTEND_URL=http://127.0.0.1:4173
          DEV_API_KEY=REDACTED_DEV_API_KEY
          JWT_SECRET_KEY=ci_jwt_secret_key_please_override_in_real_envs
          EOF

      - name: Install backend coverage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1 file make nginx
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install -r requirements-test.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run backend coverage shard
        id: backend_coverage
        continue-on-error: true
        shell: bash
        run: |
          set +e
          status=0
          mkdir -p tmp
          export COVERAGE_FILE="$PWD/tmp/.coverage.backend-shard-${{ matrix.shard }}"
          python3 -m coverage run --branch --parallel-mode \
            scripts/run_repository_unittest_shard.py \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 4 \
            --manifest "tmp/backend-shard-${{ matrix.shard }}.json" \
            --verbosity 2 2>&1 | tee "tmp/backend-shard-${{ matrix.shard }}.log"
          command_status=${PIPESTATUS[0]}
          if [[ "$command_status" -ne 0 ]]; then
            status=$command_status
          fi
          if [[ "${{ matrix.shard }}" == "0" ]]; then
            (
              printf 'stage9_evidence_commit=%s\n' "$(git rev-parse HEAD)"
              export DATABASE_URL='postgresql+asyncpg://admin:strongpassword@127.0.0.1:5432/trading_bot_db'
              export SYNC_DATABASE_URL='postgresql+psycopg2://admin:strongpassword@127.0.0.1:5432/trading_bot_db'
              export TRADING_BOT_EXPECTED_CHECKOUT="$PWD"
              export TRADING_BOT_EXPECTED_SCRATCH_CLUSTER_SYSTEM_ID="$(
                python3 -c "import psycopg2; connection=psycopg2.connect('postgresql://admin:strongpassword@127.0.0.1:5432/postgres'); cursor=connection.cursor(); cursor.execute('SELECT system_identifier FROM pg_control_system()'); print(cursor.fetchone()[0]); connection.close()"
              )"
              export STAGE9_COVERAGE_FILE="$PWD/tmp/.coverage.backend-optin-postgres"
              python3 scripts/run_registration_scratch_suite.py
            ) > tmp/backend-postgres-opt-in.log 2>&1 &
            postgres_pid=$!
            (
              printf 'stage9_evidence_commit=%s\n' "$(git rev-parse HEAD)"
              export STAGE5_TEST_REDIS_URL='redis://127.0.0.1:6379/0'
              export STAGE6_TEST_REDIS_URL='redis://127.0.0.1:6379/0'
              export COVERAGE_FILE="$PWD/tmp/.coverage.backend-optin-redis"
              python3 -m coverage run --branch --parallel-mode -m unittest -v \
                tests.test_stage5_event_isolation_redis \
                tests.test_stage6_otp_delivery_redis
            ) > tmp/backend-redis-opt-in.log 2>&1 &
            redis_pid=$!
            postgres_status=0
            redis_status=0
            wait "$postgres_pid" || postgres_status=$?
            wait "$redis_pid" || redis_status=$?
            cat tmp/backend-postgres-opt-in.log
            cat tmp/backend-redis-opt-in.log
            if [[ "$postgres_status" -ne 0 ]]; then
              status=$postgres_status
            fi
            if [[ "$redis_status" -ne 0 ]]; then
              status=$redis_status
            fi
          fi
          printf '%s\n' "$status" > "tmp/backend-shard-${{ matrix.shard }}.exitcode"
          exit "$status"

      - name: Upload backend coverage shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-shard-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            tmp/.coverage.backend-shard-${{ matrix.shard }}.*
            tmp/.coverage.backend-optin-postgres.*
            tmp/.coverage.backend-optin-redis.*
            tmp/backend-shard-${{ matrix.shard }}.exitcode
            tmp/backend-shard-${{ matrix.shard }}.json
            tmp/backend-shard-${{ matrix.shard }}.log
            tmp/backend-postgres-opt-in.log
            tmp/backend-redis-opt-in.log
          include-hidden-files: true
          if-no-files-found: error

      - name: Fail backend shard if a covered suite failed
        if: always()
        shell: bash
        run: |
          status="$(cat "tmp/backend-shard-${{ matrix.shard }}.exitcode" 2>/dev/null || echo 1)"
          if [[ ! "$status" =~ ^[0-9]+$ ]]; then
            exit 1
          fi
          exit "$status"

  repository-coverage:
    name: repository-coverage
    if: always()
    needs: backend-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: trading_bot_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: strongpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d trading_bot_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Write CI environment file
        shell: bash
        run: |
          cat > .env <<'EOF'
          SERVER_MODE=foreign
          BOT_USERNAME=ci_test_bot
          POSTGRES_DB=trading_bot_db
          POSTGRES_USER=admin
          POSTGRES_PASSWORD=strongpassword
          DATABASE_URL=postgresql+asyncpg://admin:strongpassword@db:5432/trading_bot_db
          SYNC_DATABASE_URL=postgresql+psycopg2://admin:strongpassword@db:5432/trading_bot_db
          REDIS_URL=redis://redis:6379/0
          FRONTEND_URL=http://127.0.0.1:4173
          DEV_API_KEY=REDACTED_DEV_API_KEY
          JWT_SECRET_KEY=ci_jwt_secret_key_please_override_in_real_envs
          EOF

      - name: Install backend coverage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1 file make nginx
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install -r requirements-test.txt

      - name: Resolve diff coverage base
        id: coverage_base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          MANUAL_COMPARE_REF: ${{ inputs.compare_ref }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              ;;
            push)
              base="$PUSH_BEFORE_SHA"
              ;;
            workflow_dispatch)
              base="$MANUAL_COMPARE_REF"
              ;;
            *)
              printf 'unsupported coverage event: %s\n' "$EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            printf 'coverage base is missing or invalid for %s\n' "$EVENT_NAME" >&2
            exit 1
          fi
          if ! base_sha="$(git rev-parse --verify --end-of-options "${base}^{commit}")"; then
            printf 'coverage base does not resolve to a commit: %s\n' "$base" >&2
            exit 1
          fi
          head_sha="$(git rev-parse --verify HEAD^{commit})"
          if [[ "$base_sha" == "$head_sha" ]]; then
            printf 'coverage base must differ from HEAD\n' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$base_sha" "$head_sha"; then
            printf 'coverage base is not an ancestor of HEAD\n' >&2
            exit 1
          fi
          printf 'base=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Download backend coverage shards
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: backend-coverage-shard-${{ github.run_id }}-*
          path: tmp/backend-coverage-inputs
          merge-multiple: true

      - name: Combine verified backend coverage shards
        id: backend_coverage
        continue-on-error: true
        shell: bash
        run: |
          set +e
          status=0
          mkdir -p tmp
          shopt -s nullglob
          missing_coverage_artifacts=0
          for shard in 0 1 2 3; do
            status_file="tmp/backend-coverage-inputs/backend-shard-${shard}.exitcode"
            shard_status="$(cat "$status_file" 2>/dev/null || echo 1)"
            if [[ "$shard_status" != "0" ]]; then
              status=1
            fi
            coverage_files=(tmp/backend-coverage-inputs/.coverage.backend-shard-"${shard}".*)
            if (( ${#coverage_files[@]} == 0 )); then
              printf 'missing backend coverage artifact for shard %s\n' "$shard" >&2
              missing_coverage_artifacts=1
            fi
          done
          if [[ "$missing_coverage_artifacts" -ne 0 ]]; then
            printf '%s\n' 1 > tmp/backend-coverage.exitcode
            exit 1
          fi
          python3 scripts/verify_repository_unittest_shards.py \
            --manifest-directory tmp/backend-coverage-inputs \
            --shard-count 4 \
            --output tmp/backend-shard-verification.json || status=$?
          shopt -s nullglob
          backend_logs=(tmp/backend-coverage-inputs/backend-shard-*.log)
          : > tmp/backend-coverage.log
          for log in "${backend_logs[@]}"; do
            printf '\n===== %s =====\n' "$(basename "$log")" >> tmp/backend-coverage.log
            cat "$log" >> tmp/backend-coverage.log
          done
          COVERAGE_FILE="$PWD/tmp/.coverage" \
            python3 -m coverage combine --append tmp/backend-coverage-inputs || status=$?
          COVERAGE_FILE="$PWD/tmp/.coverage" \
            python3 -m coverage json -o tmp/backend-coverage.json || status=$?
          COVERAGE_FILE="$PWD/tmp/.coverage" \
            python3 -m coverage xml \
              --include='api/*,bot/*,core/*,models/*,scripts/*,main.py,manage.py,run_bot.py,schemas.py' \
              -o tmp/backend-coverage.xml || status=$?
          COVERAGE_FILE="$PWD/tmp/.coverage" \
            python3 -m coverage html -d tmp/backend-coverage-html || status=$?
          printf '%s\n' "$status" > tmp/backend-coverage.exitcode
          exit "$status"

      - name: Run frontend unit coverage suite
        id: frontend_coverage
        continue-on-error: true
        working-directory: frontend
        env:
          CI: 'true'
        shell: bash
        run: |
          set +e
          status=0
          npm run test:unit:coverage 2>&1 | tee ../tmp/frontend-unit-coverage.log
          command_status=${PIPESTATUS[0]}
          if [[ "$command_status" -ne 0 ]]; then
            status=$command_status
          fi
          printf '%s\n' "$status" > ../tmp/frontend-unit-coverage.exitcode
          exit "$status"

      - name: Build repository coverage summary
        if: always()
        shell: bash
        run: |
          backend_suite_exit_code="$(cat tmp/backend-coverage.exitcode 2>/dev/null || echo 1)"
          frontend_suite_exit_code="$(cat tmp/frontend-unit-coverage.exitcode 2>/dev/null || echo 1)"
          python3 ./scripts/build_repo_coverage_summary.py \
            --backend-json tmp/backend-coverage.json \
            --frontend-summary frontend/coverage/coverage-summary.json \
            --markdown-out tmp/repo-coverage-summary.md \
            --json-out tmp/repo-coverage-summary.json
          cat tmp/repo-coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo '## GitHub Navigation'
            echo
            echo '- Open **Actions** in GitHub, then open the latest **Coverage Report** run.'
            echo '- Read the percentages directly in the run **Summary** tab.'
            echo '- Download **repository-coverage-${{ github.run_number }}** from the **Artifacts** section for the backend/frontend HTML reports and raw JSON/XML outputs.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$backend_suite_exit_code" != '0' && -f tmp/backend-coverage.log ]]; then
            {
              echo
              echo '## Backend Coverage Failure Tail'
              echo
              echo '```text'
              tail -n 200 tmp/backend-coverage.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$frontend_suite_exit_code" != '0' && -f tmp/frontend-unit-coverage.log ]]; then
            {
              echo
              echo '## Frontend Coverage Failure Tail'
              echo
              echo '```text'
              tail -n 200 tmp/frontend-unit-coverage.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce Stage 9 changed-code coverage
        if: always()
        shell: bash
        run: |
          status=0
          diff-cover tmp/backend-coverage.xml \
            --compare-branch=${{ steps.coverage_base.outputs.base }} \
            --fail-under=100 \
            --format json:tmp/backend-diff-cover.json || status=$?
          python3 scripts/check_stage9_diff_coverage.py backend \
            --base-ref ${{ steps.coverage_base.outputs.base }} \
            --head-ref HEAD \
            --coverage tmp/backend-coverage.xml \
            --output tmp/backend-stage9-diff-coverage.json || status=$?
          python3 scripts/check_stage9_diff_coverage.py frontend \
            --base-ref ${{ steps.coverage_base.outputs.base }} \
            --head-ref HEAD \
            --coverage frontend/coverage/coverage-final.json \
            --output tmp/frontend-stage9-diff-coverage.json || status=$?
          exit "$status"

      - name: Build Stage 9 runtime, mutation, and traceability evidence
        if: always()
        shell: bash
        run: |
          status=0
          make stage9-infrastructure-gate || status=$?
          make stage9-test-matrix || status=$?
          make stage9-mutation-gate || status=$?
          python3 scripts/build_stage9_runtime_evidence.py \
            --matrix tmp/stage9-matrix/results.json \
            --postgres-log tmp/backend-coverage-inputs/backend-postgres-opt-in.log \
            --redis-log tmp/backend-coverage-inputs/backend-redis-opt-in.log \
            --output tmp/stage9-runtime-evidence.json || status=$?
          RESULTS=tmp/stage9-runtime-evidence.json \
          BACKEND_COVERAGE=tmp/backend-stage9-diff-coverage.json \
          FRONTEND_COVERAGE=tmp/frontend-stage9-diff-coverage.json \
          MUTATION=tmp/stage9-mutation-evidence.json \
          OUTPUT=tmp/stage9-traceability.json \
            make stage9-evidence-gate || status=$?
          exit "$status"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-coverage-${{ github.run_number }}
          path: |
            tmp/backend-coverage-html
            tmp/backend-coverage-inputs
            tmp/backend-coverage.exitcode
            tmp/backend-coverage.log
            tmp/backend-shard-verification.json
            tmp/backend-coverage.json
            tmp/backend-coverage.xml
            tmp/backend-diff-cover.json
            tmp/backend-stage9-diff-coverage.json
            frontend/coverage
            tmp/frontend-stage9-diff-coverage.json
            tmp/frontend-unit-coverage.exitcode
            tmp/frontend-unit-coverage.log
            tmp/repo-coverage-summary.md
            tmp/repo-coverage-summary.json
            tmp/stage9-matrix
            tmp/stage9-mutation-evidence.json
            tmp/stage9-mutation-verification.json
            tmp/stage9-mutation.log
            tmp/stage9-runtime-evidence.json
            tmp/stage9-traceability.json
          if-no-files-found: warn

      - name: Fail coverage job if a covered suite failed
        if: always()
        shell: bash
        run: |
          backend_suite_exit_code="$(cat tmp/backend-coverage.exitcode 2>/dev/null || echo 1)"
          frontend_suite_exit_code="$(cat tmp/frontend-unit-coverage.exitcode 2>/dev/null || echo 1)"
          echo "Backend coverage exit code: $backend_suite_exit_code"
          echo "Frontend coverage exit code: $frontend_suite_exit_code"
          if [[ "$backend_suite_exit_code" == '0' && "$frontend_suite_exit_code" == '0' ]]; then
            exit 0
          fi
          echo 'At least one covered suite failed.' >&2
          exit 1
