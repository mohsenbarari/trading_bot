name: Current2389 missing CVE probes and unchanged32

on:
  workflow_dispatch:
    inputs:
      run_proof:
        description: Run exact2389 missing native, component and SQLite probes plus unchanged32 in disposable CI; no rebuild or production
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: security-current2389-missing-probes
  cancel-in-progress: false

jobs:
  proof:
    if: github.repository == 'mohsenbarari/trading_bot' && github.ref == 'refs/heads/main' && inputs.run_proof
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exactly the reviewed proof controller commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify owned source and PUBLIC input contracts
        run: |
          APP_ENV_FILE=config/unit-test.env.example /usr/bin/python3 -I -S -B deploy/maintenance/app_current2389_probe/test_probe.py

      - name: Seal current source and run exact gold2 disposable proofs
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          /usr/bin/python3 -I -S -B deploy/maintenance/app_current2389_probe/seal_and_run.py \
            --root "$RUNNER_TEMP/security-app-ci-probe2389-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --source-sha256 2efc4b7a26f738f7385ccd82ccc2109dccaaaffbab1c2a5ded4a9eaca30f0b5a \
            --execute-reviewed-current2389-probes

      - name: Preserve complete inventory, raw evidence, actual assertions and finalizers
        if: always() && steps.run.outputs.root != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-app-current2389-probe-proof-${{ github.run_id }}-${{ github.run_attempt }}
          archive: true
          overwrite: false
          include-hidden-files: false
          retention-days: 10
          if-no-files-found: error
          path: |
            ${{ steps.run.outputs.root }}/reports/*.json
            ${{ steps.run.outputs.root }}/evidence/public-evidence.zip
