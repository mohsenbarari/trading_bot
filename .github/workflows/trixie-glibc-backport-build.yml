name: Three exact glibc84243 full package candidates
on:
  workflow_dispatch:
    inputs:
      execute:
        description: Build only reviewed local package candidates on three disposable hosted VMs
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: glibc84243-three-profiles-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    if: inputs.execute == true && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/security/remediation-20261023')
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: trixie241
            entry: build_hosted.py
            source_sha256: 07663b67bd712920a22a96ffb67fac37a9e3bbf27f304e8676b9b3cd47fa72e0
            root_prefix: glibc84243
            confirm: BUILD-ONLY-DISPOSABLE-CI-TRIXIE-GLIBC-84243-FULL-PACKAGES-20261101-01
          - profile: ubuntu239
            entry: host_ubuntu239.py
            source_sha256: 3122e4182d62b8c428c5698917fd26dab48da7bb9fb6f57f205a9cc3a0cdcba3
            root_prefix: glibc84243-ubuntu239
            confirm: BUILD-ONLY-DISPOSABLE-CI-UBUNTU239-GLIBC-84243-FULL-PACKAGES-20261101-01
          - profile: ubuntu243
            entry: host_ubuntu243.py
            source_sha256: cb257a0a117a9d13a17b0921eb21539be5abef38ae5983178c61b84fb7412955
            root_prefix: glibc84243-ubuntu243
            confirm: BUILD-ONLY-DISPOSABLE-CI-UBUNTU243-GLIBC-84243-FULL-PACKAGES-20261101-01
    steps:
      - name: Check out the exact reviewed recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Build full packages with mandatory original vendor and ABI evidence
        id: build
        shell: bash
        run: |
          /usr/bin/python3 -I -S -B deploy/maintenance/glibc_backport_build/${{ matrix.entry }} \
            --repo "$GITHUB_WORKSPACE" --commit "$GITHUB_SHA" \
            --root "$RUNNER_TEMP/${{ matrix.root_prefix }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --source-sha256 ${{ matrix.source_sha256 }} \
            --execute-hosted-build --confirm ${{ matrix.confirm }}
      - name: Preserve only completed candidate packages and public proofs
        if: success() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.profile }}-glibc84243-packages-${{ github.run_id }}-${{ github.run_attempt }}
          archive: true
          overwrite: false
          include-hidden-files: false
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/${{ matrix.root_prefix }}-${{ github.run_id }}-${{ github.run_attempt }}/package-output/*
      - name: Preserve bounded capacity and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.profile }}-glibc84243-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          archive: true
          overwrite: false
          include-hidden-files: false
          retention-days: 10
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/${{ matrix.root_prefix }}-${{ github.run_id }}-${{ github.run_attempt }}/result.json
            ${{ runner.temp }}/${{ matrix.root_prefix }}-${{ github.run_id }}-${{ github.run_attempt }}/hosted-failure.json
            ${{ runner.temp }}/${{ matrix.root_prefix }}-${{ github.run_id }}-${{ github.run_attempt }}/reports/*
