name: Two exact glibc84243 pending-review package candidates
on:
  workflow_dispatch:
    inputs:
      execute:
        description: Build only selected reviewed local package candidates on disposable hosted VMs
        required: true
        type: boolean
        default: false
      profile:
        description: Select the exact package family; unselected jobs perform no recipe work
        required: true
        type: choice
        default: both
        options: [both, trixie241, ubuntu243]
permissions:
  contents: read
  actions: read
concurrency:
  group: glibc84243-two-profile-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    if: inputs.execute == true && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/security/remediation-20261023')
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: trixie241
            entry: build_hosted.py
            source_sha256: c9a839f0bb44b5932847df8db2c0f6405cc01598085e88a90aa9ec46f5c5a5d6
            root_prefix: glibc84243-two-trixie241
            confirm: BUILD-ONLY-DISPOSABLE-CI-TWO-TRIXIE241-GLIBC-84243-FULL-PACKAGES-20261101-01
          - profile: ubuntu243
            entry: host_ubuntu243.py
            source_sha256: 863012d000ef6a1b71f7a4c343151f55a7b1ee190eb775b3c9223a9d925c52e9
            root_prefix: glibc84243-two-ubuntu243
            confirm: BUILD-ONLY-DISPOSABLE-CI-TWO-UBUNTU243-GLIBC-84243-FULL-PACKAGES-20261101-01
    steps:
      - name: Check out the exact reviewed recipe
        if: inputs.profile == 'both' || inputs.profile == matrix.profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Build full packages with mandatory original vendor and ABI evidence
        id: build
        if: inputs.profile == 'both' || inputs.profile == matrix.profile
        shell: bash
        run: |
          /usr/bin/python3 -I -S -B deploy/maintenance/glibc_backport_two_profiles/${{ matrix.entry }} \
            --repo "$GITHUB_WORKSPACE" --commit "$GITHUB_SHA" \
            --root "$RUNNER_TEMP/${{ matrix.root_prefix }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --source-sha256 ${{ matrix.source_sha256 }} \
            --execute-hosted-build --confirm ${{ matrix.confirm }}
      - name: Preserve completed candidate packages pending Root review
        if: (inputs.profile == 'both' || inputs.profile == matrix.profile) && success() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.profile }}-glibc84243-candidates-PENDING-ROOT-REVIEW-${{ github.run_id }}-${{ github.run_attempt }}
          archive: true
          overwrite: false
          include-hidden-files: false
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/${{ matrix.root_prefix }}-${{ github.run_id }}-${{ github.run_attempt }}/package-output/*
      - name: Preserve bounded capacity and failure evidence
        if: always() && (inputs.profile == 'both' || inputs.profile == matrix.profile)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.profile }}-glibc84243-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          archive: true
          overwrite: false
          include-hidden-files: false
          retention-days: 10
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/${{ matrix.root_prefix }}-${{ github.run_id }}-${{ github.run_attempt }}/result.json
            ${{ runner.temp }}/${{ matrix.root_prefix }}-${{ github.run_id }}-${{ github.run_attempt }}/hosted-failure.json
            ${{ runner.temp }}/${{ matrix.root_prefix }}-${{ github.run_id }}-${{ github.run_attempt }}/reports/*
            ${{ runner.temp }}/${{ matrix.root_prefix }}-${{ github.run_id }}-${{ github.run_attempt }}/reports/two-profile-raw-failure/*
