name: Native Ubuntu SQLite WAL and FTS5 gold2 package evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqlite-ubuntu-gold2-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/security/remediation-20261023'
    runs-on: ubuntu-24.04
    # Independent ephemeral VMs. One profile's failure must not erase its peer's evidence.
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - variant: noble
            package_version: 3.45.1-1ubuntu2.8+gold2
          - variant: resolute
            package_version: 3.46.1-9ubuntu0.3+gold2
    # New clocks: wrapper 9120s (152min) includes original build/finalizer clocks.
    # 10800s >= checkout180 + wrapper9120 + two upload steps600 each + margin300.
    timeout-minutes: 180
    steps:
      - name: Check out the exact reviewed source
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Build only the authenticated matching Ubuntu package
        id: build
        timeout-minutes: 155
        shell: bash
        env:
          SQLITE_VARIANT: ${{ matrix.variant }}
        run: |
          nonce=$(/usr/bin/python3 -I -B -c 'import secrets; print(secrets.token_hex(16))')
          package_root="$RUNNER_TEMP/sqlite-ubuntu-gold2-$SQLITE_VARIANT-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$nonce"
          echo "root=$package_root" >> "$GITHUB_OUTPUT"
          /usr/bin/env -i \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME="$HOME" LC_ALL=C.UTF-8 \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            /usr/bin/python3 -I -B scripts/prepare_sqlite_ubuntu_gold2_ci_context.py \
            --repo "$GITHUB_WORKSPACE" --commit "$GITHUB_SHA" \
            --root "$package_root" --nonce "$nonce" --variant "$SQLITE_VARIANT" \
            --execute-hosted-build

      - name: Retain only the nine complete matching Ubuntu package outputs
        if: success() && steps.build.outcome == 'success'
        timeout-minutes: 10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, node24
        with:
          name: sqlite-ubuntu-gold2-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          archive: true
          overwrite: false
          include-hidden-files: false
          retention-days: 90
          if-no-files-found: error
          # Adapter proved exact nine-file inventory, regular0644 and all consumers before success.
          path: |
            ${{ steps.build.outputs.root }}/package-output/libsqlite3-0_${{ matrix.package_version }}_amd64.deb
            ${{ steps.build.outputs.root }}/package-output/sqlite3_${{ matrix.package_version }}_amd64.changes
            ${{ steps.build.outputs.root }}/package-output/sqlite3_${{ matrix.package_version }}_amd64.buildinfo
            ${{ steps.build.outputs.root }}/package-output/provenance.json
            ${{ steps.build.outputs.root }}/package-output/positive-baseline.json
            ${{ steps.build.outputs.root }}/package-output/positive-candidate.json
            ${{ steps.build.outputs.root }}/package-output/abi-contract.json
            ${{ steps.build.outputs.root }}/package-output/vendor-standard.log
            ${{ steps.build.outputs.root }}/package-output/vendor-fts5-regression.log

      - name: Retain bounded public evidence including failures
        if: always() && steps.build.outcome != 'skipped'
        timeout-minutes: 10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, node24
        with:
          name: sqlite-ubuntu-gold2-evidence-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          archive: true
          overwrite: false
          include-hidden-files: false
          retention-days: 10
          if-no-files-found: warn
          path: |
            ${{ steps.build.outputs.root }}/source-identity.json
            ${{ steps.build.outputs.root }}/reports/*.json
            ${{ steps.build.outputs.root }}/*.log
