name: Fixed App ed59 isolated runtime smoke

on:
  workflow_dispatch:
    inputs:
      run_smoke:
        description: Run A-D plus 24 selected component tests on the fixed unaccepted ed59 image
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: security-app-ed59-runtime-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: inputs.run_smoke && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/security/remediation-20261023')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CONTROLLER_SHA: 1934d65bef4567d37a7d7c8492e3eee9e94d3d213a403896df30173184f05af9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Seal public source and run only disposable hosted image smoke
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I -B - <<'PY'
          from contextlib import ExitStack
          from hashlib import sha256
          import json,os,pathlib,re,resource,stat,subprocess,sys,tempfile
          assert os.geteuid()==1001 and os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
          os.umask(0o077)
          parent=pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          assert parent.stat().st_uid==1001 and not parent.stat().st_mode&0o022
          root=pathlib.Path(tempfile.mkdtemp(prefix='security-app-ci-smoke-',dir=parent))
          for name in ('source','reports','docker-config'):(root/name).mkdir(mode=0o700)
          commit=os.environ['GITHUB_SHA'];assert re.fullmatch('[a-f0-9]{40}',commit)
          def capture(argv,maximum):
              fd=os.memfd_create('public-source-buffer',os.MFD_CLOEXEC)
              def bounds():resource.setrlimit(resource.RLIMIT_FSIZE,(maximum+1,maximum+1));resource.setrlimit(resource.RLIMIT_CORE,(0,0))
              try:
                  subprocess.run(argv,stdin=subprocess.DEVNULL,stdout=fd,stderr=subprocess.DEVNULL,timeout=15,check=True,preexec_fn=bounds)
                  size=os.fstat(fd).st_size;assert 0<size<=maximum
                  return os.pread(fd,size+1,0)
              finally:os.close(fd)
          assert capture(['git','--no-optional-locks','rev-parse','HEAD'],64).strip()==commit.encode()
          paths={name:'scripts/'+name for name in ('run_app_image_ci_smoke.py','compose_security_os_candidate.py','compose_app_mountpoint_image.py',
              'compose_market_security_os_candidate.py','admit_security_component_image_reuse.py')}
          for name in ('datastore_candidate_contract.py','runtime_image_archive_transport.py'):paths[name]='deploy/maintenance/'+name
          for name in ('test_security_form_parser.py','test_stage6_otp_delivery_redis.py','test_telegram_otp_ephemeral_queue_redis.py'):paths[name]='tests/'+name
          records={};checks=[]
          identity=lambda q:(q.st_dev,q.st_ino,q.st_mode,q.st_uid,q.st_gid,q.st_nlink,q.st_size,q.st_mtime_ns,q.st_ctime_ns)
          with ExitStack() as stack:
              for name,path in paths.items():
                  operand=commit+':'+path
                  size=capture(['git','--no-optional-locks','cat-file','-s',operand],64)
                  assert re.fullmatch(rb'[1-9][0-9]{0,5}\n',size) and int(size)<=131072
                  raw=capture(['git','--no-optional-locks','cat-file','blob',operand],int(size));assert len(raw)==int(size)
                  if name=='run_app_image_ci_smoke.py':assert sha256(raw).hexdigest()==os.environ['CONTROLLER_SHA'];controller=raw
                  target=root/'source'/name
                  fd=os.open(target,os.O_RDWR|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600);stack.callback(os.close,fd)
                  view=memoryview(raw)
                  while view:
                      count=os.write(fd,view);assert count>0;view=view[count:]
                  os.fsync(fd);before=identity(os.fstat(fd))
                  assert before[2:6]==(0o100600,1001,os.getegid(),1)
                  def check(fd=fd,target=target,before=before,raw=raw):
                      assert before==identity(os.fstat(fd))==identity(target.lstat()) and os.pread(fd,len(raw)+1,0)==raw
                  check();checks.append(check);records[name]={'path':path,'bytes':len(raw),'sha256':sha256(raw).hexdigest()}
              with (root/'reports/source-identity.json').open('x') as out:json.dump({'source_commit':commit,'files':records,'security_accepted':False},out,sort_keys=True)
              with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a') as out:out.write('root='+str(root)+'\n')
              sys.argv=[str(root/'source/run_app_image_ci_smoke.py'),'--root',str(root)]
              try:exec(compile(controller,sys.argv[0],'exec'),{'__name__':'__main__','__file__':sys.argv[0]})
              finally:
                  for check in checks:check()
          PY

      - name: Preserve only bounded public actual results and owned cleanup evidence
        if: always() && steps.run.outputs.root != ''
        uses: actions/upload-artifact@v4
        with:
          name: security-app-ed59-runtime-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ steps.run.outputs.root }}/reports/*.json
