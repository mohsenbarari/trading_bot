name: Managed age security tool candidate
on:
  workflow_dispatch:
    inputs:
      execute:
        description: Build public candidate only; no install or backup authority
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: managed-age132-security-tool
  cancel-in-progress: false
jobs:
  candidate:
    if: inputs.execute == true && github.ref == 'refs/heads/main' && github.repository == 'mohsenbarari/trading_bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Exact clean Source preflight
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(id -u)" = 1001
          test "$GITHUB_REPOSITORY_ID" = 1065680631
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          git diff --cached --quiet
          test "$(git ls-files --others --exclude-standard -z | wc -c)" = 0
          printf '%s  %s\n' 0a9b8b684ecc3330cfd0f6be7129116de81dc71cc2c20decab9b472dc49c84b9 scripts/security_age132_tool/worker.py | sha256sum -c -
      - name: Finite candidate build; unresolved findings quarantine
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -I -S -B scripts/security_age132_tool/worker.py --build-managed-age132 0a9b8b684ecc3330cfd0f6be7129116de81dc71cc2c20decab9b472dc49c84b9
      - name: Retain only public candidate, vendor Source and raw evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: managed-age132-public-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-age132-public/*
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 10
        timeout-minutes: 10
