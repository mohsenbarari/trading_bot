name: Selected browser CI diagnostic

on:
  workflow_call:
    inputs:
      git_ref:
        required: true
        type: string
      scenario:
        required: false
        default: both
        type: string
      browser:
        required: false
        default: chromium
        type: string
  workflow_dispatch:
    inputs:
      git_ref:
        description: Exact reviewed 40-character source commit SHA
        required: true
        type: string
      scenario:
        description: Synthetic failing scenarios only; never release acceptance
        required: true
        default: both
        type: choice
        options: [mandatory, offers, both, chat-menu, accounts-and-menu]
      browser:
        required: true
        default: chromium
        type: choice
        options: [chromium, firefox, webkit]

permissions:
  contents: read
  actions: read

jobs:
  browser-diagnostic:
    permissions:
      contents: read
      actions: read
    name: Selected synthetic browser diagnostic (not release acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CERTS_HOST_PATH: /tmp/trading-bot-ci-certs
      PRODUCTION_COIN_INFERENCE_SNAPSHOT_HOST_DIR: /tmp/trading-bot-ci-coin-inference
      PRODUCTION_PRODUCT_ESTIMATOR_APP_SNAPSHOT_HOST_DIR: /tmp/trading-bot-ci-product-estimator
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.git_ref }}
    - name: Bind exact diagnostic source
      id: source
      env:
        REQUESTED_REF: ${{ inputs.git_ref }}
        REQUESTED_SCENARIO: ${{ inputs.scenario }}
        REQUESTED_BROWSER: ${{ inputs.browser }}
      run: |-
        python3 -I -B - <<'PYCODE'
        import json, os, re, subprocess
        from pathlib import Path
        requested = os.environ['REQUESTED_REF']
        scenario = os.environ['REQUESTED_SCENARIO']
        browser = os.environ['REQUESTED_BROWSER']
        if not re.fullmatch('[0-9a-f]{40}', requested):
            raise SystemExit('exact commit SHA required')
        if scenario not in {'mandatory', 'offers', 'both', 'chat-menu', 'accounts-and-menu'} or browser not in {'chromium', 'firefox', 'webkit'}:
            raise SystemExit('unknown diagnostic selection')
        head = subprocess.run(['git', 'rev-parse', 'HEAD'], check=True, capture_output=True, text=True, timeout=10).stdout.strip()
        if head != requested:
            raise SystemExit('checked source differs')
        Path('tmp').mkdir(exist_ok=True)
        Path('tmp/browser-ci-diagnostic.json').write_text(json.dumps({
            'schema': 'browser_ci_selected_diagnostic/1', 'source_commit': head,
            'workflow_commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
            'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'source_binding_verified': True,
            'scenario': scenario, 'browser': browser,
            'preview_transport_requested': 'https', 'https_certificate_validation_required': True,
            'diagnostic_only': True, 'full_matrix_accepted': False, 'security_accepted': False,
        }, sort_keys=True) + '\n')
        PYCODE
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.22.1
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Write CI environment file
      shell: bash
      run: |
        cat > .env <<'EOF'
        ENVIRONMENT=staging
        SERVER_MODE=iran
        TELEGRAM_DELIVERY_PRODUCER_MODE=queue-v1
        TELEGRAM_DELIVERY_EXPECTED_EXECUTION_OWNER=queue-v1
        TELEGRAM_NON_BOT_DELIVERY_EXECUTION_OWNER=producer-only
        PUBLIC_WEBAPP_URL=https://browser-ci.iran.example
        IRAN_SERVER_DOMAIN=browser-ci.iran.example
        BOT_USERNAME=ci_test_bot
        POSTGRES_DB=trading_bot_db
        POSTGRES_USER=admin
        POSTGRES_PASSWORD=strongpassword
        DATABASE_URL=postgresql+asyncpg://admin:strongpassword@db:5432/trading_bot_db
        SYNC_DATABASE_URL=postgresql+psycopg2://admin:strongpassword@db:5432/trading_bot_db
        REDIS_URL=redis://redis:6379/0
        FRONTEND_URL=https://127.0.0.1:4173
        DEV_API_KEY=REDACTED_DEV_API_KEY
        JWT_SECRET_KEY=ci_jwt_secret_key_please_override_in_real_envs
        EOF
        cat > frontend/.env.local <<'EOF'
        VITE_API_BASE_URL=
        VITE_STAGING_DEV_LOGIN=true
        EOF
    - name: Prepare CI host paths
      run: |
        mkdir -p -- "$CERTS_HOST_PATH" \
          "$PRODUCTION_COIN_INFERENCE_SNAPSHOT_HOST_DIR" \
          "$PRODUCTION_PRODUCT_ESTIMATOR_APP_SNAPSHOT_HOST_DIR"
    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci
    - name: Install Playwright browser
      env:
        DIAGNOSTIC_BROWSER: ${{ inputs.browser }}
      working-directory: frontend
      run: npx playwright install --with-deps "$DIAGNOSTIC_BROWSER"
    - name: Observe selected browser secure-cookie loopback policy
      id: cookie
      timeout-minutes: 2
      working-directory: frontend
      env:
        DIAGNOSTIC_BROWSER: ${{ inputs.browser }}
      shell: bash
      run: |
        node --test ../scripts/probe_browser_ci_secure_cookie.test.mjs
        mkdir -p ../tmp
        timeout --signal=TERM --kill-after=2s 75s \
          node ../scripts/probe_browser_ci_secure_cookie.mjs "$DIAGNOSTIC_BROWSER" \
          > ../tmp/browser-ci-secure-cookie.json
    - name: Build frontend
      working-directory: frontend
      run: npm run build
    - name: Validate chat-menu geometry projection
      if: inputs.scenario == 'chat-menu' || inputs.scenario == 'accounts-and-menu'
      working-directory: frontend
      run: node --experimental-strip-types --test ../scripts/probe_browser_ci_chat_menu_geometry.test.mjs
    - name: Bootstrap backend stack
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash ./scripts/bootstrap_ci_backend.sh
      id: bootstrap
    - name: Verify browser CI backend surface
      shell: bash
      run: |
        docker compose exec -T app python - <<'PY'
        from core.config import settings
        from core.public_webapp_url import public_webapp_url_for_links

        environment = (settings.environment or "").strip().lower()
        server_mode = (settings.server_mode or "").strip().lower()
        if environment != "staging":
            raise SystemExit(f"unexpected environment={environment!r}")
        if server_mode != "iran":
            raise SystemExit(f"unexpected server_mode={server_mode!r}")
        if public_webapp_url_for_links() != "https://browser-ci.iran.example":
            raise SystemExit("unexpected browser CI public WebApp origin")

        from core.telegram_delivery_runtime_policy import (
            TelegramProviderAuthorityError, assert_queue_v1_non_bot_is_producer_only,
            assert_telegram_provider_execution_authority, configured_telegram_delivery_producer_mode,
            configured_telegram_delivery_runtime,
        )
        import asyncio
        import json
        from sqlalchemy import inspect
        from core.db import engine

        assert_queue_v1_non_bot_is_producer_only()
        runtime = configured_telegram_delivery_runtime()
        if (configured_telegram_delivery_producer_mode().value != "queue-v1"
                or settings.trading_bot_service != "api"
                or settings.telegram_delivery_expected_execution_owner != "queue-v1"
                or runtime.mode.value != "producer-only"
                or runtime.legacy_workers_enabled or runtime.queue_worker_enabled
                or settings.telegram_delivery_queue_cutover_ready
                or settings.telegram_provider_test_authority):
            raise SystemExit("unexpected browser CI Telegram producer authority")
        for name in ("bot_token", *(f"telegram_publisher_{i}_bot_token" for i in range(1, 6))):
            value = getattr(settings, name, None)
            if (value.get_secret_value() if hasattr(value, "get_secret_value") else value):
                raise SystemExit("unexpected browser CI provider credential")
        try:
            assert_telegram_provider_execution_authority()
        except TelegramProviderAuthorityError:
            pass
        else:
            raise SystemExit("browser CI producer gained provider execution")
        async def check_outbox_schema():
            try:
                async with engine.connect() as connection:
                    present = await connection.run_sync(lambda db: inspect(db).has_table("offer_publication_states"))
            finally:
                await engine.dispose()
            if not present:
                raise SystemExit("browser CI offer publication schema missing")
        asyncio.run(check_outbox_schema())
        print(json.dumps({"schema": "browser_ci_telegram_producer_surface/1", "producer_only": True,
                          "provider_execution_refused": True, "outbox_schema_present": True,
                          "security_accepted": False}, sort_keys=True))
        PY
        curl -fsS -o /dev/null -X POST http://127.0.0.1:8000/api/auth/dev-login \
          -H 'Content-Type: application/json'
        curl -fsS -o /dev/null -D /tmp/browser-ci-cors.headers \
          -X OPTIONS http://127.0.0.1:8000/api/auth/dev-login \
          -H 'Origin: https://127.0.0.1:4173' \
          -H 'Access-Control-Request-Method: POST'
        grep -qi '^access-control-allow-origin: https://127.0.0.1:4173' /tmp/browser-ci-cors.headers
      id: surface
    - name: Prepare selected CI HTTPS fixture
      id: tls_prepare
      timeout-minutes: 2
      run: |
        node --test scripts/probe_browser_ci_https.test.mjs
        node frontend/scripts/browser-ci-https.mjs prepare
    - name: Trust selected synthetic CI CA
      id: tls
      timeout-minutes: 2
      shell: bash
      run: |
        [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
        browser_ci_ca_anchor="/usr/local/share/ca-certificates/browser-ci-selected-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.crt"
        [[ ! -e "$browser_ci_ca_anchor" && ! -L "$browser_ci_ca_anchor" ]]
        sudo install -m 0644 -- "$BROWSER_CI_TLS_CA" "$browser_ci_ca_anchor"
        browser_ci_ca_identity="$(stat -c '%d:%i:%f:%u:%g:%h:%s:%y:%z' -- "$browser_ci_ca_anchor")"
        printf 'BROWSER_CI_TLS_CA_ANCHOR=%s\nBROWSER_CI_TLS_CA_IDENTITY=%s\n' \
          "$browser_ci_ca_anchor" "$browser_ci_ca_identity" >> "$GITHUB_ENV"
        sudo update-ca-certificates >/dev/null 2>&1
    - name: Observe secure cookie over trusted selected HTTPS
      id: cookie_https
      timeout-minutes: 2
      working-directory: frontend
      env:
        DIAGNOSTIC_BROWSER: ${{ inputs.browser }}
      shell: bash
      run: |
        timeout --signal=TERM --kill-after=2s 75s \
          node ../scripts/probe_browser_ci_secure_cookie.mjs "$DIAGNOSTIC_BROWSER" https \
          > ../tmp/browser-ci-secure-cookie-https.json
        python3 -I -B - "$DIAGNOSTIC_BROWSER" <<'PYCODE'
        import json, sys
        with open('../tmp/browser-ci-secure-cookie-https.json', 'rb') as source:
            raw = source.read(4097)
        if len(raw) > 4096:
            raise SystemExit('https_cookie_report_bound')
        try:
            value = json.loads(raw)
        except (ValueError, UnicodeError):
            raise SystemExit('https_cookie_report_invalid') from None
        if (not isinstance(value, dict) or set(value) != {'browser', 'accepted', 'retransmitted'}
                or value['browser'] != sys.argv[1] or value['accepted'] is not True
                or value['retransmitted'] is not True):
            raise SystemExit('https_cookie_not_accepted_and_retransmitted')
        PYCODE
    - name: Run selected diagnostic scenarios
      working-directory: frontend
      env:
        CI: 'true'
        PLAYWRIGHT_HTML_OPEN: never
        E2E_TARGET_ENV: local
        E2E_ALLOW_LOCAL_MUTATION: local-dev-only
        E2E_BACKEND_BASE_URL: http://127.0.0.1:8000
        E2E_APP_CONTAINER_NAME: trading_bot_app
        E2E_REDIS_CONTAINER_NAME: trading_bot_redis
        DIAGNOSTIC_SCENARIO: ${{ inputs.scenario }}
        DIAGNOSTIC_BROWSER: ${{ inputs.browser }}
      shell: bash
      run: |-
        case "$DIAGNOSTIC_BROWSER" in chromium|firefox|webkit) ;; *) exit 1 ;; esac
        case "$DIAGNOSTIC_SCENARIO" in
          mandatory)
            npx playwright test e2e/mandatory-channel.spec.ts --config=playwright.https-diagnostic.config.ts --project="$DIAGNOSTIC_BROWSER" --retries=0 --workers=1 --grep 'freshly activated web user immediately sees the mandatory room in messenger'
            ;;
          offers)
            npx playwright test e2e/market-offers.spec.ts --config=playwright.https-diagnostic.config.ts --project="$DIAGNOSTIC_BROWSER" --retries=0 --workers=1 --grep 'text offer submission parses and persists a new sell offer'
            ;;
          both)
            npx playwright test e2e/mandatory-channel.spec.ts e2e/market-offers.spec.ts --config=playwright.https-diagnostic.config.ts --project="$DIAGNOSTIC_BROWSER" --retries=0 --workers=1 --grep 'freshly activated web user immediately sees the mandatory room in messenger|text offer submission parses and persists a new sell offer'
            ;;
          chat-menu)
            CI_CHAT_MENU_GEOMETRY=1 npx playwright test e2e/direct-chat.spec.ts --config=playwright.https-diagnostic.config.ts --project="$DIAGNOSTIC_BROWSER" --retries=0 --workers=1 --grep 'direct chat supports reacting to an incoming message and deleting an own message'
            ;;
          accounts-and-menu)
            CI_CHAT_MENU_GEOMETRY=1 npx playwright test e2e/account-status.spec.ts e2e/accountant-owner-flow.spec.ts e2e/direct-chat.spec.ts --config=playwright.https-diagnostic.config.ts --project="$DIAGNOSTIC_BROWSER" --retries=0 --workers=1 --grep 'admin UI deactivation drives inactive UX, global-lock login revocation, and reactivation recovery|owner can create pending accountant, observe activation, view it, and delete its active account|direct chat supports reacting to an incoming message and deleting an own message'
            ;;
          *) exit 1 ;;
        esac
      id: browser
    - name: Collect closed browser CI backend exception metadata
      if: always() && (failure() || cancelled())
      timeout-minutes: 1
      shell: bash
      run: |
        set +e
        mkdir -p tmp
        timeout --signal=TERM --kill-after=2s 15s \
          docker compose logs --no-color --no-log-prefix --tail 2000 app 2>&1 |
          timeout --signal=TERM --kill-after=2s 20s \
            python3 -I -B scripts/extract_browser_ci_backend_exceptions.py \
            > tmp/browser-ci-backend-exceptions.json 2>/dev/null
        pipeline_status=("${PIPESTATUS[@]}")
        python3 -I -B - "${pipeline_status[0]}" "${pipeline_status[1]}" \
          > tmp/browser-ci-backend-exception-status.json <<'PY'
        import json, sys
        producer, projector = (int(value) for value in sys.argv[1:])
        if not all(0 <= value <= 255 for value in (producer, projector)):
            raise SystemExit(1)
        print(json.dumps({"schema": "browser_ci_backend_exception_collection/1",
                          "producer_exit_code": producer, "filter_exit_code": projector}, sort_keys=True))
        PY
        exit 0
    - name: Tear down backend stack
      if: always()
      run: docker compose down --volumes --remove-orphans
      id: cleanup
    - name: Remove only the owned synthetic CI CA anchor
      if: always() && env.BROWSER_CI_TLS_CA_ANCHOR != ''
      id: tls_cleanup
      timeout-minutes: 2
      shell: bash
      run: |
        [[ "$BROWSER_CI_TLS_CA_ANCHOR" == "/usr/local/share/ca-certificates/browser-ci-selected-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.crt" ]]
        [[ "$(stat -c '%d:%i:%f:%u:%g:%h:%s:%y:%z' -- "$BROWSER_CI_TLS_CA_ANCHOR")" == "$BROWSER_CI_TLS_CA_IDENTITY" ]]
        sudo cmp -s -- "$BROWSER_CI_TLS_CA" "$BROWSER_CI_TLS_CA_ANCHOR"
        [[ "$(stat -c '%d:%i:%f:%u:%g:%h:%s:%y:%z' -- "$BROWSER_CI_TLS_CA_ANCHOR")" == "$BROWSER_CI_TLS_CA_IDENTITY" ]]
        sudo rm -- "$BROWSER_CI_TLS_CA_ANCHOR"
        sudo update-ca-certificates >/dev/null 2>&1
    - name: Record diagnostic outcome
      if: always()
      env:
        SOURCE_OUTCOME: ${{ steps.source.outcome }}
        COOKIE_OUTCOME: ${{ steps.cookie.outcome }}
        COOKIE_HTTPS_OUTCOME: ${{ steps.cookie_https.outcome }}
        TLS_PREPARE_OUTCOME: ${{ steps.tls_prepare.outcome }}
        TLS_OUTCOME: ${{ steps.tls.outcome }}
        TLS_CLEANUP_OUTCOME: ${{ steps.tls_cleanup.outcome }}
        BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
        SURFACE_OUTCOME: ${{ steps.surface.outcome }}
        BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
      run: |-
        python3 -I -B - <<'PYCODE'
        import json, os
        from pathlib import Path
        path = Path('tmp/browser-ci-diagnostic.json')
        value = json.loads(path.read_text()) if path.exists() else {
            'schema': 'browser_ci_selected_diagnostic/1', 'source_binding_verified': False,
            'diagnostic_only': True, 'full_matrix_accepted': False, 'security_accepted': False,
        }
        allowed = {'success', 'failure', 'cancelled', 'skipped', ''}
        outcomes = {key: os.environ[key.upper() + '_OUTCOME'] for key in ('source', 'cookie', 'cookie_https', 'bootstrap', 'surface', 'tls_prepare', 'tls', 'browser', 'cleanup', 'tls_cleanup')}
        if not all(item in allowed for item in outcomes.values()):
            raise SystemExit('unknown diagnostic outcome')
        value['step_outcomes'] = outcomes
        value['diagnostic_complete'] = all(item == 'success' for item in outcomes.values())
        path.parent.mkdir(exist_ok=True)
        path.write_text(json.dumps(value, sort_keys=True) + '\n')
        PYCODE
    - name: Upload diagnostic evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: browser-ci-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          frontend/playwright-report
          frontend/test-results
          frontend/playwright-report-production-login
          frontend/test-results-production-login
          tmp/browser-ci-backend-exceptions.json
          tmp/browser-ci-backend-exception-status.json
          tmp/browser-ci-secure-cookie.json
          tmp/browser-ci-secure-cookie-https.json

          tmp/browser-ci-diagnostic.json
        if-no-files-found: ignore
    if: github.repository == 'mohsenbarari/trading_bot'
