name: Canonical App ba938 isolated runtime and whole-image ACL proof

on:
  workflow_dispatch:
    inputs:
      run_smoke:
        description: Run the reviewed ba938 public inventory and unchanged 32 assertions; no security or deployment acceptance
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: security-canonical-app-ba938-runtime-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.repository == 'mohsenbarari/trading_bot' && github.ref == 'refs/heads/security/remediation-20261023' && inputs.run_smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exactly this reviewed controller commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Seal exact source and run disposable ba938 public proofs
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          /usr/bin/python3 -I -S -B deploy/maintenance/ba938_smoke/seal_and_run.py \
            --root "$RUNNER_TEMP/security-app-ci-smoke-ba938-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --source-sha256 2c22d3c47cca11f9415037671b9cb1a9f4d53d493e06578d675dc83bbbca94c4 \
            --execute-reviewed-ba938-proof

      - name: Preserve raw evidence, actual public observations and cleanup
        if: always() && steps.run.outputs.root != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-canonical-app-ba938-runtime-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          archive: true
          overwrite: false
          include-hidden-files: false
          retention-days: 10
          if-no-files-found: error
          path: |
            ${{ steps.run.outputs.root }}/reports/*.json
            ${{ steps.run.outputs.root }}/evidence/public-evidence.zip
