name: Pre-release Gate

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      git_ref:
        description: Optional git ref to validate as a release candidate
        required: false
        type: string
      security_payload:
        description: Build and scan ONLY the sealed baseline plus reviewed security overlay (never deploy)
        required: false
        default: false
        type: boolean
      security_payload_manifest_sha256:
        description: Exact independently prepared public payload.json SHA-256; required for security_payload
        required: false
        type: string
      market_security_payload:
        description: Build only the reviewed E46 historical Market source plus security recipe; never activate
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pre-release-gate-${{ inputs.git_ref || github.sha }}
  cancel-in-progress: true

jobs:
  repository-governance:
    name: repository-governance
    if: '!inputs.market_security_payload'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run repository breadth gate
        run: make test-gate

  market-postgres-gate:
    name: market-postgres-gate
    if: '!inputs.market_security_payload'
    runs-on: ubuntu-latest
    needs: repository-governance
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: market_ci
          POSTGRES_PASSWORD: market_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install -r requirements-test.txt

      - name: Run mandatory market PostgreSQL proofs
        env:
          MARKET_POSTGRES_GATE_ADMIN_URL: postgresql://market_ci:market_ci@127.0.0.1:5432/postgres
          MARKET_POSTGRES_GATE_REDIS_URL: redis://127.0.0.1:6379/14
          FRONTEND_URL: http://127.0.0.1:4173
          JWT_SECRET_KEY: ci_market_postgres_gate_secret
        run: python3 scripts/run_market_postgres_gate.py --expected-sha "$(git rev-parse HEAD)"

      - name: Run real multi-worker Redis proof
        shell: bash
        env:
          APP_ENV_FILE: config/unit-test.env.example
          ENVIRONMENT: test
          SERVER_MODE: foreign
          MARKET_STAGE14_TEST_REDIS_URL: redis://127.0.0.1:6379/14
          REDIS_URL: redis://127.0.0.1:6379/14
          POSTGRES_DB: postgres
          POSTGRES_USER: market_ci
          POSTGRES_PASSWORD: market_ci
          DATABASE_URL: postgresql+asyncpg://market_ci:market_ci@127.0.0.1:5432/postgres
          SYNC_DATABASE_URL: postgresql+psycopg2://market_ci:market_ci@127.0.0.1:5432/postgres
          FRONTEND_URL: http://127.0.0.1:4173
          JWT_SECRET_KEY: ci_market_postgres_gate_secret
        run: |
          set -o pipefail
          python3 -m unittest -v tests.test_realtime_multiworker_redis 2>&1 | tee tmp/market-realtime-redis-gate.log
          python3 scripts/assert_no_unittest_skips.py tmp/market-realtime-redis-gate.log

      - name: Upload market datastore proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-release-market-postgres-${{ github.run_number }}
          path: |
            tmp/market-postgres-gate.log
            tmp/market-realtime-redis-gate.log
          if-no-files-found: error

  observability-gate:
    name: observability-gate
    if: '!inputs.market_security_payload'
    runs-on: ubuntu-latest
    needs: repository-governance
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write CI environment file
        shell: bash
        run: |
          cat > .env <<'EOF'
          SERVER_MODE=foreign
          BOT_USERNAME=ci_test_bot
          POSTGRES_DB=trading_bot_db
          POSTGRES_USER=admin
          POSTGRES_PASSWORD=strongpassword
          DATABASE_URL=postgresql+asyncpg://admin:strongpassword@db:5432/trading_bot_db
          SYNC_DATABASE_URL=postgresql+psycopg2://admin:strongpassword@db:5432/trading_bot_db
          REDIS_URL=redis://redis:6379/0
          FRONTEND_URL=http://127.0.0.1:4173
          DEV_API_KEY=REDACTED_DEV_API_KEY
          JWT_SECRET_KEY=ci_jwt_secret_key_please_override_in_real_envs
          EOF

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Run focused observability gate
        run: |
          make observability-gate
          python3 -m unittest -v tests.test_browser_ci_bootstrap_contract

  frontend-browser-matrix:
    if: '!inputs.market_security_payload'
    name: frontend-browser-matrix (${{ matrix.browser }} shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs:
      - repository-governance
      - observability-gate
      - market-postgres-gate
    timeout-minutes: 75
    env:
      CERTS_HOST_PATH: /tmp/trading-bot-ci-certs
      PRODUCTION_COIN_INFERENCE_SNAPSHOT_HOST_DIR: /tmp/trading-bot-ci-coin-inference
      PRODUCTION_PRODUCT_ESTIMATOR_APP_SNAPSHOT_HOST_DIR: /tmp/trading-bot-ci-product-estimator

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
        shard:
          - 1
          - 2
          - 3
          - 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Write CI environment file
        shell: bash
        run: |
          cat > .env <<'EOF'
          ENVIRONMENT=staging
          SERVER_MODE=iran
          BOT_USERNAME=ci_test_bot
          POSTGRES_DB=trading_bot_db
          POSTGRES_USER=admin
          POSTGRES_PASSWORD=strongpassword
          DATABASE_URL=postgresql+asyncpg://admin:strongpassword@db:5432/trading_bot_db
          SYNC_DATABASE_URL=postgresql+psycopg2://admin:strongpassword@db:5432/trading_bot_db
          REDIS_URL=redis://redis:6379/0
          FRONTEND_URL=http://127.0.0.1:4173
          DEV_API_KEY=REDACTED_DEV_API_KEY
          JWT_SECRET_KEY=ci_jwt_secret_key_please_override_in_real_envs
          EOF
          cat > frontend/.env.local <<'EOF'
          VITE_API_BASE_URL=http://127.0.0.1:8000
          VITE_STAGING_DEV_LOGIN=true
          EOF

      - name: Prepare CI host paths
        run: |
          mkdir -p -- "$CERTS_HOST_PATH" \
            "$PRODUCTION_COIN_INFERENCE_SNAPSHOT_HOST_DIR" \
            "$PRODUCTION_PRODUCT_ESTIMATOR_APP_SNAPSHOT_HOST_DIR"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Bootstrap backend stack
        run: bash ./scripts/bootstrap_ci_backend.sh

      - name: Verify browser CI backend surface
        shell: bash
        run: |
          docker compose exec -T app python - <<'PY'
          from core.config import settings

          environment = (settings.environment or "").strip().lower()
          server_mode = (settings.server_mode or "").strip().lower()
          if environment != "staging":
              raise SystemExit(f"unexpected environment={environment!r}")
          if server_mode != "iran":
              raise SystemExit(f"unexpected server_mode={server_mode!r}")
          PY
          curl -fsS -o /dev/null -X POST http://127.0.0.1:8000/api/auth/dev-login \
            -H 'Content-Type: application/json'
          curl -fsS -o /dev/null -D /tmp/browser-ci-cors.headers \
            -X OPTIONS http://127.0.0.1:8000/api/auth/dev-login \
            -H 'Origin: http://127.0.0.1:4173' \
            -H 'Access-Control-Request-Method: POST'
          grep -qi '^access-control-allow-origin: http://127.0.0.1:4173' /tmp/browser-ci-cors.headers

      - name: Run Playwright browser gate
        working-directory: frontend
        env:
          CI: 'true'
          PLAYWRIGHT_HTML_OPEN: never
          # Explicitly authorize only this hosted runner's disposable stack.
          E2E_TARGET_ENV: local
          E2E_ALLOW_LOCAL_MUTATION: local-dev-only
          E2E_BACKEND_BASE_URL: http://127.0.0.1:8000
          E2E_APP_CONTAINER_NAME: trading_bot_app
          E2E_REDIS_CONTAINER_NAME: trading_bot_redis
        shell: bash
        run: |
          case "${{ matrix.browser }}" in
            chromium)
              npm run test:e2e -- --shard=${{ matrix.shard }}/4
              ;;
            firefox)
              npm run test:e2e:firefox -- --shard=${{ matrix.shard }}/4
              ;;
            webkit)
              npm run test:e2e:webkit -- --shard=${{ matrix.shard }}/4
              ;;
            *)
              echo "Unsupported browser: ${{ matrix.browser }}" >&2
              exit 1
              ;;
          esac

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-release-playwright-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

      - name: Print backend logs on failure
        if: failure()
        run: docker compose logs --no-color app migration db redis

      - name: Tear down backend stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  security-consumer-payload:
    name: security-consumer-payload
    if: github.event_name == 'workflow_dispatch' && inputs.security_payload && !inputs.market_security_payload && github.ref == 'refs/heads/main' && (inputs.git_ref == '' || inputs.git_ref == 'main' || inputs.git_ref == github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      PAYLOAD_SOURCE_COMMIT: ${{ github.sha }}
      PAYLOAD_EXPECTED_MANIFEST: ${{ inputs.security_payload_manifest_sha256 }}
      TRIVY_CONFIG: /dev/null
      TRIVY_IGNOREFILE: /dev/null
      TRIVY_IGNORE_UNFIXED: 'false'
    steps:
      - name: Checkout published main recipe with deployed baseline history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare the exact private capsule parent without adopting unsafe directories
        run: |
          python3 -I -B - <<'PY'
          import json,os,pathlib,stat,sys
          def prepare_output_parent(root):
              if not root.is_absolute() or root.resolve(strict=True)!=root:raise RuntimeError('unsafe_ci_output_parent')
              for path in (root,*root.parents):
                  value=path.lstat()
                  if not stat.S_ISDIR(value.st_mode) or value.st_uid not in {0,os.geteuid()} or value.st_mode&0o022:raise RuntimeError('unsafe_ci_output_parent')
              target=root/'.local'
              try:os.mkdir(target,0o700)
              except FileExistsError:pass
              value=target.lstat()
              if not stat.S_ISDIR(value.st_mode) or stat.S_ISLNK(value.st_mode) or value.st_uid!=os.geteuid() or stat.S_IMODE(value.st_mode)!=0o700 or target.resolve(strict=True)!=target:raise RuntimeError('unsafe_ci_output_parent')
              return target
          try:prepare_output_parent(pathlib.Path.cwd())
          except Exception:
              print(json.dumps({'status':'refused','code':'unsafe_ci_output_parent'}),file=sys.stderr)
              raise SystemExit(1) from None
          PY

      - name: Seal exact Git-only security payload before any build
        id: payload_seal
        run: |
          python3 -I -B scripts/prepare_security_consumer_payload.py \
            --source-commit "$PAYLOAD_SOURCE_COMMIT" --output "$PWD/.local/security-payload"
          python3 -I -B - <<'PY'
          from hashlib import sha1,sha256
          from pathlib import Path
          import json,os,re,types
          def seal_test_sources(root,out,commit,helper):
              assert re.fullmatch('[a-f0-9]{40}',commit)
              specifications=[('test_chat_upload_image_security.py',commit),('test_jwt_codec_security.py',commit),
                  ('test_frontend_static_security.py',commit),('test_coin_intelligence_market_store.py',helper.BASELINE),
                  ('test_coin_intelligence_coin_rate_engine.py',helper.BASELINE),('unit-test.env.example',commit)]
              target=out/'tests';target.mkdir(mode=0o755);target.chmod(0o755)
              rows=[]
              for name,revision in specifications:
                  path='config/unit-test.env.example' if name=='unit-test.env.example' else 'tests/'+name
                  entries=helper.entries(helper.git(root,'ls-tree','-r','-z',revision,'--',path))
                  assert set(entries)=={path} and entries[path][0] in {'100644','100755'}
                  blob=entries[path][1];raw=helper.git(root,'cat-file','blob',blob,maximum=1048576)
                  assert 0<len(raw)<=1048576 and sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==blob
                  helper.write_file(target/name,raw)
                  (target/name).chmod(0o644)
                  rows.append({'name':name,'path':path,'source_commit':revision,'git_blob':blob,'bytes':len(raw),'sha256':sha256(raw).hexdigest()})
              proof={'schema':'security_consumer_test_sources/1','source_commit':commit,'baseline_commit':helper.BASELINE,
                  'files':rows,'runtime_data_included':False}
              raw=(json.dumps(proof,sort_keys=True)+'\n').encode()
              helper.write_file(out/'test-sources.json',raw)
              (out/'test-sources.json').chmod(0o644)
              return sha256(raw).hexdigest()
          expected=os.environ['PAYLOAD_EXPECTED_MANIFEST']
          assert re.fullmatch('[a-f0-9]{64}',expected)
          assert sha256(Path('.local/security-payload/payload.json').read_bytes()).hexdigest()==expected
          with Path('scripts/prepare_security_consumer_payload.py').open('rb') as source:
              helper=source.read(131073)
          assert 0<len(helper)<=131072
          module=types.ModuleType('pre_npm_payload_recipe');module.__file__=str(Path('scripts/prepare_security_consumer_payload.py').resolve())
          exec(compile(helper,module.__file__,'exec'),module.__dict__)
          test_sources=seal_test_sources(Path.cwd(),Path('.local/security-payload'),os.environ['PAYLOAD_SOURCE_COMMIT'],module)
          probe=module.git(Path.cwd(),'show',os.environ['PAYLOAD_SOURCE_COMMIT']+':scripts/verify_image_component_presence.py',maximum=32768)
          assert 0<len(probe)<=32768
          module.write_file(Path('.local/security-payload/component-probe.py'),probe)
          Path('.local/security-payload/component-probe.py').chmod(0o644)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('helper_sha256='+sha256(helper).hexdigest()+'\n')
              output.write('test_sources_sha256='+test_sources+'\n')
              output.write('component_probe_sha256='+sha256(probe).hexdigest()+'\n')
          PY

      - name: Setup security-pinned frontend build runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Build only the sealed security frontend source
        working-directory: .local/security-payload/context/frontend
        run: |
          npm ci
          npm run build

      - name: Build candidate with the existing App Dockerfile and truthful mixed-payload labels
        id: payload-build
        env:
          PAYLOAD_EXPECTED_HELPER: ${{ steps.payload_seal.outputs.helper_sha256 }}
          PAYLOAD_EXPECTED_MANIFEST: ${{ inputs.security_payload_manifest_sha256 }}
          PAYLOAD_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 -I -B - <<'PY'
          from hashlib import sha256
          import json,os,pathlib,re,stat,subprocess,types
          def load_reviewed_helper(root,expected):
              assert re.fullmatch('[a-f0-9]{64}',expected)
              path=root/'scripts/prepare_security_consumer_payload.py'
              assert path.resolve(strict=True)==path
              fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
              try:
                  before=os.fstat(fd)
                  assert stat.S_ISREG(before.st_mode) and before.st_uid==os.geteuid() and before.st_nlink==1 and not before.st_mode&0o022 and 0<before.st_size<=131072
                  raw=os.read(fd,131073)
                  identity=lambda s:(s.st_dev,s.st_ino,s.st_mode,s.st_uid,s.st_nlink,s.st_size,s.st_mtime_ns,s.st_ctime_ns)
                  assert len(raw)==before.st_size and identity(before)==identity(os.fstat(fd))==identity(path.lstat())
              finally:os.close(fd)
              assert sha256(raw).hexdigest()==expected
              helper=types.ModuleType('reviewed_payload_recipe');helper.__file__=str(path)
              exec(compile(raw,str(path),'exec'),helper.__dict__)
              return helper
          root=pathlib.Path.cwd();out=root/'.local/security-payload'
          helper=load_reviewed_helper(root,os.environ['PAYLOAD_EXPECTED_HELPER'])
          raw=helper.read_regular(out/'payload.json',2097152);assert sha256(raw).hexdigest()==os.environ['PAYLOAD_EXPECTED_MANIFEST']
          record=json.loads(raw);dist_sha=helper.verify_context(out/'context',record)
          argv=['docker','--host=unix:///var/run/docker.sock','build','--iidfile',str(out/'candidate-image.id'),'-t','security-consumer-candidate:ci']
          for name,value in helper.image_labels(record,sha256(raw).hexdigest()).items():argv+=['--label',name+'='+value]
          subprocess.run([*argv,str(out/'context')],check=True,timeout=2400)
          image=(out/'candidate-image.id').read_text().strip();assert image.startswith('sha256:') and len(image)==71
          built=(json.dumps({'image_id':image,'baseline_commit':record['baseline_commit'],
              'source_commit':record['source_commit'],'source_tree':record['source_tree'],'payload_tree':record['payload_tree'],
              'payload_manifest_sha256':sha256(raw).hexdigest(),'frontend_dist_sha256':dist_sha,
              'deployment_performed':False},sort_keys=True)+'\n').encode()
          helper.write_file(out/'image-build.json',built)
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('image_id='+image+'\nimage_build_sha256='+sha256(built).hexdigest()+'\n')
          PY

      - name: Exercise exact candidate security and baseline Market behavior without live data
        env:
          PAYLOAD_IMAGE: ${{ steps.payload-build.outputs.image_id }}
          PAYLOAD_TEST_SOURCES_SHA256: ${{ steps.payload_seal.outputs.test_sources_sha256 }}
          PAYLOAD_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 -I -B - <<'PY'
          import os,pathlib,re,subprocess
          image=os.environ['PAYLOAD_IMAGE'];proof=os.environ['PAYLOAD_TEST_SOURCES_SHA256'];commit=os.environ['PAYLOAD_SOURCE_COMMIT']
          assert re.fullmatch('sha256:[a-f0-9]{64}',image) and re.fullmatch('[a-f0-9]{64}',proof) and re.fullmatch('[a-f0-9]{40}',commit)
          root=pathlib.Path.cwd();out=root/'.local/security-payload'
          runner=r'''
          import json,os,pathlib,re,stat,sys,tempfile,types,unittest
          from hashlib import sha1,sha256
          from contextlib import ExitStack
          from unittest.mock import patch
          def bounded_read(path,maximum):
              fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
              try:
                  before=os.fstat(fd)
                  assert stat.S_ISREG(before.st_mode) and before.st_nlink==1 and not before.st_mode&0o022 and 0<before.st_size<=maximum
                  raw=os.read(fd,maximum+1)
                  identity=lambda s:(s.st_dev,s.st_ino,s.st_size,s.st_mtime_ns,s.st_ctime_ns)
                  assert len(raw)==before.st_size and identity(before)==identity(os.fstat(fd))==identity(path.lstat())
                  return raw
              finally:os.close(fd)
          expected,commit,image=sys.argv[1:]
          raw=bounded_read(pathlib.Path('/proof/test-sources.json'),1048576)
          assert sha256(raw).hexdigest()==expected
          proof=json.loads(raw);baseline='ba1f7616ade57558f51bb3a7fbb903243a33aab4'
          assert proof['schema']=='security_consumer_test_sources/1' and proof['source_commit']==commit and proof['baseline_commit']==baseline and proof['runtime_data_included'] is False
          origins={name:commit for name in ('test_chat_upload_image_security.py','test_jwt_codec_security.py','test_frontend_static_security.py','unit-test.env.example')}
          origins.update({name:baseline for name in ('test_coin_intelligence_market_store.py','test_coin_intelligence_coin_rate_engine.py')})
          rows={row['name']:row for row in proof['files']};assert len(rows)==len(proof['files']) and set(rows)==set(origins)
          folder=pathlib.Path('/app/tests');assert {p.name for p in folder.iterdir()}==set(origins)
          sources={}
          for name,revision in origins.items():
              row=rows[name];raw=bounded_read(folder/name,1048576)
              assert row['source_commit']==revision and len(raw)==row['bytes'] and sha256(raw).hexdigest()==row['sha256']
              assert sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==row['git_blob']
              if name.endswith('.py'):sources[name]=raw
              else:configuration=raw
          # Only the trusted native loader bootstrap may run ldconfig. All
          # application/test imports below retain the absolute host/network fence.
          import magic
          private_config=tempfile.TemporaryDirectory(prefix='security-public-test-env-')
          config_path=pathlib.Path(private_config.name)/'unit-test.env.example'
          fd=os.open(config_path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
          with os.fdopen(fd,'wb') as stream:stream.write(configuration)
          os.environ['APP_ENV_FILE']=str(config_path)
          sys.path[:0]=['/app','/app/tests']
          denied=lambda *a,**k: (_ for _ in ()).throw(AssertionError('network/host command forbidden'))
          with ExitStack() as fence:
              fence.callback(private_config.cleanup)
              for target in ('socket.socket.connect','socket.create_connection','socket.getaddrinfo','subprocess.run','subprocess.Popen','urllib.request.urlopen','urllib.request.OpenerDirector.open'):
                  fence.enter_context(patch(target,side_effect=denied))
              suite=unittest.TestSuite()
              for name,raw in sources.items():
                  module=types.ModuleType(name[:-3]);module.__file__=str(folder/name);sys.modules[module.__name__]=module
                  exec(compile(raw,module.__file__,'exec'),module.__dict__)
                  tests=unittest.defaultTestLoader.loadTestsFromModule(module);assert tests.countTestCases()>0
                  suite.addTests(tests)
              result=unittest.TextTestRunner(verbosity=2,stream=sys.stderr).run(suite)
          ok=result.wasSuccessful() and not result.skipped and result.testsRun>0
          print(json.dumps({'schema':'security_consumer_candidate_tests/1','image_id':image,'test_sources_sha256':expected,'modules':len(sources),'tests':result.testsRun,'status':'passed' if ok else 'failed','runtime_data_used':False},sort_keys=True))
          raise SystemExit(0 if ok else 1)
          '''
          argv=['docker','--host=unix:///var/run/docker.sock','run','--rm','--network','none','--read-only','--cap-drop','ALL','--security-opt','no-new-privileges',
              '--memory','1g','--cpus','2','--pids-limit','128','--tmpfs','/tmp:rw,nosuid,noexec,size=128m',
              '--mount','type=bind,source='+str(out/'tests')+',target=/app/tests,readonly',
              '--mount','type=bind,source='+str(out/'test-sources.json')+',target=/proof/test-sources.json,readonly',
              '--env','APP_ENV_FILE=/app/tests/unit-test.env.example',image,'python','-I','-B','-c',runner,proof,commit,image]
          with (out/'candidate-tests.json').open('xb') as output:
              subprocess.run(argv,check=True,timeout=180,stdout=output)
          PY

      - name: Record actual immutable-image component presence without filtering findings
        if: always() && steps.payload-build.outcome == 'success'
        env:
          PAYLOAD_IMAGE: ${{ steps.payload-build.outputs.image_id }}
          PAYLOAD_SOURCE_COMMIT: ${{ github.sha }}
          PAYLOAD_COMPONENT_PROBE_SHA256: ${{ steps.payload_seal.outputs.component_probe_sha256 }}
        run: |
          python3 -I -B - <<'PY'
          from hashlib import sha256
          import os,pathlib,re,stat,types
          path=pathlib.Path('.local/security-payload/component-probe.py')
          expected=os.environ['PAYLOAD_COMPONENT_PROBE_SHA256'];assert re.fullmatch('[a-f0-9]{64}',expected)
          fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
          try:
              before=os.fstat(fd)
              assert stat.S_ISREG(before.st_mode) and before.st_uid==os.geteuid() and before.st_nlink==1 and not before.st_mode&0o022 and 0<before.st_size<=32768
              raw=os.read(fd,32769)
              identity=lambda s:(s.st_dev,s.st_ino,s.st_size,s.st_mode,s.st_mtime_ns,s.st_ctime_ns)
              assert len(raw)==before.st_size and identity(before)==identity(os.fstat(fd))==identity(path.lstat())
          finally:os.close(fd)
          assert sha256(raw).hexdigest()==expected
          module=types.ModuleType('sealed_component_probe');exec(compile(raw,str(path),'exec'),module.__dict__)
          receipt=module.in_container(os.environ['PAYLOAD_IMAGE'],os.environ['PAYLOAD_SOURCE_COMMIT'],raw,expected)
          target=path.parent/'component-presence.json';fd=os.open(target,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
          try:
              view=memoryview(receipt)
              while view:
                  count=os.write(fd,view);assert count>0;view=view[count:]
              os.fsync(fd)
          finally:os.close(fd)
          PY

      - name: Scan the actual candidate including unfixed HIGH and CRITICAL findings
        if: always() && steps.payload-build.outcome == 'success'
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ steps.payload-build.outputs.image_id }}
          scanners: vuln
          vuln-type: os,library
          format: json
          output: .local/security-payload/vulnerabilities.json
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          timeout: 15m

      - name: Preserve actual candidate SBOM even when vulnerability findings block acceptance
        if: always() && steps.payload-build.outcome == 'success'
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ steps.payload-build.outputs.image_id }}
          format: cyclonedx
          output: .local/security-payload/sbom.cdx.json
          timeout: 15m

      - name: Export only the exact built image without rebuilding or accepting it
        id: payload_export
        if: always() && steps.payload-build.outcome == 'success'
        env:
          PAYLOAD_IMAGE: ${{ steps.payload-build.outputs.image_id }}
          PAYLOAD_IMAGE_BUILD_SHA256: ${{ steps.payload-build.outputs.image_build_sha256 }}
        run: |
          python3 -I -B - <<'PY'
          from hashlib import sha256
          import gzip,json,os,pathlib,re,signal,stat,subprocess,time
          root=pathlib.Path.cwd()/'.local/security-payload';image=os.environ['PAYLOAD_IMAGE']
          assert re.fullmatch('sha256:[a-f0-9]{64}',image)
          path=root/'image-build.json';fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
          try:
              before=os.fstat(fd)
              assert stat.S_ISREG(before.st_mode) and before.st_uid==os.geteuid() and before.st_nlink==1 and not before.st_mode&0o022 and 0<before.st_size<=2097152
              raw=os.read(fd,2097153)
              identity=lambda s:(s.st_dev,s.st_ino,s.st_size,s.st_mtime_ns,s.st_ctime_ns)
              assert len(raw)==before.st_size and identity(before)==identity(os.fstat(fd))==identity(path.lstat())
          finally:os.close(fd)
          assert sha256(raw).hexdigest()==os.environ['PAYLOAD_IMAGE_BUILD_SHA256']
          provenance=json.loads(raw);assert provenance['image_id']==image and provenance['deployment_performed'] is False
          target=root/'candidate-image.tar.gz';maximum=2*1024**3
          child=subprocess.Popen(['docker','--host=unix:///var/run/docker.sock','image','save',image],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,start_new_session=True)
          def expired(*_):raise TimeoutError('candidate_image_export_timeout')
          signal.signal(signal.SIGALRM,expired);signal.alarm(300)
          total=0;started=time.monotonic()
          try:
              fd=os.open(target,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
              with os.fdopen(fd,'wb') as output:
                  with gzip.GzipFile(filename='',mode='wb',fileobj=output,mtime=0,compresslevel=6) as archive:
                      while chunk:=child.stdout.read(65536):
                          total+=len(chunk);assert total<=maximum
                          archive.write(chunk);assert output.tell()<=maximum+16*1024**2
                  output.flush();os.fsync(output.fileno())
              assert child.wait(timeout=10)==0 and 0<total<=maximum
          finally:
              signal.alarm(0)
              try:os.killpg(child.pid,signal.SIGKILL)
              except ProcessLookupError:pass
              child.wait(timeout=10);child.stdout.close()
          remaining=int(300-(time.monotonic()-started));assert remaining>0
          signal.alarm(remaining)
          digest=sha256()
          fd=os.open(target,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
          try:
              before=os.fstat(fd)
              assert stat.S_ISREG(before.st_mode) and before.st_uid==os.geteuid() and before.st_nlink==1 and 0<before.st_size<=maximum+16*1024**2
              hashed=0
              while chunk:=os.read(fd,min(1048576,before.st_size+1-hashed)):
                  hashed+=len(chunk);assert hashed<=before.st_size;digest.update(chunk)
              assert hashed==before.st_size and identity(before)==identity(os.fstat(fd))==identity(target.lstat())
          finally:os.close(fd)
          receipt={'schema':'security_consumer_image_export/1','status':'exported_not_accepted','image_id':image,
              'provenance':provenance,'archive':{'name':target.name,'format':'docker-archive+gzip','size_bytes':before.st_size,'sha256':digest.hexdigest(),'uncompressed_bytes':total},
              'elapsed_seconds':round(time.monotonic()-started,3),'runtime_data_included':False,'secrets_disclosed':False,'deployment_performed':False}
          fd=os.open(root/'image-export.json',os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
          with os.fdopen(fd,'w') as stream:json.dump(receipt,stream,sort_keys=True);stream.write('\n');stream.flush();os.fsync(stream.fileno())
          signal.alarm(0)
          PY

      - name: Retain exact public image archive only after complete export proof
        if: always() && steps.payload_export.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: security-consumer-image-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            .local/security-payload/candidate-image.tar.gz
            .local/security-payload/image-export.json

      - name: Upload only public bound source and actual image evidence, never runtime config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-consumer-payload-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            .local/security-payload/payload.json
            .local/security-payload/candidate-image.id
            .local/security-payload/image-build.json
            .local/security-payload/test-sources.json
            .local/security-payload/candidate-tests.json
            .local/security-payload/vulnerabilities.json
            .local/security-payload/component-presence.json
            .local/security-payload/sbom.cdx.json

  market-security-payload:
    name: E46 Market security candidate evidence only
    if: github.event_name == 'workflow_dispatch' && inputs.market_security_payload && github.ref == 'refs/heads/main' && (inputs.git_ref == '' || inputs.git_ref == 'main' || inputs.git_ref == github.sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout only the published recipe revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Seal public Market recipe and bounded command primitives outside its build context
        id: market_seal
        env:
          MARKET_OTHER_PAYLOAD: ${{ inputs.security_payload }}
        run: |
          python3 -I -B - <<'PY'
          from hashlib import sha1,sha256
          import json,os,pathlib,re,stat,subprocess,tempfile
          assert os.geteuid()==1001 and os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
          assert os.environ['MARKET_OTHER_PAYLOAD']=='false'
          os.umask(0o077)
          parent=pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          assert parent.stat().st_uid==1001 and not parent.stat().st_mode&0o022
          root=pathlib.Path(tempfile.mkdtemp(prefix='security-market-e46-',dir=parent))
          for name in ('source','reports','docker-config'):(root/name).mkdir(mode=0o700)
          commit=os.environ['GITHUB_SHA'];assert re.fullmatch('[a-f0-9]{40}',commit)
          pins={'prepare_market_security_payload.py':'a733b9f836fb3b79a1c2306047c2a1b7b7045cfc895e063fca393f7fd95487ed',
                'compose_security_os_candidate.py':'10ccbe216fef04e5f7a7ce2ad31ac30eca7eeae090dfaaf8074fa3cc5c789d44'}
          identity={}
          for name,pin in pins.items():
              path=pathlib.Path('scripts')/name;operand=commit+':'+path.as_posix()
              size=subprocess.run(['git','--no-optional-locks','cat-file','-s',operand],stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,check=True,timeout=10).stdout
              assert re.fullmatch(rb'[1-9][0-9]{0,5}\n',size) and int(size)<=131072
              raw=subprocess.run(['git','--no-optional-locks','cat-file','blob',operand],stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,check=True,timeout=10).stdout
              assert len(raw)==int(size) and sha256(raw).hexdigest()==pin
              fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
              try:
                  before=os.fstat(fd);actual=os.read(fd,131073)
                  identify=lambda s:(s.st_dev,s.st_ino,s.st_mode,s.st_uid,s.st_nlink,s.st_size,s.st_mtime_ns,s.st_ctime_ns)
                  assert stat.S_ISREG(before.st_mode) and before.st_uid==1001 and before.st_nlink==1 and not before.st_mode&0o022
                  assert actual==raw and len(actual)==before.st_size and identify(before)==identify(os.fstat(fd))==identify(path.lstat())
              finally:os.close(fd)
              fd=os.open(root/'source'/name,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
              with os.fdopen(fd,'wb') as output:output.write(raw);output.flush();os.fsync(output.fileno())
              identity[name]={'sha256':pin,'bytes':len(raw),'git_blob':sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()}
          with (root/'source/identity.json').open('x') as output:json.dump({'recipe_commit':commit,'files':identity},output,sort_keys=True)
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a') as output:output.write('root='+str(root)+'\n')
          PY

      - name: Require complete pinned E46 public-source parity before building
        id: market_prepare
        env:
          MARKET_ROOT: ${{ steps.market_seal.outputs.root }}
        run: python3 -I -B "$MARKET_ROOT/source/prepare_market_security_payload.py" prepare --root "$MARKET_ROOT" --repo "$GITHUB_WORKSPACE"

      - name: Build only historical Market product bytes and run all 85 historical tests
        id: market_build
        env:
          MARKET_ROOT: ${{ steps.market_seal.outputs.root }}
        run: python3 -I -B "$MARKET_ROOT/source/prepare_market_security_payload.py" build --root "$MARKET_ROOT"

      - name: Retain every raw Market vulnerability including unfixed findings
        id: market_vulnerabilities
        if: always() && steps.market_build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          TRIVY_IGNOREFILE: /dev/null
        with:
          version: v0.76.1
          image-ref: ${{ steps.market_build.outputs.image_id }}
          scanners: vuln
          vuln-type: os,library
          format: json
          output: ${{ steps.market_seal.outputs.root }}/reports/vulnerabilities.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '0'
          trivy-config: ${{ steps.market_seal.outputs.root }}/empty-trivy.yaml
          timeout: 15m

      - name: Retain the actual Market candidate SBOM
        id: market_sbom
        if: always() && steps.market_build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          TRIVY_IGNOREFILE: /dev/null
        with:
          version: v0.76.1
          image-ref: ${{ steps.market_build.outputs.image_id }}
          format: cyclonedx
          output: ${{ steps.market_seal.outputs.root }}/reports/sbom.cdx.json
          trivy-config: ${{ steps.market_seal.outputs.root }}/empty-trivy.yaml
          timeout: 15m

      - name: Bind raw reports and export the same unaccepted immutable Market image
        id: market_export
        if: always() && steps.market_build.outcome == 'success' && steps.market_vulnerabilities.outcome == 'success' && steps.market_sbom.outcome == 'success'
        env:
          MARKET_ROOT: ${{ steps.market_seal.outputs.root }}
        run: python3 -I -B "$MARKET_ROOT/source/prepare_market_security_payload.py" finalize --root "$MARKET_ROOT"

      - name: Keep only complete public Market image exports
        if: always() && steps.market_export.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: market-e46-security-image-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ steps.market_seal.outputs.root }}/candidate-image.tar.gz
            ${{ steps.market_seal.outputs.root }}/image-export.json

      - name: Keep bounded public Market evidence including failed attempts
        if: always() && steps.market_seal.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: market-e46-security-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ steps.market_seal.outputs.root }}/source/identity.json
            ${{ steps.market_seal.outputs.root }}/payload/payload.json
            ${{ steps.market_seal.outputs.root }}/payload/tests/test-sources.json
            ${{ steps.market_seal.outputs.root }}/reports/*.json
            ${{ steps.market_seal.outputs.root }}/reports/*.log

      - name: Preserve the unwaived raw HIGH and CRITICAL gate
        if: always() && steps.market_export.outcome == 'success'
        env:
          MARKET_ROOT: ${{ steps.market_seal.outputs.root }}
        run: python3 -I -B "$MARKET_ROOT/source/prepare_market_security_payload.py" gate --root "$MARKET_ROOT"
