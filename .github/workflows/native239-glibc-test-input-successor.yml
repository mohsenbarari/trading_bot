name: Exact Native239 glibc84243 reviewed test-input successor
on:
  workflow_dispatch:
    inputs:
      execute:
        description: Build only reviewed local package candidates on one disposable hosted VM
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: glibc84243-Native239-test-input-successor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    if: inputs.execute == true && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/security/remediation-20261023')
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Check out the exact reviewed recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Build full packages with mandatory original vendor and ABI evidence
        id: build
        shell: bash
        run: |
          /usr/bin/python3 -I -S -B deploy/maintenance/glibc_backport_native239/host_ubuntu239.py \
            --repo "$GITHUB_WORKSPACE" --commit "$GITHUB_SHA" \
            --root "$RUNNER_TEMP/glibc84243-ubuntu239-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --source-sha256 017f32b9b026b50203791d4bfeec3174e997fd36dd46013efc3c6c3472da673a \
            --execute-hosted-build --confirm BUILD-ONLY-DISPOSABLE-CI-UBUNTU239-GLIBC-84243-FULL-PACKAGES-20261101-01
      - name: Preserve only completed candidate packages and public proofs
        if: success() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ubuntu239-successor-glibc84243-packages-${{ github.run_id }}-${{ github.run_attempt }}
          archive: true
          overwrite: false
          include-hidden-files: false
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/glibc84243-ubuntu239-${{ github.run_id }}-${{ github.run_attempt }}/package-output/*
      - name: Preserve bounded capacity and QUARANTINED failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ubuntu239-successor-glibc84243-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          archive: true
          overwrite: false
          include-hidden-files: false
          retention-days: 10
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/glibc84243-ubuntu239-${{ github.run_id }}-${{ github.run_attempt }}/result.json
            ${{ runner.temp }}/glibc84243-ubuntu239-${{ github.run_id }}-${{ github.run_attempt }}/hosted-failure.json
            ${{ runner.temp }}/glibc84243-ubuntu239-${{ github.run_id }}-${{ github.run_attempt }}/reports/*
            ${{ runner.temp }}/glibc84243-ubuntu239-${{ github.run_id }}-${{ github.run_attempt }}/reports/native239-raw-failure/*
